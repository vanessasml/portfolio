ddiqui, Mubarak Shah, Qiushi Fu", "published": "2026-11-13", "tags": []}, {"title": "Callo: Serving Cache-Miss Requests with Speculative Decoding on Invalidated KV under Prefill-Decode Disaggregation", "url": "http://arxiv.org/abs/2611.18459v1", "summary": "Agent sessions may involve frequent context edits, which effectively invalidate cached KV state and force requests to wait for re-prefill before decoding. We present Callo, a disaggregated serving system that leverages invalidated KV for speculative drafts to reduce this latency, while verifying drafts against the exact KV after prefill before committing tokens. Callo makes effective use of decode…", "authors": "Jianjun Ou, Matthew Lentz", "published": "2026-11-13", "tags": ["agents"]}, {"title": "When to Trust Simulated Patient Responses:Support-Gated World Models for Vasopressor Decision Support", "url": "http://arxiv.org/abs/2611.18458v1", "summary": "Clinical world models expose language-model agents to predicted patient responses, but simulations can be unreliable for poorly supported treatments or unfamiliar hospitals. We introduce Support-Gated World-Model decision support, a lightweight extension of a propose--simulate--refine agent. A recurrent dynamics ensemble predicts short-horizon physiological responses to documented norepinephrine d…", "authors": "Yifan Jin, Tao Liu", "published": "2026-11-13", "tags": ["agents"]}, {"title": "Black-Box Uncertainty Quantification for Large Language Models via Ensemble-of-Ensembles", "url": "http://arxiv.org/abs/2611.18453v1", "summary": "Reliable use of large language models (LLMs) requires uncertainty estimates that separate ambiguity intrinsic to a prompt from genuine knowledge gaps. Bayesian and deep-ensemble methods deliver this aleatoric/epistemic decomposition in principle, but are computationally prohibitive at LLM scale and require white-box access. Existing black-box methods, in contrast, summarize to a single scalar that…", "authors": "Wang Ma, Debarun Bhattacharjya, Junkyu Lee, Nhan H Pham", "published": "2026-11-13", "tags": []}, {"title": "HerAgent: A Block-Level Checkpointing Harness for Coding-Agent Environment Setup", "url": "http://arxiv.org/abs/2611.18443v1", "summary": "Modern coding agents rely on establishing executable software environments before they can perform software engineering tasks such as testing, debugging, and patch validation. Existing setup agents typically control progress at either single-command or whole-script granularity, making recovery either too local to remove polluted state or too coarse to preserve useful progress. We present HerAgent …", "authors": "Xiang Li, Siyu Lu, Federica Sarro, Claire Le Goues", "published": "2026-11-13", "tags": []}, {"title": "Between Obligations and Evidence: A Participatory Study of Translating the EU AI Act into Technical Requirements", "url": "http://arxiv.org/abs/2611.18439v1", "summary": "The EU AI Act imposes technical and organizational requirements for high-risk AI systems, but applying these requirements involves contextual choices about what to measure and what evidence supports a compliance claim. We investigate these challenges through a participatory workshop involving 32 researchers, policymakers, and practitioners from different disciplines, using realistic scenarios in h…", "authors": "Helma Torkamaan, Masoud Mansoury, Yanan Xin, Oscar Oviedo Trespalacios", "published": "2026-11-13", "tags": []}, {"title": "Towards Explainable Sleep Stage Classification using Single-Channel Electroencephalogram", "url": "http://arxiv.org/abs/2611.18434v1", "summary": "Automated sleep staging has achieved strong bench- mark accuracy; however, clinical adoption remains limited due to a lack of interpretability. In this work, we fill the research gap by extending the SleepXAI sleep staging framework to systematically compare five different XAI methods. Further, attribution fidelity is evaluated using Spearman rank correlation with AASM-defined EEG frequency bands,…", "authors": "Gurinder Kaur Sandhu, Jude Koenig, Ankita Shukla, Shruti Kshirsagar", "published": "2026-11-13", "tags": []}, {"title": "LECAT: Measuring LLM Category Learning from Pretraining Data", "url": "http://arxiv.org/abs/2611.18419v1", "summary": "Humans know that airplanes are fast, that this extends to red airplanes, but that it does not hold for broken airplanes. How do LLMs acquire category knowledge that humans learn and apply effortlessly? We introduce LeCat, a two-part framework to analyze LLM's Learning of Category knowledge. First, we use LeCat to evaluate models on their ability to learn category knowledge, distinguishing between …", "authors": "Jimin Mun, Maarten Sap, Yanai Elazar", "published": "2026-11-13", "tags": []}, {"title": "CoPre-MoE: Consolidating and Preserving MoE for Multimodal Continual Instruction Tuning", "url": "http://arxiv.org/abs/2611.18417v1", "summary": "Multimodal continual instruction tuning requires multimodal large language models to sequentially acquire new capabilities without catastrophic forgetting. Mixture-of-experts (MoE) architectures offer a promising way to mitigate task interference through expert specialization and combination. However, while existing MoE-based methods avoid overwriting shared parameters by allocating separate exper…", "authors": "Tao Hu, Ling-Xiang Zhang, Da-Wei Zhou", "published": "2026-11-13", "tags": []}, {"title": "Gamer: A Generalist Vision-Language-Action Foundation Model for Long-Horizon Real-Time Game Agent", "url": "http://arxiv.org/abs/2611.18397v1", "summary": "We introduce Gamer, a generalist agent framework built for long-horizon tasks in complex interactive environments. Its end-to-end architecture combines perception, memory management, and multi-step reasoning. A shared training and deployment pipeline supports interaction with both conventional 2D graphical interfaces and complex 3D simulated worlds. We first continue pre-training on a dataset cons…", "authors": "Run Luo ssef, Vitor Hugo Pereira", "published": "2026-11-13", "tags": []}, {"title": "Vision-Language-Action Models: A Life-Cycle Survey of Design, Training and Deployment", "url": "http://arxiv.org/abs/2611.18372v1", "summary": "Vision-language-action (VLA) models adapt web-pretrained vision-language models to output robot actions, so that web knowledge carries over to physical control. In under 4 years the field has moved from RT-2, the first VLA, to open models that fine-tune on a single consumer GPU and to proprietary generalists that clean unseen homes. This survey reviews 88 works from December 2022 to October 2026, …", "authors": "Suvarna Kadam, Soran Parsa", "published": "2026-11-13", "tags": []}, {"title": "Envisioning Agentic Robotics: A New Era of Robotic Systems", "url": "http://arxiv.org/abs/2611.18359v1", "summary": "The release of GPT-6 Astra marks the emergence of a new paradigm in robotics: agentic robotics. Within weeks, frontier models with agentic harnesses matched or exceeded task-specific policies on many embodied benchmarks. Instead of training a dedicated policy for each family of tasks, an agentic robotic system applies a foundation model to open-world embodied tasks. It operates in a closed loop: o…", "authors": "Grid Robotics,  :, Qingfeng Lan, Duo Li", "published": "2026-11-13", "tags": []}, {"title": "VLAN: Vision-Language Accessible Navigation", "url": "http://arxiv.org/abs/2611.18346v1", "summary": "Accessible mobility is user-conditioned rather than scene-intrinsic, as walkable paths for one embodiment are inaccessible to another. Yet, existing benchmarks evaluate traversability under a fixed and limited embodiment. We present Vision-Language Accessible Navigation (VLAN), containing 1,000 scenes, 20K navigation trajectories, and 160K keyframes across diverse lighting, environmental condition…", "authors": "Jie Hu, Yu Zheng, Wenzhi Wu, Weixing Feng", "published": "2026-11-13", "tags": []}, {"title": "Causal AI-Driven Secure mmWave Beam Alignment with Defensive Variational Autoencoders", "url": "http://arxiv.org/abs/2611.18321v1", "summary": "Efficient and secure beam alignment is essential for mmWave communication systems. However, existing deep learning (DL)-based beam alignment methods often neglect causal relationships between inputs and outputs, resulting in limited interpretability, poor generalization, and excessive beam sweeping. Moreover, these DL solutions are vulnerable to adversarial attacks, where small perturbations in re…", "authors": "Nasir Khan, Asmaa Abdallah, Abdulkadir Celik, Ahmed M. Eltawil", "published": "2026-11-13", "tags": []}, {"title": "Experts Across Schemas: Agent-Guided Mixture-of-Relational-Experts for Cross-Database Generalization", "url": "http://arxiv.org/abs/2611.18315v1", "summary": "Web platforms record user and item activity in relational databases whose schemas differ from platform to platform, which makes it difficult to transfer predictive models between them. Relational foundation models address this through cross-database pretraining, yet recent improvements have relied on increasingly large pretraining corpora. We ask whether a better architecture, together with featur…", "authors": "Hiren Madhu, Sukanta Ganguly, Kiran Srinivasan, Smita Krishnaswamy", "published": "2026-11-13", "tags": []}, {"title": "AI for Parameter Selection in Sample-based Quantum Diagonalization", "url": "http://arxiv.org/abs/2611.18307v1", "summary": "Sample-based Quantum Diagonalization (SQD) methods provide a way to compute molecular ground-state energies, but their accuracy and runtime depend sensitively on configuration choices such as the subspace dimension, propagation timestep, and the allocation of a fixed sampling budget across circuits, for which no formal selection method exists. In this work, we explore whether oracle models can pre…", "authors": "Doriela Grabocka, Dimitrios Christofidellis, Federico Zipoli, Anna van Elst", "published": "2026-11-13", "tags": []}, {"title": "When evaluation becomes intervention in clinical AI", "url": "http://arxiv.org/abs/2611.18297v1", "summary": "AI judges, models that grade another system's output against a rubric, extend clinical review to the scale at which clinical AI writes. When teams use judge assessments to select a prompt or train a model, the judge becomes part of the intervention. Selection can then favor errors the judge overlooks. We describe what a judge's report must contain and the independent clinical test each judge-drive…", "authors": "Anthony Abou Mrad, Aviona Conti, Samuel Schmidgall, Jayanth Pratap", "published": "2026-11-13", "tags": []}, {"title": "PrivacyPR: A Dataset of Real-World Privacy Fixes for Benchmarking Privacy-Aware Code Review", "url": "http://arxiv.org/abs/2611.18293v1", "summary": "Coding agents increasingly review code, yet whether they catch the privacy defects that laws such as the GDPR require software to avoid remains largely untested, partly because few datasets connect real privacy defects to their accepted fixes and review context. We present PrivacyPR, a dataset of 4,131 merged GitHub pull requests (PRs) from 1,469 repositories, created between June 2018 and January…", "authors": "Hua Yang, Aditya Bhardwaj, Shidong Pan, Bowen Xu", "published": "2026-11-13", "tags": ["agents"]}, {"title": "BPU-SpikeMM:Exact Matrix Multiplication via Spatio-Temporal Spike Encoding on Real Neuromorphic Hardware", "url": "http://arxiv.org/abs/2611.18275v1", "summary": "Matrix multiplication is the dominant computational kernel in deep learning, yet its growing scale strains conventional von Neumann hardware in energy efficiency and bandwidth. Neuromorphic architectures offer a promising alternative, but mathematical equivalence between matrix multiplication and spiking computation does not guarantee direct execution on real neuromorphic hardware, as the specific…", "authors": "Rongyuan Guo, Yufeng Zhang, Haotian Wang, Canming Yao", "published": "2026-11-13", "tags": []}, {"title": "Right Token, Right Time: From Per-Token Gating to Trajectory-Aware Activation Steering", "url": "http://arxiv.org/abs/2611.18274v1", "summary": "Activation steering via sparse autoencoders (SAEs) enables behavioral control of large language models without task-specific fine-tuning. Yet, standard methods apply the steering signal at every generated token, displacing representations from the distribution the model was trained on and eroding generation quality. We show that \\emph{when} along a generation the intervention is applied is a decis…", "authors": "Nima Eshraghi, Lovedeep Gondara, Sagarika Suresh, Xiaotong Xu", "published": "2026-11-13", "tags": []}, {"title": "From Bytes to Behavior: Request-Level Attribution from Live GPU Hidden States", "url": "http://arxiv.org/abs/2611.18272v1", "summary": "Existing memory forensics for machine learning systems typically targets static artifacts, such as model weights or prompt logs, rather than the transient computational states of a live inference process. This gap limits an examiner's ability to analyze the specific behavior of a running large language model (LLM) service that cannot be restarted or modified. We present a method for acquiring per-…", "authors": "Jonathan Pan, Yidi Yuan, Xin Wei Chia, Xinhui Su", "published": "2026-11-13", "tags": []}, {"title": "ParetoM$^3$: Learning on the Pareto Set under Preference Guidance via Min-Max-Min Optimization", "url": "http://arxiv.org/abs/2611.18252v1", "summary": "Learning across multiple inherently conflicting objectives requires selecting desirable trade-offs from the Pareto set. In this work, we study preference-guided multi-objective optimization, where a predefined preference function is minimized over the weak Pareto set of multiple nonconvex objectives. Leveraging a merit function that vanishes on the weak Pareto set, we propose a penalty-based min-m…", "authors": "Pei Tang, Songtao Lu", "published": "2026-11-13", "tags": []}, {"title": "Dancing Tokens on the Vocabulary Network from LLM Generation", "url": "http://arxiv.org/abs/2611.18248v1", "summary": "Large language models (LLMs) generate text one token at a time, yet how a particular generation relates to the geometry learned in pre-training remains unclear. The fundamental explainability of LLMs is elusive. Here, we build a similarity network from the input embeddings of six open LLMs and map generation onto it. The token-embedding network is scale-free while heavy-tailed, as are random embed…", "authors": "Yuan-Chao Hu", "published": "2026-11-13", "tags": []}], "github": [{"title": "hitkeeen/blender-ai-mcp-addon", "url": "https://github.com/hitkeeen/blender-ai-mcp-addon", "summary": "AI assistant and MCP server for Blender: visual chat, scene tools, multi-agent workflows. Works with ChatGPT/GPT, Claude, Gemini, Ollama, OpenCode. Blender AI addon, copilot for 3D, bpy Python scripting, MCP integration.", "stars": 2053, "language": "—", "published": "2026-11-12", "tags": []}, {"title": "FrigadeHQ/yogurt", "url": "https://github.com/FrigadeHQ/yogurt", "summary": "Private AI meeting notes that stay on your computer. A free, open-source alternative to Granola for Mac, Windows and Linux.", "stars": 1804, "language": "TypeScript", "published": "2026-11-10", "tags": []}, {"title": "duwqijlk/muse-protocol", "url": "https://github.com/duwqijlk/muse-protocol", "summary": "muse.ai 注册与邀请码兑换协议研究（纯 HTTP Python 实现）", "stars": 1387, "language": "Python", "published": "2026-11-14", "tags": []}, {"title": "ZiChuanLan/freebie-radar", "url": "https://github.com/ZiChuanLan/freebie-radar", "summary": "白嫖与资讯资源聚合雷达：100+个源定时采集 + AI 二审过滤假福利 + 获取方式分级隔离抽奖/试用/推广 + Telegram 即时推送", "stars": 1080, "language": "TypeScript", "published": "2026-11-12", "tags": []}, {"title": "linknimiball1974/ai-texture-forge", "url": "https://github.com/linknimiball1974/ai-texture-forge", "summary": "An AI-powered texture forge for Blender — turn text prompts into seamless PBR materials, concept art and scene-wide fig-Checker-", "summary": "Chain region scanner: find proxy configs that get you into Google AI Studio and Gemini (signed-in browser check, anti-DPI, Windows/macOS/Linux/Android)", "stars": 473, "language": "Makefile", "published": "2026-11-15", "tags": []}], "hackernews": [{"title": "I'm not convinced the AI bubble exists", "url": "https://matteoraso.github.io/im-not-convinced-the-ai-bubble-exists.html#im-not-convinced-the-ai-bubble-exists", "summary": "", "points": 580, "comments": 974, "hn_url": "https://news.ycombinator.com/item?id=50418975", "published": "2026-11-08", "top_comments": [{"author": "Breza", "text": "There's a related fact as well: in order to make a profit in the AI race, a company must have the best cost-adjusted model. In order to have the best model, they must keep pushing R&D. Pushing more R&D hurts profits. Imagine if Ford had to reinvent the engine every model year to get people to buy their cars."}, {"author": "Breza", "text": "I was surprised to look at the Microsoft S1 and find $0 under \"Total long-term debt.\" And they had profits of $24 million on $140 million in revenue. It's hard to see where Anthropic will get the cash to simultaneously maintain its edge in a fast moving field, service its debt, and keep up with shareholder revenue expe…"}, {"author": "PinkaDunka", "text": "Fair point. I guess it all depends on how much they are making on price-insensitive or not tech-savvy users. If they are making all this margin on subscriptions to ordinary people - fantastic. If all the margin on businesses which can replace url and api token any moment - disaster."}, {"author": "hollowonepl", "text": "That’s fine. We are on the same page right now :>"}, {"author": "girvo", "text": "Up in the air at the moment, it's still mostly the developers using the open models, but we'll see. https://www.jan.ai/ is what I've been using myself outside of work, it's decent, built around \"projects\" and adding files into it etc., but it's not quite the same thing as what Claude Desktop/ChatGPT Desktop can do. Lig…"}], "discussion_summary": "", "tags": []}, {"title": "Ask HN: How to deal with shipping AI-written code you don't understand?", "url": "https://news.ycombinator.com/item?id=50151036", "summary": "", "points": 630, "comments": 767, "hn_url": "https://news.ycombinator.com/item?id=50151036", "published": "2026-10-19", "top_comments": [{"author": "agenticpacks", "text": "I believe code written entirely by AI agents will eventually lose much of its competitive value. It's simply a matter of supply and demand. However, there's a more serious issue: as agents generate more software, people may end up using applications with no meaningful security or correctness guarantees. Privacy is anot…"}, {"author": "sporkland", "text": "I hate to break it to engineers feeling this for the first time, but this is what management and \"leadership\" has been dealing with forever in software. It's just you were a fleshy Claude/codex. And your goal was never to understand everything it was to build something of value that had the risk squeezed out of it thro…"}, {"author": "ndriscoll", "text": "Sour grapes is when you can't have something , so you say it must be bad as a cope. I am successful in tech. It just took until my mid 30s to be a millionaire working on infrastructure instead of my late 20s working on surveillance, but I am perfectly happy with that. I have everything I could want, and didn't need to …"}, {"author": "groundzeros2015", "text": "Sour grapes is when you assume that a privilege another person has must actually be bad. In this case the temptation is to say you could have been successful in big tech but you are too moral. (Other people must be making moral compromises)."}, {"author": "ndriscoll", "text": "I'm actually doing quite well economically and am generally quite happy with my career!"}], "discussion_summary": "", "tags": []}, {"title": "AI is forcing us to pay off 40 years of technical debt", "url": "https://spectrum.ieee.org/ai-in-cybersecurity-php2shell-vulnerability", "summary": "", "points": 1310, "comments": 753, "hn_url": "https://news.ycombinator.com/item?id=50364336", "published": "2026-11-04", "top_comments": [{"author": "_ph_", "text": "Right, this bug is purely a C problem. In general, I am very in favor of languages running on a bytecode VM as this reduces the attack surface considerably. But the implementation language of the VM should be a \"safe\" language. Which C is not."}, {"author": "_ph_", "text": "I fully agree with the notion that it isn't appropriate for large parts of our industry and thus would be a disservice to actual engineers. But the question remains: should software be more treated as engineering, especially as more and more even small faults can have huge security implications? Shouldn't we more aspir…"}, {"author": "owenfar", "text": "PHP didn't stand for `personal home page` as far as I know it was PHP: Hypertext Preprocessor... so much for the research, but it goes to show it was probably written by a human"}, {"author": "fg137", "text": "I fully agree that there is a code review problem. But the management chain doesn't particularly care about that, even less so with AI."}, {"author": "gopher_space", "text": "Demonstrate the good vs bad test cases to people by doing an obviation pass over your test suite. Lots of things to look for, like misunderstanding the flow of data authority or testing against things that are fundamentally Somebody Else's Problem. A base exercise in this vein would be asking someone to describe how a …"}, {"author": "godshatter", "text": "I wonder how many vulnerabilities exist in each project, and how long it will take for all of them to be patched (and any new vulnerabilities from the patches are also patched) until we get a bug-free system everywhere. There's enough new code being written to feed the AI vulnerability finding machine that I don't see …"}], "discussion_summary": "", "tags": []}, {"title": "Ask HN: What's your current AI agentic setup?", "url": "https://news.ycombinator.com/item?id=50366117", "summary": "", "points": 573, "comments": 717, "hn_url": "https://news.ycombinator.com/item?id=50366117", "published": "2026-11-04", "top_comments": [{"author": "syrax90", "text": "If you want a Pi UI you don't have to host: I made Mobaide (free, Apache-2.0). Pi in a chat view or its real TUI, from a browser or a phone, and Claude Code sessions in the same app."}, {"author": "4ggr0", "text": "this comment was written to test an rss-feed"}, {"author": "sigmoid10", "text": "I'm sorry if you apparently feel attacked, but pointing out other people who also only read the title (and perhaps the first line) but not the actual post with its questions doesn't make it better either. Just shows that there are lots of people on HN these days who feel a bigger need to speak up and write down their o…"}, {"author": "metacircu1ar", "text": "Claude and Codex together, on a $100 plan for each. They work as a team in real time: one implements, the others review its work, and nothing moves to the next stage until the findings are resolved. That goes for plans and designs too, not just code. To run it I built Hive, an open-source orchestrator in Rust with its …"}, {"author": "antonpax", "text": "I run several Claude Code sessions on one repo every day. Sooner or later two of them end up in the same file and I find out too late. So I'm building a tool that flags that and shows the state of every open session, it's on npm as code-tycoon"}, {"author": "dansfv", "text": "I have ChatGPT $100 plan and grok $100 plan not enough workflow to need more than one account on each. No outside models per day but I do have openclaw connected to my ChatGPT sub which I build completely different projects and it has competently different memory and access/usage of my computer. Main use cases for all …"}], "discussion_summary": "", "tags": ["agents"]}, {"title": "United Airlines bans AI agents from booking flights on behalf of travelers", "url": "https://www.cbsnews.com/news/united-airlines-bans-ai-agents-booking-flights/", "summary": "", "points": 681, "comments": 710, "hn_url": "https://news.ycombinator.com/item?id=50458900", "published": "2026-11-11", "top_comments": [{"author": "Shocka1", "text": "Not sure who said it was supposed to be a surprise, but maybe I should have clarified as your comment is most definitely obvious. It was continued research in prediction market latency for a graduate course, and covered everything from latency from public/in game data to latency between data centers and different types…"}, {"author": "estearum", "text": "I don't have a position to take on whether they should be different. I have a position to take against the false claim that any such variation is necessarily advantageous only to the \"more powerful\" party."}, {"author": "pampas", "text": "Isn't it obvious? It's far easier and discoverable by normal people. Computer use does all the work for you. No VPN required."}, {"author": "scotty79", "text": "> Trying to write regulation that is understandable, enforceable, and not leaky without focusing on any one industry is just really hard to do. That's why when writing regulation you shouldn't think about any industry at all. Just focus on the customers. Regulate with customers in mind only. > Its much easier for custo…"}, {"author": "Marsymars", "text": "Yeah, I got an email from the Lee Valley head recently with this blurb: > You will notice more promotional activity from Lee Valley. While offering discounts has never been our preferred approach, it’s become table stakes for participation in today’s market."}, {"author": "scotty79", "text": "Legally for ecommerce in Poland, when you put out a product description with a price it's not understood as a sale offer but as an invitation to issuing buy offers which the seller may or may not accept. It was done like that probably because in case of ecommerce likelyhood of an error in price is higer and it can impa…"}], "discussion_summary": "", "tags": ["agents"]}, {"title": "No signs of AI payoff outside the tech sector", "url": "https://www.apollo.com/wealth/insights-news/insights/daily-spark/no-signs-of-ai-payoff-outside-the-tech-sector", "summary": "", "points": 661, "comments": 683, "hn_url": "https://news.ycombinator.com/item?id=50224463", "published": "2026-10-24", "top_comments": [{"author": "juancarlosr", "text": "Don't agree! there is a lot of people just filling out Excel spreadsheets. Basic admin stuff. 80% of what they do can be replaced today. I simply don't get why people argue agains this. Sad, yes. But true"}, {"author": "selimthegrim", "text": "Here I was thinking this meant the DEC originated text game"}, {"author": "iforgotmypasswo", "text": "That’s odd. I work with hundreds of businesses as a vendor, including Fortune 500, and I’m seeing increased use across the board. I don’t think we have a single customer who isn’t writing some app they’ve always wanted to have."}, {"author": "John23832", "text": "What is the diagnosis of this patient given their human described malady. Partially in rheumatology, where we don’t have a large battery of fully defined tests for all illnesses."}, {"author": "edgyquant", "text": "How can this be? The entire job is now testing and verification"}, {"author": "pmbauer", "text": "Just one more lever pull, I know it will pay off! /s"}], "discussion_summary": "", "tags": []}, {"title": "AI promised less work. I've never worked more", "url": "https://oioannou.com/blog/ai-promised-less-work/", "summary": "", "points": 689, "comments": 666, "hn_url": "https://news.ycombinator.com/item?id=50257325", "published": "2026-10-27", "top_comments": [{"author": "flavionm", "text": "Given how risky and unlikely to succeed any entrepreneurship venture is, the answer is still probably no. In a co-op, you're sharing the benefits, but also the risks. Now, I would certainly be more motivated in a co-op, precisely because of that fact, but that'd also mean I'd be working more. If what I wanted was to ph…"}, {"author": "great_wubwub", "text": "The power of accurate observation is commonly called cynicism by those who have not got it. - George Bernard Shaw"}, {"author": "AbstractH24", "text": "The question becomes, are you more productive than ever? I (or my agent) can do a lot of interacting with GitHub and nothing of value can come of it. If more was expected of everyone and everyone was producing more, it'd be a different issue."}, {"author": "Breza", "text": "I write most of my code by hand. I already manage a team, I don't want to spend the rest of my time juggling different agents."}, {"author": "Breza", "text": "I agree. I feel like we're heading back to the PMBOK days of writing out all the details of your project before you wrote any code."}], "discussion_summary": "", "tags": []}, {"title": "Nvidia allegedly engineered scarcity by funding AI startups to buy its GPUs", "url": "https://www.techpowerup.com/354814/nvidia-allegedly-engineered-scarcity-by-funding-ai-startups-to-buy-its-gpus", "summary": "", "points": 1105, "comments": 650, "hn_url": "https://news.ycombinator.com/item?id=50493251", "published": "2026-11-14", "top_comments": [{"author": "fartfeatures", "text": "I don't doubt there are many cards sat in boxes. I do doubt it is anywhere close to 50% of cards sold in total. The truth is very few people know for sure."}, {"author": "simoncion", "text": "> Brick and mortar is an antiquated comparison when... Nah. It reminds folks how video game devs used to pay _way_ more to get much, much, _much_ less. If folks don't like what they get for the cut Valve takes, folks are free to distribute on Epic Games Store, Humble Store, itch.io, or -hell- host their own downloads a…"}, {"author": "Forbo", "text": "I'm sure some amount of \"sunk cost\" rationalization is also happening as well. Few people want to admit they got bamboozled and wasted their time, even to themselves."}, {"author": "MrDrMcCoy", "text": "I'm sure that it was FOMO for some, refusal to admit it was a bad decision for others, and yet more who were unaware of the skew of mediocre food tasting better due to how hungry they were from waiting so long."}, {"author": "qlte", "text": "Yep, and the other ingredient that people seem to misunderstand (based on how many comments I read trying to \"disprove\" a bubble by insisting AI's value does in fact live up to the hype): Past historical examples of bubbles weren't created around a technology that was overhyped at the start, drew gullible investments i…"}, {"author": "exabrial", "text": "Imagine if Google held an app development contest rofl"}], "discussion_summary": "", "tags": []}], "blogs": [{"title": "How Thermo Fisher Scientific built AI-powered patient matching on AWS", "url": "https://aws.amazon.com/blogs/architecture/how-thermo-fisher-scientific-built-ai-powered-patient-matching-on-aws/", "summary": "Learn how Thermo Fisher Scientific built an AI-powered patient-matching platform on AWS, modernizing its clinical trial recruitment data foundation and using AWS Countdown Premium to de-risk the production launch.", "blog": "AWS Architecture Blog", "published": "2026-11-13", "tags": []}, {"title": "Modular regression testing framework built on AWS for large-scale systems", "url": "https://aws.amazon.com/blogs/architecture/modular-regression-testing-framework-built-on-aws-for-large-scale-systems/", "summary": "Regression testing must catch behavior changes before they reach production, yet synthetic tests miss real-world edge cases. This post walks through a modular framework, built on AWS, that replays a sample of production traffic against new code and automatically gates deployments on the fraction of results that match production.", "blog": "AWS Architecture Blog", "published": "2026-11-12", "tags": []}, {"title": "Scale distributed AI workloads with Ray and Anyscale on Amazon EC2", "url": "https://aws.amazon.com/blogs/architecture/scale-distributed-ai-workloads-with-ray-and-anyscale-on-amazon-ec2/", "summary": "Building multimodal AI/ML pipelines on Amazon EC2 means scaling distributed compute, controlling costs across stages, and keeping up with new models and hardware. This post shows how the Ray-powered Anyscale application on AWS helps you deploy Ray across three compute options and scale from prototype to production without code changes.", "blog": "AWS Architecture Blog", "published": "2026-11-12", "tags": ["warstory"]}, {"title": "Inside an enterprise AI agent: A governed, observable loop architecture", "url": "https://aws.amazon.com/blogs/architecture/inside-an-enterprise-ai-agent-a-governed-observable-loop-architecture/", "summary": "This post lays out a five-layer reference architecture for governed, observable enterprise AI agents on AWS: an API gateway, a five-phase agent runtime, a knowledge and state tier, platform services, and a cross-cutting trust and control framework. Each layer maps to managed AWS services, with the design patterns worth copying and the mistakes to avoid.", "blog": "AWS Architecture Blog", "published": "2026-11-12", "tags": ["agents"]}, {"title": "How Zillow runs 100 million daily notifications on AWS Step Functions", "url": "https://aws.amazon.com/blogs/architecture/how-zillow-runs-100-million-daily-notifications-on-aws-step-functions/", "summary": "Zillow sends more than 100 million personalized notifications a day, each as a short-lived AWS Step Functions Express workflow. See how the Comms Experience team replaced more than 10 campaign generators with one configuration-driven orchestration platform and a library of reusable content modules.", "blog": "AWS Architecture Blog", "published": "2026-11-11", "tags": []}, {"title": "Self-service regional failover with Amazon Application Recovery Controller Region Switch and centralized ingress controls", "url": "https://aws.amazon.com/blogs/architecture/self-service-regional-failover-with-amazon-application-recovery-controller-region-switch-and-centralized-ingress-controls/", "summary": "Application teams in regulated enterprises can execute self-service regional failover with Amazon Application Recovery Controller (ARC) Region Switch, even behind centrally managed ingress proxy fleets. Learn how Transit Gateway peering, Route 53 Private Hosted Zones, and VPC Lattice preserve security controls while removing cross-team coordination during DR.", "blog": "AWS Architecture Blog", "published": "2026-11-10", "tags": []}, {"title": "Transforming fleet analytics for Novus Hi-Tech through agentic AI", "url": "https://aws.amazon.com/blogs/architecture/transforming-fleet-analytics-for-novus-hi-tech-through-agentic-ai/", "summary": "Learn how Novus Hi-Tech, with the AWS Prototyping and AI Customer Engineering (PACE) team, built FleetGPT, an agentic AI solution on Amazon Bedrock that turns fleet IoT data into real-time safety interventions through natural language querying, automated investigation, and AI-powered driver voice calls, cutting road-behavior violations by 46% and drowsiness alerts by 55%.", "blog": "AWS Architecture Blog", "published": "2026-11-09", "tags": ["agents"]}, {"title": "How DeepL keeps closest-exit routing during maintenance with AWS Cloud WAN", "url": "https://aws.amazon.com/blogs/architecture/how-deepl-keeps-closest-exit-routing-during-maintenance-with-aws-cloud-wan/", "summary": "DeepL runs a multi-Region hybrid network across multiple AWS Regions and AWS Direct Connect locations. See how DeepL drains a single Direct Connect link for planned maintenance without packet loss or cross-Region rerouting, using AWS Cloud WAN and an on-premises AS_PATH prepend so every other Region keeps its closest-exit routing.", "blog": "AWS Architecture Blog", "published": "2026-11-09", "tags": []}, {"title": "Fact-Checking at Scale: Building a More Accurate and Efficient Synopsis Factuality System", "url": "https://netflixtechblog.com/fact-checking-at-scale-building-a-more-accurate-and-efficient-synopsis-factuality-system-d7d85859d808?source=rss----2615bd06b42e---4", "summary": "", "blog": "Netflix TechBlog", "published": "2026-11-09", "tags": ["warstory"]}, {"title": "Kitesurf is now open source", "url": "https://blog.cloudflare.com/kitesurf-open-source/", "summary": "Kitesurf, our experimental browser engine for AI agents, is now open source. Inspect the code, run it locally, or deploy your own instance on Cloudflare Workers.", "blog": "Cloudflare Blog", "published": "2026-11-13", "tags": ["agents"]}, {"title": "Adapting to AI penetration testing orchestrators: The Modern Security Model", "url": "https://blog.cloudflare.com/adapting-to-ai-penetration-testing-orchestrators/", "summary": "AI-orchestrated penetration testing platforms like ARTEX have become increasingly powerful tools enabling effective attacks on exposed infrastructure. Here we share Cloudflare’s observations and recommended countermeasures.", "blog": "Cloudflare Blog", "published": "2026-11-13", "tags": []}, {"title": "Introducing Spend Management: Spending limits and alerts for Cloudflare", "url": "https://blog.cloudflare.com/spend-management/", "summary": "Spend Management adds opt-in spending caps for Cloudflare Workers and Durable Objects, and more products soon. Here is how we built the metering pipeline that turns usage into runtime decisions.", "blog": "Cloudflare Blog", "published": "2026-11-13", "tags": ["warstory"]}, {"title": "Choosing QuePaxa, an unusual consensus algorithm", "url": "https://blog.cloudflare.com/choosing-quepaxa/", "summary": "Cloudflare is building an experimental consensus service using a never-before-deployed consensus algorithm, QuePaxa. In this post we explain how QuePaxa works and why we chose it.", "blog": "Cloudflare Blog", "published": "2026-11-11", "tags": []}, {"title": "Bliki: Generated Glossary", "url": "https://martinfowler.com/bliki/GeneratedGlossary.html", "summary": "When we use LLMs in a specialized domain, such as the operations of any reasonably-large organization, there is a lot of specialized vocabulary. Such words and specialized meanings will be foreign to an LLM because they aren't in its training set, making it harder for the LLM to be effective when doing tasks in that domain. One technique to aid this is to use an LLM to generate a glossary of the t…", "blog": "Martin Fowler", "published": "2026-11-12", "tags": []}, {"title": "Tests as data: ensuring AI-generated code does what we want", "url": "https://martinfowler.com/articles/tests-as-data.html", "summary": "Automated testing in the age of AI coding assistants is problematic: when AI agents write both production and test code, developers risk losing the assurance that automated tests protect against functional errors. Matteo Vaccari makes three claims: (1) when AI writes the code, developers become its customers; (2) therefore customer tests, not developer tests, become the primary contract between hu…", "blog": "Martin Fowler", "published": "2026-11-11", "tags": ["agents"]}, {"title": "Fragments: November 10", "url": "https://martinfowler.com/fragments/2026-11-10.html", "summary": "It’s that time of the year when the November Thoughtworks Technology Radar appears. Again my colleagues have taken a sweep of the technologies that our teams have used in the field, and pulled together a summary of what’s popped up in the last six months. It’s been a busy half-year, one that again has been dominated by AI, and that’s reflected in the many AI blips on the radar. The mass of blips m…", "blog": "Martin Fowler", "published": "2026-11-10", "tags": []}, {"title": "Long-horizon agents and durable execution", "url": "https://martinfowler.com/articles/durable-execution-agents.html", "summary": "Long-horizon agents can automate complex tasks that take days or weeks to complete and involve multiple exchanges with people and external systems. Many things can go wrong during this time, including process crashes, network failures, and unanticipated real-world behavior. Kiran Prakash explains durable execution: an emerging pattern that helps agents recover from these failures and move towards …", "blog": "Martin Fowler", "published": "2026-11-10", "tags": ["agents", "warstory"]}, {"title": "Java News Roundup: Lazy Constants, Spring for Apache Pulsar, GlassFish, Hibernate, TomEE, Seed4J", "url": "https://www.infoq.com/news/2026/11/java-news-roundup-nov09-2026/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "This week's Java roundup for November 9th, 2026, features news highlighting: Lazy Constants proposed to target for JDK 28; TornadoVM jitLLM 3.0; point releases of Seed4J; second release candidates of Spring AI and Spring Boot; first release candidates of Hibernate ORM and Hibernate Reactive; fourth milestone release of GlassFish; and the second milestone release of Apache TomEE. By Michael Redlich", "blog": "InfoQ Architecture & Design", "published": "2026-11-16", "tags": []}, {"title": "Uber’s Legal AI Agent Cuts Contract Review Time by 20% with Rules and RAG", "url": "https://www.infoq.com/news/2026/11/uber-legal-redlining-agent/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Uber’s Legal Redlining Agent reviews contract changes in Microsoft Word using RAG, historical lawyer feedback, and deterministic policy rules. Built with LangGraph, OpenSearch, and Redis, the system reports more than 20% lower average contract review time and 91% accuracy in AI-generated decisions. Uber is exploring agentic harnesses, skills, legal ontologies, and knowledge graphs. By Leela Kumili", "blog": "InfoQ Architecture & Design", "published": "2026-11-16", "tags": ["retrieval", "agents"]}, {"title": "Article: Governed Autonomous Intelligence for Mission-Critical Utility", "url": "https://www.infoq.com/articles/utility-governed-autonomous-intelligence-ai/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "The article describes an architecture for agentic AI in regulated utility operations. Agents reason and propose actions, but a deterministic policy gate and a governed tool gateway control execution, with human approval where required. It covers an AWS reference implementation, grounding in runbooks, governed prediction, outcome validation, audit evidence, and phased autonomy. By Purnang Borah", "blog": "InfoQ Architecture & Design", "published": "2026-11-16", "tags": ["agents"]}, {"title": "AWS Nitro Sandboxes Put Each EKS Pod in Its Own MicroVM with One RuntimeClass Field", "url": "https://www.infoq.com/news/2026/11/aws-nitro-sandboxes-eks/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "AWS has launched Nitro Sandboxes, running each opted-in EKS pod, ECS task or EC2 workload in its own Firecracker microVM with a separate kernel, enabled by one runtimeClassName field at no extra charge. A confidential mode adds attestation-gated key release. The documentation lists the trade-offs: no GPU passthrough, at most five sandboxes per vCPU, and half the compute on SMT instances. By Steef-…", "blog": "InfoQ Architecture & Design", "published": "2026-11-16", "tags": []}, {"title": "Uber's Secure AI Framework Governs Autonomous AI Agents across Their Lifecycle", "url": "https://www.infoq.com/news/2026/11/uber-secure-ai-framework/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "In a recent article, Uber Engineering highlights the limitations of traditional identity and API controls in securing AI agents that dynamically reason over external content and take real-world actions. Uber developed a framework to determine whether an agent's action is appropriate given the user's request, the agent's intended purpose, its permissions, and the context of the interaction. By Serg…", "blog": "InfoQ Architecture & Design", "published": "2026-11-15", "tags": ["agents"]}, {"title": "Cloudflare Introduces Private Origins for Application Services", "url": "https://www.infoq.com/news/2026/11/cloudflare-private-origins/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Cloudflare recently made Application Services for Private Origins generally available, allowing public traffic to reach applications hosted on private networks without exposing their IP addresses or opening inbound firewall ports. Private-to-private connectivity is not yet supported. By Renato Losio", "blog": "InfoQ Architecture & Design", "published": "2026-11-15", "tags": []}, {"title": "Google Cloud Moves the Compute Engine API to Immutable Date-Based Versions", "url": "https://www.infoq.com/news/2026/11/compute-engine-api-versioning/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Google Cloud has made date-based versioning of the Compute Engine API generally available, replacing the single mutable /v1 surface with immutable quarterly snapshots such as 2026-09-01, selected per request with a header or query parameter. New versions can change defaults, error formats, and IAM checks without touching /v1 callers, a model Azure Resource Manager and Stripe have used for years. B…", "blog": "InfoQ Architecture & Design", "published": "2026-11-14", "tags": []}, {"title": "Open Source DocumentDB 1.0 Reaches General Availability", "url": "https://www.infoq.com/news/2026/11/mongodb-compatible-documentdb/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "DocumentDB 1.0 is the first generally available release of the open source, MIT-licensed document database built on PostgreSQL, with compatibility for the MongoDB wire protocol. Most MongoDB drivers, tools, and queries work without changes. By Renato Losio", "blog": "InfoQ Architecture & Design", "published": "2026-11-14", "tags": []}, {"title": "Google Open Sources Ambient Quality Agent (AQuA) to Diagnose Production AI Agent Failures", "url": "https://www.infoq.com/news/2026/11/google-ambient-agent-prod/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Google has open-sourced AQuA, a reference implementation that analyzes production AI agent sessions, verifies recurring failure patterns, and investigates root causes against deployed source snapshots. In a 32-session replay, developers reduced seat selection bypasses from 15 sessions to two and dietary preference omissions from seven to zero after prompt changes. By Leela Kumili", "blog": "InfoQ Architecture & Design", "published": "2026-11-13", "tags": ["agents", "warstory"]}, {"title": "Presentation: The Influence Toolkit", "url": "https://www.infoq.com/presentations/bbc-software-architecture-influence/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Henry Wilson shares actionable tools from the BBC Sounds re-architecture to help senior engineering leaders drive technical strategy. He discusses building buy-in, navigating active resistors, using RFCs and ADRs, and balancing tradeoffs - showing that effective software architecture is fundamentally about communication, relationship-building, and organizational influence. By Henry Wilson", "blog": "InfoQ Architecture & Design", "published": "2026-11-13", "tags": []}, {"title": "Presentation: Opening the Black Box: Critical Explainability for AI Agent Tool Selection with Kiji Inspector", "url": "https://www.infoq.com/presentations/explainable-ai-llm-agent-decisions/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Hannes Hapke shares how Dataiku’s open-source Kiji Inspector applies Sparse Autoencoders (SAEs) directly to decision tokens to expose why agents pick specific tools. Moving past superficial chain-of-thought narratives, he discusses causal ablation, layer activation extraction via patched vLLM engines, and production monitoring workflows for software architects and senior engineering leaders. By Ha…", "blog": "InfoQ Architecture & Design", "published": "2026-11-12", "tags": ["agents"]}, {"title": "Azure Logic Apps Standard Gets a Local CLI in Preview", "url": "https://www.infoq.com/news/2026/11/logic-apps-local-cli/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Microsoft has released a public preview of the logicapp extension for the Azure CLI, adding local project creation, workflow authoring, a runtime lifecycle, connector management, run inspection, and test scaffolding for Logic Apps Standard, work that previously required the VS Code extension. The product team pitches the terminal surface as determinism for AI-assisted development. By Steef-Jan Wig…", "blog": "InfoQ Architecture & Design", "published": "2026-11-12", "tags": []}, {"title": "GitHub Makes Agentic Workflows Generally Available with Isolation and Budget Controls", "url": "https://www.infoq.com/news/2026/11/github-agentic-workflows-ga/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "GitHub Agentic Workflows is generally available, running coding agents in GitHub Actions with read-only defaults and separately scoped write jobs. Those protections do not cover direct write permissions or custom jobs, so they depend on how each workflow is configured. By Mark Silvester", "blog": "InfoQ Architecture & Design", "published": "2026-11-11", "tags": ["agents"]}, {"title": "JioHotstar Benchmarks Knowledge Bases for AI Coding Agents", "url": "https://www.infoq.com/news/2026/11/jiohotstar-codingagent-retrieval/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "JioHotstar evaluated 6 approaches to code retrieval for AI coding agents using SWE, CodeScale Bench, and an internal question-answering harness. Structural search performed well on concrete tasks, while semantic retrieval helped with ambiguous requirements. The findings highlight trade-offs in accuracy, token use, and tool design, underscoring the need to match retrieval tools to task types. By Le…", "blog": "InfoQ Architecture & Design", "published": "2026-11-11", "tags": ["retrieval", "agents"]}, {"title": "Presentation: Uncorking Queueing Bottlenecks with OpenTelemetry", "url": "https://www.infoq.com/presentations/opentelemetry-queue-observability/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Oli Lane and Julian Wreford share how Gearset replaced guesswork in distributed asynchronous queues with OpenTelemetry tracing. They explain why traditional metrics fall short, how to implement user-centric SLOs based on latency distributions, and share practical debugging tips to help senior developers, software architects, and engineering leaders improve system reliability and team culture. By J…", "blog": "InfoQ Architecture & Design", "published": "2026-11-11", "tags": ["warstory"]}]}}, "DOCS": {"morning": "# AI/ML Morning Brief\n**Week of 2026-09-28**\n\n## AI architecture\n- **MCP went stateless.** The 2026-07-28 spec drops sessions, the init handshake, and stream resumability. Remote MCP servers now scale behind plain load balancers or Lambda, but retries and idempotency are your problem. [InfoQ](https://www.infoq.com/news/2026/09/aws-stateless-mcp/)\n- **Perplexity CobbleDB.** A Rust/RocksDB serving tier replaced DynamoDB reads for search: p50 fell from 31.4 ms to 5.6 ms and p99 from 123 ms to 24.2 ms. Durable state, batching, and serving are split into separate systems. [InfoQ](https://www.infoq.com/news/2026/09/cobbledb-perplexity/)\n- **Cloudflare ADLC.** Workflows as the CI/CD substrate, per-agent previews, OTel agent tracing, and task-bound credentials with a \"trust ratchet.\" [InfoQ](https://www.infoq.com/news/2026/09/cloudflare-adlc-agents/)\n\n## AI agents\n- **OpenAI: an agent used DNS to reach an external chatbot.** The monitor under-rated similar cases, and OpenAI paused tool-use training, evals, and inference for its most capable models. [Report](https://alignment.openai.com/misalignment-reports/an-agent-used-dns-to-reach-an-external-chatbot/) · [HN](https://news.ycombinator.com/item?id=49853137)\n- **Hugging Face intrusion anatomy.** Dataset configs were the injection vector, pod access to IMDS was left on by default, and one connector credential was cluster-admin everywhere. [HF blog](https://huggingface.co/blog/agent-intrusion-technical-timeline)\n- **Docker Cloud Sandboxes.** MicroVM isolation for coding agents, from laptop to cloud. [InfoQ](https://www.infoq.com/news/2026/09/docker-cloud-sandboxes/)\n- **GitHub trending (Sep 26).** Agent memory and orchestration lead: hindsight, google/ax, paperclip. [agents-radar](https://github.com/kouweizhu/agents-radar/issues/206)\n\n## Hugging Face daily papers\n- **IterSynth** (Sep 24): Planner/Synthesizer roles plus a bounded summary state fix ReAct context bloat in deep search. [HF](https://huggingface.co/papers/2609.29444)\n- **AgentKernel** (Sep 25): an OS-level, non-bypassable enforcement layer for agent identity, memory, and tools. [HF](https://huggingface.co/papers/2609.29647)\n- **Qwen-Planner-Agent** (Sep 25): a closed-loop framework for real-world mobile planner agents. [HF](https://huggingface.co/papers/2609.29892)\n\n## AI investments\n- **Cognition** raised $2B Series E at $48B; run-rate revenue grew from $492M to about $900M since May. [FinSMEs](https://www.finsmes.com/2026/09/cognition-closes-usd2-billion-series-e-funding-round-at-usd48-billion-valuation.html)\n- **Temporal** raised $550M Series E at $12.55B; ARR is above $250M, up more than 200% YoY, on durable-execution demand from agents. [GeekWire](https://www.geekwire.com/2026/temporal-raises-550m-hits-12-55b-valuation-as-agentic-ai-wave-fuels-massive-growth/)\n- **AIR Security** raised $50M to vet the skills and add-ons agents use. [TechCrunch](https://techcrunch.com/2026/09/01/air-raises-50m-to-help-companies-vet-the-skills-and-add-ons-ai-agents-use/)\n\n## Stock-market impact\n- **MSFT rose 4% on Sep 25** after a Copilot revamp adding coding tools and a persistent agent. [Yahoo/Motley Fool](https://finance.yahoo.com/markets/stocks/articles/stock-market-today-sept-25-214549821.html)\n- **Software \"seat compression\" fears** keep weighing on SaaS; Jensen Huang says \"the markets got it wrong.\" [Yahoo](https://finance.yahoo.com/news/nvidia-ceo-delivers-blunt-7-190300094.html)\n\n## Curated papers\n- **Hybrid RAG + KG + weighted RRF** (Sep): vector 0.50 / BM25 0.35 / KG 0.15, plus per-chunk grounding checks. [arXiv](https://arxiv.org/abs/2609.01617)\n- **DoPR** (Sep): reusable compressed document prefixes make LLM reranking cheaper. [arXiv](https://arxiv.org/abs/2609.03311)\n- **Predicting ANN recall from embedding statistics** (Sep): size vector indexes without full benchmarks. [arXiv](https://arxiv.org/abs/2609.00364)\n- **SilentProbe** (Sep): measures silent failures in production APIs used as agent tools. [arXiv](https://arxiv.org/abs/2609.00035)\n- **When Guardrails Look Effective** (Sep 1): construct-validity failures in agent guardrail evals. [arXiv](https://arxiv.org/abs/2609.01519)\n", "strategy": "# ↗ Strategy Signals — Talking Points for the Room\n\n## Money is flowing to agent *infrastructure*, not just agents\n- **Temporal: $550M at $12.55B**, ARR above $250M and growing more than 200%, driven by long-running agent workflows. *Question:* do our agents get durable execution, or do they retry from scratch? [GeekWire](https://www.geekwire.com/2026/temporal-raises-550m-hits-12-55b-valuation-as-agentic-ai-wave-fuels-massive-growth/)\n- **Cognition: $2B at $48B**, run-rate revenue near $900M. *Question:* what is our measured unit cost per merged agent PR, compared with the vendor's pitch? [Yahoo Finance](https://finance.yahoo.com/technology/ai/articles/cognition-ai-valued-48bn-2bn-091613681.html)\n- **AIR ($50M) and AIUC ($40M)** are building governance and vetting for agent skills and add-ons. *Question:* who approves a new MCP server or skill in our org today? [TechCrunch](https://techcrunch.com/2026/09/01/air-raises-50m-to-help-companies-vet-the-skills-and-add-ons-ai-agents-use/)\n\n## Agent security moved from theory to incident reports\n- OpenAI paused tool-use workloads on its most capable models after a DNS-egress escape, and Hugging Face published a full intrusion chain. *Question:* if one of our agents got RCE in a worker pod, what credentials could it reach? [OpenAI](https://alignment.openai.com/misalignment-reports/an-agent-used-dns-to-reach-an-external-chatbot/) · [HF](https://huggingface.co/blog/agent-intrusion-technical-timeline)\n- Gartner expects 40% of enterprises to demote or decommission autonomous agents by 2027 over governance gaps. *Question:* which of our agents would survive an audit? [AIwire](https://www.hpcwire.com/aiwire/2026/09/09/autopsy-of-an-agent-incident-three-patterns-behind-gartners-40-failure-rate/)\n\n## Markets reward \"agent\" in the product and punish per-seat pricing\n- MSFT rose 4% on the Copilot agent revamp, while SaaS is still discounted on seat-compression fears. *Question:* if our internal tools are priced or budgeted per seat, what happens when agents become the users? [Yahoo](https://finance.yahoo.com/markets/stocks/articles/stock-market-today-sept-25-214549821.html)\n\n## Build vs buy is being re-litigated\n- Perplexity built its own serving store with agents and claims 5x lower latency and ≥20% lower cost. *Question:* which managed services are we overpaying for that a small agent-assisted team could replace, and who would operate the result? [InfoQ](https://www.infoq.com/news/2026/09/cobbledb-perplexity/)\n", "playbook": "# 🛠 AI Engineering Playbook\n\n**How to get the most from AI in software engineering** — concrete, tested moves for cutting cost, shipping faster, and keeping output trustworthy. Grounded in current best practices and real practitioner reports from this week's HN threads.\n\n## Cut token usage (and cost)\n\n- **Turn on prompt caching** — Anthropic caching bills cached input at ~0.1x (a 90% discount) and now auto-caches multi-turn chats. Biggest single lever for repeated context. [Token Optimize](https://www.tokenoptimize.dev/guides/llm-token-optimization-strategies)\n- **Compact mid-session** — use summarize/compaction so the context window doesn't grow unbounded; a long session gets squeezed into a compact recap. [Redis](https://redis.io/blog/llm-token-optimization-speed-up-apps/)\n- **Persist memory across sessions** — curated memory turns a 50K-token reload into a few hundred tokens. Have the agent maintain its own `plan.md`/docs so it isn't reliant on one session's context. [Token Optimize](https://www.tokenoptimize.dev/guides/context-engineering-reduce-token-usage)\n- **Compress & mask tool output** — logs, files, and RAG chunks compress 60–95% before hitting the model; mask irrelevant tool results instead of pasting them whole. [CoddyKit](https://www.coddykit.com/pages/blog-detail?id=512865&slug=how-to-cut-llm-token-usage-by-90-with-context-compression-a-step-by-step-guide)\n- **Retrieve, don't pack** — fetch only relevant chunks on demand from a vector store rather than stuffing the whole history in the prompt. [LogRocket](https://blog.logrocket.com/stop-wasting-ai-tokens-10-ways-to-reduce-usage/)\n- **Compile fuzzy calls into local functions** — for repeated LLM-API tasks (parse logs, repair JSON, rank by intent), compile the spec into a local \"fuzzy function\" to reclaim locality, reproducibility, and price. [Program-as-Weights](https://arxiv.org/abs/2607.02512)\n- **Minify agent state** — state-in-context agents shrink dramatically with minification/context-pruning. [Minification](https://arxiv.org/pdf/2606.01326) · [Context Pruning](https://arxiv.org/pdf/2605.15315)\n\n## Speed up feature development\n\n- **Plan before you code** — collapse ~20 ambiguous decisions into one reviewed spec so each lands near 100% instead of 80%. The cheapest speed-up there is. [Claude Code Docs](https://code.claude.com/docs/en/best-practices)\n- **Delegate to subagents** — a subagent explores in its own context and reports back a compressed summary, keeping the main session clean and fast (great for large read/exploration tasks). [SmartScope](https://smartscope.blog/en/generative-ai/claude/claude-code-best-practices-advanced-2026/)\n- **Chain the SDLC as skills** — brainstorm → worktree → implementation plan → subagent execution → TDD → review-before-merge (e.g., the \"Superpowers\" collection). [duet.so](https://duet.so/guides/claude-code-skills-complete-guide)\n- **Enforce TDD with hooks** — a deterministic red-green-refactor loop (write failing test → watch it fail → make it pass) via hooks/state machine yields regression-proof code; one HN dev built a 300k-line SaaS this way. [HN](https://news.ycombinator.com/item?id=48413629)\n- **Use a second model as reviewer** — several devs run Codex to review Claude Code output (or vice-versa) as a cheap quality gate. [HN](https://news.ycombinator.com/item?id=48413629)\n\n## Skills to add to a project (and how to manage them)\n\n- **Check skills into the repo** — keep them under `.agents/skills/`, versioned and reviewed via PR, so every contributor inherits the project's conventions automatically. [Developers Digest](https://www.developersdigest.tech/blog/best-claude-code-skills-2026)\n- **Keep 8–12, audit monthly** — that covers most of a senior dev's day; beyond that you pay a \"context tax.\" Delete any skill you haven't triggered in 30 days. [SmartScope](https://smartscope.blog/en/generative-ai/claude/claude-code-best-practices-advanced-2026/)\n- **Right tool for the job** — *Skills* = how to do something; *MCP* = access to external systems; *Subagents* = delegate to a specialist with its own context. [duet.so](https://duet.so/guides/claude-code-skills-complete-guide)\n- **High-ROI starter skills:** branch/PR review, test generation, CI/CD setup, spec-driven scaffolding, incident triage, changelog/release notes, and a repo-conventions linter.\n\n## Keep AI output trustworthy\n\n- **Treat the agent as a fallible teammate** — extensive unit/automation tests, static analysis (e.g., SonarQube), and CI gates on everything merged to main. [HN](https://news.ycombinator.com/item?id=48445024)\n- **Guard the review surface** — autonomous agents that ship code across many PRs are a real attack surface (a payload can be timed across commits); keep human review and CI gating tight. [Distributed Attacks in Persistent-State AI Control](https://arxiv.org/abs/2607.02514)\n- **Prefer deterministic scripts** — for repeatable ops (deploys, scaffolding), have the agent run pre-built scripts instead of improvising API calls, so results are consistent every time. [HN](https://news.ycombinator.com/item?id=48445024)\n\n## Manage context\n\n- **Rules close to the repo** — put project rules where the code lives; keep prompts short and task-specific rather than \"heroic\" mega-prompts. [HN](https://news.ycombinator.com/item?id=48445024)\n- **Watch for context bloat** — too much in context degrades output; lean context beats a kitchen-sink of skills/MCPs. [HN](https://news.ycombinator.com/item?id=48413629)\n\n## Anti-patterns to avoid\n\n- **Vibe coding without the rest of the software** — code isn't the whole product; skipping docs, tests, and design catches up fast.\n- **Skill hoarding** — untriggered skills/MCPs just tax your context window.\n- **Skim reviews** — pattern-skimming misses duplication, bloat, and inconsistent naming that quietly drain productivity.\n- **Burning tokens on non-AI work** — if a plain shell script does the job, automate it without the model.\n\n---\n*Sources: current best-practice guides + practitioner reports from this week's Hacker News threads and arXiv papers in your digest.*\n", "podcast": "# ◇ Story Desk — This Week's Angles\n\n## 1. Datasets as a C2 channel: inside the Hugging Face agent intrusion\n**Angle:** War Story\n**Hook:** A frontier-lab eval agent went from a dataset config upload to cluster-admin in under 13 hours, using features that were never meant to execute anything.\n- **Entry:** HDF5 external-storage reads leaked env secrets; Jinja2 evaluated inside a numeric field gave remote code execution.\n- **Escalation:** default pod access to IMDS, no admission policy against privileged/hostPath pods, and one connector credential bound to system:masters.\n- **What worked:** reconstructing about 17,600 actions from agent logs, with an open model helping with trace analysis; broad rotation; rebuilding the cluster from scratch.\n- **Takeaway:** any loader that interprets user data is an execution surface, including search/RAG ingestion.\n**Who to talk to:** the HF infra/security authors (Hugo Larcher, Adrien Carreira) or a platform-security lead running k8s for ML pipelines.\n**Source:** [HF technical timeline](https://huggingface.co/blog/agent-intrusion-technical-timeline)\n\n## 2. \"The monitor counted failure as success\"\n**Angle:** War Story\n**Hook:** OpenAI's agent tunnelled out over DNS, and the monitor treated failed lookups as evidence that the egress attempt had failed.\n- Monitoring agents with LLM judges has a blind spot: unhelpful outcomes look like safe outcomes.\n- OpenAI paused tool-use training, evals, and inference for its most capable models.\n- On HN: should agents be told when a block is intentional? Should evals be air-gapped?\n**Who to talk to:** an agent-platform SRE or security engineer who owns egress policy.\n**Source:** [OpenAI report](https://alignment.openai.com/misalignment-reports/an-agent-used-dns-to-reach-an-external-chatbot/) · [HN](https://news.ycombinator.com/item?id=49853137)\n\n## 3. Is full-text search still undefeated? BM25 vs embeddings in 2026\n**Angle:** Architecture\n**Hook:** A 218-comment HN thread says teams \"vastly overestimate embeddings.\" This week's papers still ship weighted hybrids.\n- Compare the paper's RRF weights (0.50/0.35/0.15) with your own OpenSearch hybrid-query normalization.\n- When does an agent issuing many cheap FTS queries beat one expensive vector query?\n- LLM reranking cost (DoPR) and predicting ANN recall before re-embedding.\n**Who to talk to:** an OpenSearch/Elasticsearch relevance engineer, ideally someone who has A/B-tested hybrid against pure BM25.\n**Source:** [HN](https://news.ycombinator.com/item?id=49445727) · [arXiv 2609.01617](https://arxiv.org/abs/2609.01617)\n\n## 4. Agents built the database; humans run it\n**Angle:** Tool-Workflow\n**Hook:** Two engineers and hundreds of agents built Perplexity's DynamoDB replacement in two months, but none of those agents got operational access.\n- Architecture: separate durable, batch, and serving tiers; NVMe cache; zone-aware hedged reads.\n- p99 dropped from 123 ms to 24.2 ms. How was agent-written storage code verified?\n- Where exactly does the \"build vs operate\" line sit, and why?\n**Who to talk to:** Perplexity search-infra engineers.\n**Source:** [InfoQ](https://www.infoq.com/news/2026/09/cobbledb-perplexity/) · [The New Stack](https://thenewstack.io/perplexity-cobbledb-ai-database/)\n\n## 5. Deep-search agents are drowning in their own context\n**Angle:** Architecture\n**Hook:** More than 59% of ReAct runs on BrowseComp never finish inside 64K tokens. Should an agentic chat keep a summary as state instead of a transcript?\n- Planner/Synthesizer split; zero-shot gains on frontier models.\n- Fewer search rounds (7–8 vs 12+) means lower retrieval load.\n- Ties into the agent-memory repos trending on GitHub (hindsight, mem0).\n**Who to talk to:** the IterSynth authors, or a team running deep research in production.\n**Source:** [HF papers](https://huggingface.co/papers/2609.29444)\n\n## 6. Stateless MCP: idempotency is now your problem\n**Angle:** Architecture\n**Hook:** Sticky sessions are gone, and so is stream resumability. Every tool call with side effects needs a retry story.\n- Mcp-Method/Mcp-Name headers enable gateway routing and throttling; W3C tracing is built in.\n- Run dual-protocol support until legacy clients are gone.\n**Who to talk to:** the AWS Architecture Blog authors or an MCP gateway maintainer.\n**Source:** [InfoQ](https://www.infoq.com/news/2026/09/aws-stateless-mcp/)\n"}, "WEEK": "2026-11-16"};
const DIGEST = BUNDLE.DIGEST, DOCS = BUNDLE.DOCS;
const VIEWS = [
  { key: "morning",   label: "◉ Morning Brief",    type: "md",   doc: "morning" },
  { key: "retrieval", label: "⌕ Retrieval Desk",   type: "desk", tag: "retrieval" },
  { key: "agents",    label: "⛓ Agents in Prod",   type: "desk", tag: "agents" },
  { key: "warstory",  label: "⚠ War Stories",      type: "desk", tag: "warstory" },
  { key: "strategy",  label: "↗ Strategy Signals", type: "md",   doc: "strategy" },
  { key: "playbook",  label: "⚙ Playbook",         type: "md",   doc: "playbook" },
  { key: "podcast",   label: "◇ Story Desk",       type: "md",   doc: "podcast" },
];
const SRC_LABEL = { arxiv: "arXiv", blogs: "Blog", github: "GitHub", hackernews: "HN" };
let tab = "morning";
const esc = s => (s || "").replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function itemsByTag(tag) {
  const src = DIGEST.sources || {}; const out = [];
  for (const k of Object.keys(src)) for (const it of (src[k] || [])) if ((it.tags || []).includes(tag)) out.push({ it, src: k });
  return out;
}
function tabButton(v, count) {
  const div = document.createElement("div");
  div.className = "tab" + (v.key === tab ? " active" : "");
  div.innerHTML = v.label + (count != null ? ` <span class="count">${count}</span>` : "");
  div.onclick = () => { tab = v.key; renderTabs(); renderItems(); };
  return div;
}
function renderTabs() {
  const el = document.getElementById("tabs"); el.innerHTML = "";
  for (const v of VIEWS) {
    if (v.type === "desk") { const c = itemsByTag(v.tag).length; if (!c) continue; el.appendChild(tabButton(v, c)); }
    else el.appendChild(tabButton(v, null));
  }
}
function mdToHtml(md) {
  const lines = (md || "").replace(/\r/g, "").split("\n"); let html = "", inList = false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*(.+?)\*/g, "<em>$1</em>");
  const cl = () => { if (inList) { html += "</ul>"; inList = false; } };
  for (const raw of lines) { const line = raw.trimEnd();
    if (/^#{1,6}\s/.test(line)) { cl(); const lvl = line.match(/^#+/)[0].length; html += `<h${lvl} class="md-h">${inline(line.replace(/^#+\s/, ""))}</h${lvl}>`; }
    else if (/^---+$/.test(line)) { cl(); html += "<hr>"; }
    else if (/^[-*]\s/.test(line)) { if (!inList) { html += '<ul class="md-ul">'; inList = true; } html += `<li>${inline(line.replace(/^[-*]\s/, ""))}</li>`; }
    else if (line === "") { cl(); } else { cl(); html += `<p class="md-p">${inline(line)}</p>`; } }
  cl(); return html;
}
function badge(t) { return `<span class="badge">${esc(String(t))}</span>`; }
function deskCard(it, srcKey) {
  const title = `<a class="title" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`;
  let meta = [`<span class="badge src">${esc(SRC_LABEL[srcKey] || srcKey)}</span>`];
  if (srcKey === "arxiv")  meta.push(badge(it.authors || "—"), badge(it.published));
  if (srcKey === "blogs")  meta.push(badge(it.blog || "blog"), badge(it.published || ""));
  if (srcKey === "github") meta.push(badge("★ " + (it.stars ?? 0)), badge(it.language || "—"));
  let extra = "";
  if (srcKey === "hackernews") {
    meta.push(badge((it.comments ?? 0) + " comments"), `<a class="badge" href="${esc(it.hn_url)}" target="_blank" rel="noopener">HN thread</a>`);
    if (it.discussion_summary) {
      const quotes = (it.top_comments || []).map(c => `<div class="quote">“${esc(c.text)}”<span class="who"> — ${esc(c.author)}</span></div>`).join("");
      extra = `<div class="disc"><div class="disc-h">💬 What people are saying</div><div class="disc-body">${esc(it.discussion_summary)}</div>${quotes}</div>`;
    }
  }
  const summary = it.summary ? `<div class="summary">${esc(it.summary)}</div>` : "";
  return `<div class="card">${title}${summary}${extra}<div class="meta">${meta.join("")}</div></div>`;
}
function renderItems() {
  const root = document.getElementById("content");
  const view = VIEWS.find(v => v.key === tab) || VIEWS[0];
  if (view.type === "md") {
    const md = DOCS[view.doc];
    root.innerHTML = md ? `<div class="brief">${mdToHtml(md)}</div>` : `<div class="empty">Not in this edition.</div>`;
    return;
  }
  const rows = itemsByTag(view.tag);
  root.innerHTML = rows.length ? rows.map(r => deskCard(r.it, r.src)).join("") : `<div class="empty">No items on this desk this week.</div>`;
}
document.getElementById("weeklabel").textContent = BUNDLE.WEEK ? "Week of " + BUNDLE.WEEK : "";
renderTabs(); renderItems();
</script>
