sions", "url": "http://arxiv.org/abs/2608.14426v1", "summary": "AI is increasingly being used to help with AI R&D. Under certain conditions this feedback loop might be able to produce an intelligence explosion, with rapidly escalating AI capabilities. I explore the mathematics of the most explosive possibilities, with an eye to understanding what drives the dynamics. I show that singular growth (towards a vertical asymptote) is harder to achieve than would be …", "authors": "Toby Ord", "published": "2026-08-14", "tags": []}, {"title": "Knowing When to Stop: Bayesian Optimal Stopping for LLM Evaluations", "url": "http://arxiv.org/abs/2608.14425v1", "summary": "LLM evaluations often use fixed sampling budgets, testing every item the same number of times even after estimates are precise. We introduce optstop, a precision-based adaptive stopping framework that treats evaluation as a sequential measurement problem: keep sampling where uncertainty remains high, and stop where estimates are precise or stable enough. The framework builds on hierarchical Bayesi…", "authors": "Toby D. Pilditch", "published": "2026-08-14", "tags": []}, {"title": "The Past and Future of AI Scientists", "url": "http://arxiv.org/abs/2608.14407v1", "summary": "We present a survey of the past and future of AI Scientists: machines capable of automating science. AI Scientists can originate hypotheses, deduce their consequences, design and execute experiments, interpret their results, and revise their beliefs. Such systems are integrated scientific agents, connected to the literature, formal knowledge, mathematical models, simulations, data-analysis systems…", "authors": "Ross D. King", "published": "2026-08-14", "tags": []}, {"title": "From Style Replication to Style Exploration: Enabling Art Style Exploration with Analyze-Experiment-Resituate Framework", "url": "http://arxiv.org/abs/2608.14405v1", "summary": "Art style is a signature of professional digital artists that develops through repeated exp e in robotic manipulation. However, existing benchmarks mainly evaluate generalization on static manipulation tasks and largely overlook dynamic interaction scenarios. To address this gap, we present ReflexBench, a benchmark for reaction-critical manipulation. ReflexBench contains six dynamic tasks and introduces an eva…", "authors": "Yuxuan Chen, Wanruo Zhang, Xiao Li", "published": "2026-08-14", "tags": []}, {"title": "Wrong but Useful: Trajectory Value Beyond Answer Correctness in Multi-Agent Messages", "url": "http://arxiv.org/abs/2608.14375v1", "summary": "Multi-agent reasoning systems often use agreement, confidence, or automated scores to decide which messages should shape a final answer. Such filtering assumes that a message likely to be correct is also worth keeping. Yet a wrong answer can contain a useful decomposition, constraint, or scientific principle. We test this distinction with Diverse Hypothesis Deliberation (DHD), a controlled measure…", "authors": "Chih-Hsuan Yang, Anjir Ahmed Chowdhury, Cheng-Hau Yang, Weijian Zheng", "published": "2026-08-14", "tags": []}, {"title": "A Hybrid LLM-Based Framework for Automated Security Annotation Generation in Business Process Models", "url": "http://arxiv.org/abs/2608.14370v1", "summary": "The modelling and analysis of secure business processes require the incorporation of security annotations into process models. Although BPMN extensions, including SecBPMN2, exist for this purpose, the derivation of accurate and complete security annotations from natural-language specifications remains a manual, expert-intensive, and error-prone task. This paper presents a hybrid framework that tak…", "authors": "Md Kamrul Islam, Tiphaine Henry, Mattia Salnitri, Julius Köpke", "published": "2026-08-14", "tags": []}, {"title": "Mind the Long Tail: Understanding the Difficulty of Delay Detection in Business Processes", "url": "http://arxiv.org/abs/2608.14367v1", "summary": "The early detection of delayed cases in business processes is a critical capability for organizations. Predictive process monitoring (PPM) supports this task by using historical event logs to predict the remaining time of ongoing cases, enabling timely interventions to avoid missed deadlines and service level violations. Although remaining time prediction has advanced considerably through sophisti…", "authors": "Keyvan Amiri Elyasi, Lukas Kirchdorfer, Heiner Stuckenschmidt", "published": "2026-08-14", "tags": []}, {"title": "Designing Sustainable Federated Learning as a Service using Neural Architecture Search", "url": "http://arxiv.org/abs/2608.14359v1", "summary": "The sustainability constraints of FLaaS consumers pose significant challenges to maintaining carbon-feasible federated training in FLaaS environments. These constraints often lead to infeasible consumer participation and unstable federated training under hard carbon constraints. We propose a Sustainable Federated Learning as a Service (SFLaaS), a carbon- constrained Neural Architecture Search (NAS…", "authors": "Keya Patel, Sajib Mistry, Sheik Fattah, Deepak Kanneganti", "published": "2026-08-14", "tags": []}, {"title": "Disentangled Shared Representations Improve Morpho-Transcriptomic Integration", "url": "http://arxiv.org/abs/2608.14355v1", "summary": "Spatial transcriptomics (ST) enables the simultaneous profiling of gene expression and tissue morphology, creating an opportunity to learn multimodal representations capturing shared morpho-transcriptomic structure. However, standard multimodal models often compress modalities into a common latent space without explicitly separating shared and modality-specific sources of variation, which may limi…", "authors": "Julian Ostermaier, Swann Ruyter, Reuben Dorent, Daniel Racoceanu", "published": "2026-08-14", "tags": []}, {"title": "ScienceFlow: A long-horizon agent for ML research, scientific discovery and beyond", "url": "http://arxiv.org/abs/2608.14354v1", "summary": "Enabling LLM agents to sustain productive, stable, and goal-aligned research over extended horizons is a central challenge for autonomous machine learning and scientific discovery, as progress hinges on continuously managing evolving state, exploration decisions, and computational resources. Pioneering autoresearch agents, despite great success, still lack mechanisms for continuity, recovery from …", "authors": "Mingming Zhao, Jiqian Dong, Kangping Xu, Zadid Hasan", "published": "2026-08-14", "tags": ["agents"]}], "github": [{"title": "guillaumemeyer/watermarks-remover", "url": "https://github.com/guillaumemeyer/watermarks-remover", "summary": "Strip multi-vendor AI provenance marks: Unicode text hygiene, statistical rewrite hooks, and C2PA/metadata from PNG/JPEG/SVG/PDF/DOCX/HTML/MD", "stars": 12319, "language": "Python", "published": "2026-08-11", "tags": []}, {"title": "Leutenegger/book-to-skill", "url": "https://github.com/Leutenegger/book-to-skill", "summary": "Turn any technical book PDF into a Claude Code skill — ready to study, reference, and use while you work.", "stars": 1162, "language": "Python", "published": "2026-08-13", "tags": []}, {"title": "vercel-labs/eve-software-factory-template", "url": "https://github.com/vercel-labs/eve-software-factory-template", "summary": "Meet Foreman, an eve Software Factory.", "stars": 842, "language": "TypeScript", "published": "2026-08-12", "tags": []}, {"title": "shadcn-ui/chatbot-template", "url": "https://github.com/shadcn-ui/chatbot-template", "summary": "A minimal chatbot template built with Next.js, AI SDK, shadcn/ui, shadcn/react, shadcn/typeset. It runs on the Vercel AI Gateway.", "stars": 707, "language": "TypeScript", "published": "2026-08-11", "tags": []}, {"title": "0xsline/awesome-deepseek-harness", "url": "https://github.com/0xsline/awesome-deepseek-harness", "summary": "DeepSeek Harness (DSH) ecosystem: curated plugins, tools, and infrastructure from dsh-external/hub and the public dsh-plugin topic.", "stars": 652, "language": "Python", "publ o were able to murder people they disliked and were forced to stop that"}, {"author": "matkoniecz", "text": "For me Russia is a priority as both most dangerous personally, geopolitically and for family reasons (for start, grand-grand-father was murdered as part of Katyń massacre). So I am fine with singling out Russia."}], "discussion_summary": "", "tags": []}, {"title": "AI is removing the middle class of software engineering?", "url": "https://blog.florianherrengt.com/ai-removing-middle-class-software-engineering.html", "summary": "", "points": 997, "comments": 933, "hn_url": "https://news.ycombinator.com/item?id=49271994", "published": "2026-08-12", "top_comments": [{"author": "dijit", "text": "the requirements to be a dentist are vastly different than that of a brain surgeon. Yet, both have to have medical degrees in order to be called doctors. That you specialise after the fact doesn't really mean what you imply, not everyone who becomes a doctor can do brain surgery."}, {"author": "groundzeros2015", "text": "Yes the framing above is “business people don’t listen to engineers but if they had a credential they would legally be forced to”. And I think both are false. The top engineers on a project are collaborators with leaders in other areas like marketing, sales, IT, legal, etc. And all those have influence on a project. A …"}, {"author": "kian", "text": "Who said anything about a corporate context? :)"}, {"author": "groundzeros2015", "text": "> Milton Friedman was a libertarian crank. That's not an argument. > I'm quite happy that doctors and lawyers are licensed. But you're not happy that you have to pay for 10 years of medical or law school for a broken bone or employment contract. The government could license a gradient of qualifications to better match …"}], "discussion_summary": "", "tags": []}, {"title": "China’s open-weights AI strategy is winning", "url": "https://werd.io/american-ai-is-locked-down-and-proprietary-its-losing/", "summary": "", "points": 1243, "comments": 932, "hn_url": "https://news.ycombinator.com/item?id=48979269", "published": "2026-07-20", "top_comments": [{"author": "lluisantoni", "text": "It feels like governments might not be as stable as a company to fund large scale research given how many years can a government last. I have discussed with a friend at Argonne National Laboratory how quickly projects can die and management change based on ruling party. That being said, there are some topics the US gov…"}, {"author": "azinman2", "text": "First, it’s more than breaking a terms of service. That language sounds very minimizing, as if the scale and effect is tiny. It’s basically espionage out in the open that bootstraps other models years into the competition, which is effectively stealing billions worth of development, compute, and leadership status. Next…"}, {"author": "nonethewiser", "text": "How can you say Institut Pasteur single handedly pushes the industry forward? It has 0 novel approvals per year and spends about $0.4B/yr in R&D. Compared to about 35 novel approvals and $120B per year from the US pharmaceutical industry."}, {"author": "danny_codes", "text": "Probably. I mean I don't think anyone would choose Lawyer as the leading profession for leadership. It's a \"largely useless\" profession outside of it's very narrow context."}, {"author": "HDBaseT", "text": "Censorship exists in all models. I don't see why the US gets an infallible pass. Ask Claude to do the same with a Palestine Genocide function. If anything, this is an argument FOR open models, so we can run them and tune them ourselves, for our own needs."}], "discussion_summary": "", "tags": []}, {"title": "Startup founders urge U.S. government not to shut off Chinese open weight AI", "url": "https://www.politico.com/news/2026/07/22/startup-founders-urge-trump-not-to-shut-off-chinese-open-weight-ai-01008992", "summary": "", "points": 1069, "comments": 889, "hn_url": "https://news.ycombinator.com/item?id=49023016", "published" ential here. Moreover, the value being discussed is long-term geopolitical leverage resulting from a country's sovereign technology capability that remains unperturbed under…"}], "discussion_summary": "", "tags": []}, {"title": "Google fixed more Chrome bugs in June than over the past two years, thanks to AI", "url": "https://blog.google/security/chrome-stronger-with-every-update/", "summary": "", "points": 585, "comments": 610, "hn_url": "https://news.ycombinator.com/item?id=49120097", "published": "2026-07-31", "top_comments": [{"author": "epinephrinios", "text": "The Google Home is hot garbage. I do like the hardware though."}, {"author": "fluffybucktsnek", "text": "In my case, the crashes were from last year to the start of this one. Some were related to AMDGPU, others to my WiFi card driver, so they're pretty recent. I don't quite remember the details of the shell crash, I only remember it being on a tool that've never seem crash due to a fault signal. It was somewhat amusing."}, {"author": "ygjb", "text": "Sure. Wealth has always given early adopters and first movers wings. As hardware specs get better, and model providers keep making different classes of mistakes that alienate users, more people will opt for or support local models. I tend to take Schneiers' \"Attacks only improve\" philosophy and apply it to damn near ev…"}, {"author": "uecker", "text": "I certainly also remember the kernel crashing, but this was in the 90s. Later perhaps once or twice on faulty hardware. Shell, I don't think I have seen this ever."}, {"author": "fluffybucktsnek", "text": "I did, in Linux. It was pretty common too. It got fix. But, every now and then, I still get an occasional panic. I also recall having my shell crashing (zsh or bash, I don't remember)."}, {"author": "tolciho", "text": "And that slop increases the range of things bikesheddable, like having free kerosene and matches available at an Arson Anonymous meeting."}], "discussion_summary": "", "tags": []}, {"title": "Mark Zuckerberg attacks 'closed' AI rivals as Meta returns to open models", "url": "https://www.ft.com/content/4e3957f8-ea7c-4c46-a3de-cdce8e526878", "summary": "", "points": 641, "comments": 600, "hn_url": "https://news.ycombinator.com/item?id=49243880", "published": "2026-08-10", "top_comments": [{"author": "iugtmkbdfil834", "text": "None of your questions really invalidate anything and you assume a lot. FWIW, I was joking, but did you know in stylometry, punctuation tends to remain surprisingly stable?"}, {"author": "Forgeties79", "text": "Don’t be an ass, you are either “joking” or didn’t think about this for more than 4 seconds. You don’t know who I am, you don’t know my name, even if we know each other in real life you literally do not know who I am right now. Have a good rest of your week"}, {"author": "numpad0", "text": "My apologies, looks like I just completely forgot about GPT-2..."}, {"author": "pjmlp", "text": "On some AMD drivers, mostly in what serves selling SteamDeck. Which they could also do with proprietary drivers, or do you think Nintendo just sits around waiting for NVidia driver updates to the Switch? Partner agreements exist for a reason."}, {"author": "flaburgan", "text": "Well that's the interesting part actually, it's true that they don't give their Linux driver as much love as they could, but someone is fixing the bugs: Valve is doing an amazing job on AMD drivers. Something which would be totally impossible with the proprietary drivers of Nvidia. So exactly my point."}], "discussion_summary": "", "tags": []}, {"title": "What AI did to stackoverflow in a graph", "url": "https://data.stackexchange.com/stackoverflow/query/1953768#graph", "summary": "", "points": 483, "comments": 585, "hn_url": "https://news.ycombinator.com/item?id=48956949", "published": "2026-07-18", "top_comments": [{"author": "zahlman", "text": "No excuse is required, because there's nothing wrong with it."}, {"author": "zahlman", "text": "The system for managing chat rooms was buggy, but the entire point of the chat rooms was to keep things out of the way long term. If the invitation comment didn't also get deleted, that was a system bug. As someone who comes by \"in the present\", you are not supposed to go through a chat room to figure out whether \"some…"}, {"author": "fenomas", "text": "> The site is not about solving your problem. The site is about answering your question. The point stands either way, reread my comment. When you ask a question on SO and somebody posts a regular answer, you the asker decide whether they've answered your question/solved your problem/Xed your Y/whatever else. Until you …"}, {"author": "20k", "text": ">People with the attitude you demonstrate here are consistently among the worst-behaved and hardest-to-deal-with participants on the meta site, because of a stubborn refusal to accept a core principle of the site. Most edits I saw to answers on stack overflow were crap though, the system was regularly abused That stubb…"}, {"author": "kazinator", "text": "These kinds of incidents always remind me of https://wiki.c2.com/?KornShellStory"}, {"author": "DrewADesign", "text": "Sorry, I’m not going to read your >1000 word reply. So far the only thing you’ve convinced me of is that I’d accurately gauged how zealously out-of-touch the people behind that mess were. Have a good one."}], "discussion_summary": "", "tags": []}], "blogs": [{"title": "Serverless vehicle tracking at scale: Bosch L.OS on AWS", "url": "https://aws.amazon.com/blogs/architecture/serverless-vehicle-tracking-at-scale-bosch-l-os-on-aws/", "summary": "Learn how Bosch Mobility Platform Solutions built L.OS, a serverless vehicle tracking platform on AWS that unifies India's fragmented spot logistics market into a single real-time visibility layer using Amazon ECS, AWS Lambda, and Amazon MSK.", "blog": "AWS Architecture Blog", "published": "2026-08-14", "tags": ["warstory"]}, {"title": "Track generative AI costs with Amazon Bedrock inference profiles", "url": "https://aws.amazon.com/blogs/architecture/track-generative-ai-costs-with-amazon-bedrock-inference-profiles/", "summary": "Learn how to track generative AI costs by department using Amazon Bedrock application inference profiles and AWS cost allocation tags. Create tagged profiles for each team and view per-department cost breakdowns in AWS Cost Explorer.", "blog": "AWS Architecture Blog", "published": "2026-08-13", "tags": []}, {"title": "Recovery strategies to meet data residency requirements", "url": "https://aws.amazon.com/blogs/architecture/recovery-strategies-to-meet-data-residency-requirements/", "summary": "Learn three strategies for achieving disaster recovery while meeting data residency requirements. Ranging from encryption-based controls on multi-Region replication to fully in-country architectures, these patterns help you balance recovery objectives with regulatory constraints.", "blog": "AWS Architecture Blog", "published": "2026-08-13", "tags": []}, {"title": "Reducing Text2SQL latency with parameterized query templates", "url": "https://aws.amazon.com/blogs/architecture/reducing-text2sql-latency-with-parameterized-query-templates/", "summary": "Learn how parameterized query templates reduced Text2SQL latency by 80% and cut token consumption by over 50%. This post covers the architecture behind an intelligent caching layer that uses semantic similarity to match user questions to SQL templates, bypassing expensive LLM calls.", "blog": "AWS Architecture Blog", "published": "2026-08-13", "tags": ["warstory"]}, {"title": "Adobe Firefly: Simplified observability with Amazon Managed Prometheus", "url": "https://aws.amazon.com/blogs/architecture/adobe-firefly-simplified-observability-with-amazon-managed-prometheus/", "summary": "Learn how Adobe Firefly achieved 28x faster GPU metric queries by migrating from self-managed Prometheus to Amazon Managed Service for Prometheus, with improvements in query performance, infrastructure reliability, and operational efficiency.", "blog": "AWS Architecture Blog", "published": "2026-08-13", "tags": ["warstory"]}, {"title": "Scaling patterns for self-organizing multi-agent clusters with Kiro", "url": "https://aws.amazon.com/blogs/architecture/scaling-patterns-for-self-organizing-multi-agent-clusters-with-kiro/", "summary": "Learn how to coordinate AI agents through shared state in Amazon S3 instead of a central orchestrator. Deploy and observe self-organizing agent clusters on Amazon EC2 with the open-source kiro-flock reference implementation.", "blog": "AWS Architecture Blog", "published": "2026-08-11", "tags": ["agents", "warstory"]}, {"title": "How Cloudflare detects MCP traffic and helps secure it", "url": "https://blog.cloudflare.com/mcp-security-updates/", "summary": "Cloudflare Gateway identifies MCP requests using protocol-level heuristics. Security teams can use that signal to find shadow MCP traffic, enforce Portal-only access for approved servers, and block direct connections on managed network paths.", "blog": "Cloudflare Blog", "published": "2026-08-14", "tags": ["agents"]}, {"title": "Secure all your internal vibe-coded applications — in one click", "url": "https://blog.cloudflare.com/workers-protected-by-access/", "summary": "Introducing Cloudflare Access for Workers. Attach an Access policy directly to a Worker and it applies everywhere that Worker runs — routes, custom domains, workers.dev, and previews — automatically.", "blog": "Cloudflare Blog", "published": "2026-08-14", "tags": []}, {"title": "Total eclipse of the Internet: traffic impacts in Iceland, Spain, and Portugal", "url": "https://blog.cloudflare.com/total-eclipse-internet-traffic-iceland-spain-portugal/", "summary": "Cloudflare's data shows a clear impact on Internet traffic from Iceland to Spain and Portugal, following the path of totality of the total solar eclipse that occurred on August 12, 2026.", "blog": "Cloudflare Blog", "published": "2026-08-13", "tags": []}, {"title": "Certificate Transparency Monitoring is now generally available", "url": "https://blog.cloudflare.com/certificate-transparency-monitoring-ga/", "summary": "Cloudflare's Certificate Transparency Monitoring is now generally available. The biggest change: we no longer email you about certificates Cloudflare issued for your domain, so when an alert lands in your inbox, it's worth a look.", "blog": "Cloudflare Blog", "published": "2026-08-13", "tags": []}, {"title": "Cloudflare DDoS Threat Report H1 2026: 1 Tbps attacks soar as DNS floods and geopolitical tensions drive a new wave", "url": "https://blog.cloudflare.com/ddos-threat-report-2026-h1/", "summary": "In the first half of 2026, Cloudflare detected a 519% surge in hyper-volumetric DDos attacks across its network. These attacks were driven heavily by DNS and CLDAP reflection vectors. This report breaks down how major geopolitical conflicts reshaped the global cyber threat landscape.", "blog": "Cloudflare Blog", "published": "2026-08-11", "tags": []}, {"title": "Everything we launched during Agents Week", "url": "https://blog.cloudflare.com/agents-week-review-august-2026/", "summary": "Our latest Agents Week has come to a close. Here’s a recap of all the announcements we made from Wallets to Radar.", "blog": "Cloudflare Blog", "published": "2026-08-10", "tags": ["agents"]}, {"title": "Serving the most critical missions: Cloudflare for Government achieves FedRAMP Class D (High) Certified status", "url": "https://blog.cloudflare.com/fedramp-class-d-certification/", "summary": "Cloudflare for Government achieves FedRAMP Class D (High) Certified status. We also announce our commitment to pursue DoD IL4 authorization. Cloudflare brings world-class security, performance, and developer products to the public sector.", "blog": "Cloudflare Blog", "published": "2026-08-10", "tags": []}, {"title": "TDD inside the agent loop - theater or actual value?", "url": "https://martinfowler.com/articles/exploring-gen-ai/tdd-in-the-agent-loop.html", "summary": "My colleagues at Thoughtworks tend to be big fans of Test-Driven Development, and many people in the industry advocate telling LLM agents to use TDD when building software. Birgitta B&#xF6;ckeler was curious if this really makes a difference, so conducted a few experiments . more…", "blog": "Martin Fowler", "published": "2026-08-11", "tags": ["agents"]}, {"title": "Java News Roundup: Simple JSON API, GlassFish, Jakarta EE, JNoSQL, Open Liberty, LangChain4j", "url": "https://www.infoq.com/news/2026/08/java-news-roundup-aug10-2026/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "This week's Java roundup for August 10th, 2026, features news highlighting: Simple JSON API proposed to target for JDK 28; an update on Jakarta EE 12; the August 2026 edition of Open Liberty; a point release of LangChain4j; maintenance releases of Eclipse JNoSQL and GraalVM Native Build tools; the third milestone release of GlassFish 9.0; and the second beta release of Groovy 6.0. By Michael Redli…", "blog": "InfoQ Architecture & Design", "published": "2026-08-17", "tags": []}, {"title": "AWS Open-Sources Dogwood, Extending Cedar to Govern Sequences of Agent Tool Calls", "url": "https://www.infoq.com/news/2026/08/aws-dogwood-agent-policy/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "AWS has open-sourced Dogwood, a policy language extending Cedar with temporal conditions so rules can reason about an agent's prior tool calls rather than one request in isolation. It covers approvals, rate limits and running totals, ships under Apache 2.0, and is supported in AgentCore Policy, though the reference interpreter is not production-ready. By Steef-Jan Wiggers", "blog": "InfoQ Architecture & Design", "published": "2026-08-16", "tags": ["agents"]}, {"title": "Presentation: From Models to Agents: Building Context-Aware Consumer AI at Scale at DoorDash", "url": "https://www.infoq.com/presentations/ai-agentic-recommendations-semantic-ids/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Sudeep Das shares how DoorDash shifts from legacy one-shot predictions to an agentic recommendation platform. He discusses leveraging language-native consumer memory, RQ-VAE semantic IDs for catalog representation, and grounded search to dramatically boost relevance and conversion metrics. By Sudeep Das", "blog": "InfoQ Architecture & Design", "published": "2026-08-15", "tags": ["agents", "warstory"]}, {"title": "Cloudflare Adds Agent Tracing, with Truncation Limits and Uneven Payload Defaults", "url": "https://www.infoq.com/news/2026/08/cloudflare-agent-tracing/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Cloudflare launched agent tracing, adding spans for agent invocations, model calls, tool runs, and approvals to existing Workers traces. Sessions replay turn by turn, though the docs warn traces are not lossless and payloads may be truncated. Payload recording defaults differ by framework, and from October 1, 2026 every span counts as a billable event. By Steef-Jan Wiggers", "blog": "InfoQ Architecture & Design", "published": "2026-08-15", "tags": ["agents"]}, {"title": "Cloudflare Introduces Cache Response Rules for Post-Origin Cache Control", "url": "https://www.infoq.com/news/2026/08/cloudflare-cache-rules/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Cloudflare recently introduced Cache Response Rules, a rules engine that operates after an origin server responds but before content is written to Cloudflare's cache. Previously, Cache Rules operated only on request attributes. Cache Response Rules add a response phase that evaluates origin responses before they are cached. By Renato Losio", "blog": "InfoQ Architecture & Design", "published": "2026-08-15", "tags": []}, {"title": "Cloudflare Migrates JavaScript CDN Serving 9B Requests a Day to Its Developer Platform", "url": "https://www.infoq.com/news/2026/08/cloudflare-cdnjs-migration/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Cloudflare has migrated cdnjs, its open source CDN for JavaScript and CSS libraries, to its Developer Platform. The new architecture uses Workers, R2, KV, Workflows, Queues, Durable Objects and Containers, consolidating publishing and delivery infrastructure while preserving package contents, URLs and SRI hashes at a scale of 9 billion requests per day. By Leela Kumili", "blog": "InfoQ Architecture & Design", "published": "2026-08-14", "tags": ["warstory"]}, {"title": "Presentation: The Right 300 Tokens Beat 100k Noisy Ones: The Architecture of Context Engineering", "url": "https://www.infoq.com/presentations/architecture-context-engineering/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Baruch Sadogursky and Patrick Debois discuss why coding agents fail due to bloated context windows and stuffed prompts. They explain practical context engineering fixes, including lazy-loaded skills, versioned context artifacts, externalized memory banks, and LLM-as-a-judge evals. Software architects & engineering leaders will learn how to turn raw markdown files into reliable agentic workflows. B…", "blog": "InfoQ Architecture & Design", "published": "2026-08-14", "tags": ["agents"]}, {"title": "LLM-Generated GraphQL Mocks Arrive at Airbnb and Expedia, While the Spec Lags behind", "url": "https://www.infoq.com/news/2026/08/graphql-llm-mocking-spec/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Expedia Group has open-sourced mockql-rs, a Rust CLI that fills @mock-annotated GraphQL fields with LLM-generated data at request time. It follows Airbnb's @generateMock in April and a GraphQL Foundation RFC opened in February. All three solve the same problem with different architectures, and two use the same directive name with incompatible semantics. By Steef-Jan Wiggers", "blog": "InfoQ Architecture & Design", "published": "2026-08-14", "tags": []}, {"title": "Netflix Adopts Cloud-Native Job Queueing System Kueue to Replace an In-House Solution", "url": "https://www.infoq.com/news/2026/08/netflix-kueue-kubernetes-batch/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Netflix migrated most of its batch workloads onto Kueue, an open-source cloud-native batch job execution system that has outgrown its homegrown solution over the years. The company mapped the capabilities previously created in-house to Kueue’s functionality and also benefited from new features that would have been costly to incorporate into its homegrown solution. By Rafał Gancarz", "blog": "InfoQ Architecture & Design", "published": "2026-08-12", "tags": ["warstory"]}, {"title": "Spotify Builds External Index to Enable Low Latency Point Queries on its Data Lake", "url": "https://www.infoq.com/news/2026/08/spotify-data-lake-point-queries/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Spotify introduced external indexing architecture for Apache Parquet data lakes that enables low-latency point queries without replicating datasets into operational databases. The approach maps lookup keys to Parquet files and row locations, allowing targeted reads from cloud object storage while supporting analytics, machine learning, AI applications, and online services from the same datasets. B…", "blog": "InfoQ Architecture & Design", "published": "2026-08-12", "tags": []}, {"title": "Presentation: Adopting Memory-Safety and Fine-Grained Compartmentalisation with CHERI", "url": "https://www.infoq.com/presentations/cheri-memory-safety-compartmentalization/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "David Chisnall discusses how the CHERI hardware architecture redefines pointer safety to solve isolation and sharing challenges. He explains how CHERI enables spatial and temporal memory safety for C/C++, scales down to microcontrollers with CHERIoT, and replaces costly OS-level RPC mechanisms with lightweight, auditable compartmentalization - all without requiring massive codebase rewrites. By Da…", "blog": "InfoQ Architecture & Design", "published": "2026-08-12", "tags": []}, {"title": "MCP Goes Stateless, and Developers Ask Whether That Just Makes it an API Again", "url": "https://www.infoq.com/news/2026/08/mcp-stateless-gateway/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "The MCP 2026-07-28 specification removes the initialize handshake and session header, and adds required method and tool-name headers so gateways can route agent traffic without parsing JSON. Reaction split between developers calling it a rediscovery of REST and those arguing the standard itself was always the point. By Steef-Jan Wiggers", "blog": "InfoQ Architecture & Design", "published": "2026-08-12", "tags": ["agents"]}, {"title": "How Netflix Scaled its Real-Time Service Map", "url": "https://www.infoq.com/news/2026/08/netflix-service-topology/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Netflix has described how it redesigned the streaming pipeline behind Service Topology, its real-time service dependencies map, to support production scale. The system uses three stages to separate intermediary resolution from enrichment and persistence, propagates backpressure to Kafka rather than dropping records, and uses server-sent events instead of gRPC for high-volume internal transfers. By…", "blog": "InfoQ Architecture & Design", "published": "2026-08-11", "tags": ["warstory"]}, {"title": "JetBrains Details its First Steps to Bring Rapidly Growing AI Spend under Control", "url": "https://www.infoq.com/news/2026/08/jetbrains-ai-spend/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "JetBrains has described how it began centralising AI usage after development-related spending increased roughly tenfold in six months. Rather than restricting engineers to a small set of approved tools, the company built a shared access and accounting layer intended to preserve tool choice while giving teams greater visibility and control over consumption. By Matt Foster", "blog": "InfoQ Architecture & Design", "published": "2026-08-11", "tags": []}, {"title": "Canva Shares S3 Based Architecture for Session Revocation across Hundreds of Millions of Sessions", "url": "https://www.infoq.com/news/2026/08/canva-session-revocation-scale/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Canva redesigned session revocation infrastructure to support 100M active sessions while reducing database lookups. The architecture uses Amazon S3 for durable revocation records and distributes compact, in-memory indexes to application gateways. Canva said the design improved deployment speed, reduced database infrastructure requirements, and cut the revocation cache memory footprint by 87.5%. By…", "blog": "InfoQ Architecture & Design", "published": "2026-08-10", "tags": ["warstory"]}, {"title": "Using the GitHub Copilot SDK for Java", "url": "https://github.blog/engineering/using-the-github-copilot-sdk-for-java/", "summary": "Enterprise Java developers have a new superpower—drive GitHub Copilot from idiomatic Java code with annotations, virtual threads, and more. The post Using the GitHub Copilot SDK for Java appeared first on The GitHub Blog .", "blog": "The GitHub Blog (Engineering)", "published": "2026-08-10", "tags": []}, {"title": "Mapping the AI economy", "url": "https://stripe.com/blog/mapping-the-ai-economy", "summary": "AI companies are undergoing rapid global expansion while achieving unprecedented rates of growth. We analyzed Stripe data to understand where global demand is the strongest, and how companies can build to best capture that demand.", "blog": "Stripe Engineering", "published": "2026-08-11", "tags": []}]}}, "DOCS": {"morning": "# AI/ML Morning Brief\n\n**Week of Jul 5, 2026**\n\n## 1) AI Architecture — Top Developments\n\n- **Cloudflare postmortem:** BYOIP pipeline change withdrew 25% of customer BGP prefixes; \"fail small\" re-architecture underway. [Cloudflare](https://blog.cloudflare.com/cloudflare-outage-february-20-2026/)\n- **Netflix ships \"Upper\" metamodel** — unified data architecture enforcing consistency across content-engineering services. [InfoQ](https://www.infoq.com/news/2025/12/netflix-upper-uda-architecture/)\n- **\"Code as the harness\" gains ground** — wrap agents in executable/verifiable/stateful scaffolding, not bigger prompts. [arXiv](https://arxiv.org/pdf/2605.18747)\n- **Incident-comms benchmark:** Pragmatic Engineer flags Cloudflare's postmortem as the gold standard. [Pragmatic Engineer](https://blog.pragmaticengineer.com/the-pulse-cloudflare-takes-down-half-the-internet/)\n\n## 2) AI Agents — Key News\n\n- **Microsoft \"Frontier\"** — new AI-deployment company; $2.5B, 6,000 experts, enterprise rollouts. [TechCrunch](https://techcrunch.com/2026/07/02/microsoft-launches-its-own-ai-deployment-company-with-2-5-billion-commitment/)\n- **NVIDIA × ServiceNow** — autonomous enterprise agents launched. [NVIDIA](https://blogs.nvidia.com/blog/servicenow-autonomous-ai-agents-enterprises/)\n- **Anthropic Claude Sonnet 5** live (Jun 30); default for Free/Pro Jul 1. [BuildFast](https://www.buildfastwithai.com/blogs/ai-news-today-july-1-2026)\n- **OpenClaw** — self-extending agent tops GitHub star charts; ClawHub 13k+ skills; supply-chain risk flagged. [GitHub](https://github.com/openclaw/openclaw)\n- **Theme:** demos → workflow replacement; \"Super Agents\" unify siloed agents (Levi's). [PYMNTS](https://www.pymnts.com/news/artificial-intelligence/2026/super-agents-are-connecting-what-enterprise-software-kept-separate/)\n\n## 3) Hugging Face Daily Papers — Top Highlights\n\n- **Scaling the Horizon, Not the Parameters** — trillion-param performance from a 35B agent. [HF](https://huggingface.co/papers/trending)\n- **TACO** — Tool-Augmented Credit Optimization for agentic tool use. [HF](https://huggingface.co/papers/trending)\n- **MIMFlow** — masked image modeling + normalizing flows for end-to-end image gen. [HF](https://huggingface.co/papers/trending)\n- **Volume:** ~20 trending/day, 612 for the month. [HF Papers](https://huggingface.co/papers)\n\n## 4) AI Investments — Major Funding\n\n- **Together AI** — $800M Series C, ~$8.3B post-money; Amazon, Aramco, Blackstone in. [Tech Startups](https://techstartups.com/2026/07/02/venture-capital-startup-funding-roundup-july-2-2026/)\n- **Quantum Systems** — $1.2B Series D (Jul 2); defense/autonomous, Munich. [Funding News](https://blog.mean.ceo/ai-startup-funding-news-july-2026/)\n- **Macro:** H1'26 global VC record $510B, AI-led; Q1 ~$300B. [Crunchbase](https://news.crunchbase.com/venture/record-breaking-funding-ai-global-q1-2026/)\n\n## 5) Impact of AI on the Stock Market — Market Moves\n\n- **Chips:** AI semi complex +$2T value YTD; SOX +47% YTD. [Intellectia](https://intellectia.ai/blog/ai-semiconductor-stocks-rally-july-2026)\n- **NVDA:** Q1 FY27 rev $81.6B (+85% YoY); nearing 52-wk high; leadership broadening. [Zacks](https://www.zacks.com/stock/news/2916674/nvidia-shares-rally-toward-52-week-high-buy-more-or-lock-in-gains)\n- **MU:** HBM sold out for 2026; ~$1,089 record (+700% YoY, +11% wk). [StocksDownUnder](https://stocksdownunder.com/why-micron-stock-is-surging-sold-out-ai-memory/)\n- **AMD / QCOM:** double-digit surges; BofA lifts semi TAM to $1.3T. [Intellectia](https://intellectia.ai/blog/ai-semiconductor-stocks-rally-july-2026)\n\n## 6) Curated Technical AI/ML Papers\n\n- **Jun 2026 — Code as Agent Harness** — [2605.18747](https://arxiv.org/pdf/2605.18747) — Survey: code as executable/verifiable/stateful scaffolding for reliable agents.\n- **Jun 2026 — Coding Benchmarks Are Misaligned with Agentic SWE** — [2606.17799](https://arxiv.org/pdf/2606.17799) — Argues popular benchmarks miss what real agentic engineering requires.\n- **Jun 2026 — Layer-Isolated Evaluation** — [2606.11686](https://arxiv.org/pdf/2606.11686) — No-LLM, regression-locked harness gating a production LLM agent.\n- **Apr 2026 — Autonomous Debugging + Dynamic Analysis** — [2604.24212](https://arxiv.org/pdf/2604.24212) — Debugging agents reason over runtime behavior, not just source.\n- **Jan 2026 — Bug-Reproduction Test Cogeneration** — [2601.19066](https://arxiv.org/pdf/2601.19066) — Generates a failing repro test alongside each agent-produced fix.\n- **Jul 2025 — SWE-Exp** — [2507.23361](https://arxiv.org/pdf/2507.23361) — Issue-resolution agents accumulate experience across tasks instead of starting cold.\n\n---\n*Sources: web search, Jul 5 2026. Dates approximate to publication month.*\n", "strategy": "# ↗ Strategy Signals — Talking Points for the Room\n\n**For having a say in your company's AI strategy.** Concise, sourced signals framed as *what to raise* with leadership — not just news.\n\n## Where the money says the puck is going\n\n- **Enterprise agents move from demos to deployment** — Microsoft stood up a $2.5B \"Frontier\" org purely to *deploy* enterprise AI. Signal: the bottleneck is now integration + rollout, not model access. *Raise:* are we resourcing deployment/ops, not just pilots? [TechCrunch](https://techcrunch.com/2026/07/02/microsoft-launches-its-own-ai-deployment-company-with-2-5-billion-commitment/)\n- **Agents get embedded in systems of record** — NVIDIA × ServiceNow shipped autonomous enterprise agents. *Raise:* which of our workflows are agent-ready, and who owns guardrails? [NVIDIA](https://blogs.nvidia.com/blog/servicenow-autonomous-ai-agents-enterprises/)\n- **\"Super Agents\" unify siloed tools** — Levi's is connecting per-function agents into one interface. *Raise:* do we have an agent-integration layer, or N disconnected copilots? [PYMNTS](https://www.pymnts.com/news/artificial-intelligence/2026/super-agents-are-connecting-what-enterprise-software-kept-separate/)\n\n## Infra & cost reality (your retrieval/serving lens)\n\n- **Inference infra is where capital is flowing** — Together AI raised $800M. *Raise:* build vs. buy for our serving/retrieval stack. [Tech Startups](https://techstartups.com/2026/07/02/venture-capital-startup-funding-roundup-july-2-2026/)\n- **Memory is the constraint** — HBM sold out for 2026; semiconductor TAM lifted toward $1.3T. *Raise:* capacity-plan index growth and GPU memory now, not Q4. [Intellectia](https://intellectia.ai/blog/ai-semiconductor-stocks-rally-july-2026)\n\n## Adoption pattern worth copying\n\n- **Winners map one messy process, add human review, prove time/error savings** — then expand. *Raise:* pick one high-friction workflow and instrument it before scaling AI across teams. [Agentic.ai](https://agentic.ai/news)\n\n## What to advocate internally (your edge)\n\n- **Eval harnesses before autonomy** — gate agents with regression-locked, no-LLM tests.\n- **Retrieval cost controls** — hybrid search + rerank budgets; measure tokens per resolved query.\n- **Guardrails on agent PRs** — treat autonomous code changes as a review/attack surface.\n\n---\n*Signals as of the week of the digest; refreshed weekly. Frame these as questions in strategy discussions, not conclusions.*\n", "playbook": "# 🛠 AI Engineering Playbook\n\n**How to get the most from AI in software engineering** — concrete, tested moves for cutting cost, shipping faster, and keeping output trustworthy. Grounded in current best practices and real practitioner reports from this week's HN threads.\n\n## Cut token usage (and cost)\n\n- **Turn on prompt caching** — Anthropic caching bills cached input at ~0.1x (a 90% discount) and now auto-caches multi-turn chats. Biggest single lever for repeated context. [Token Optimize](https://www.tokenoptimize.dev/guides/llm-token-optimization-strategies)\n- **Compact mid-session** — use summarize/compaction so the context window doesn't grow unbounded; a long session gets squeezed into a compact recap. [Redis](https://redis.io/blog/llm-token-optimization-speed-up-apps/)\n- **Persist memory across sessions** — curated memory turns a 50K-token reload into a few hundred tokens. Have the agent maintain its own `plan.md`/docs so it isn't reliant on one session's context. [Token Optimize](https://www.tokenoptimize.dev/guides/context-engineering-reduce-token-usage)\n- **Compress & mask tool output** — logs, files, and RAG chunks compress 60–95% before hitting the model; mask irrelevant tool results instead of pasting them whole. [CoddyKit](https://www.coddykit.com/pages/blog-detail?id=512865&slug=how-to-cut-llm-token-usage-by-90-with-context-compression-a-step-by-step-guide)\n- **Retrieve, don't pack** — fetch only relevant chunks on demand from a vector store rather than stuffing the whole history in the prompt. [LogRocket](https://blog.logrocket.com/stop-wasting-ai-tokens-10-ways-to-reduce-usage/)\n- **Compile fuzzy calls into local functions** — for repeated LLM-API tasks (parse logs, repair JSON, rank by intent), compile the spec into a local \"fuzzy function\" to reclaim locality, reproducibility, and price. [Program-as-Weights](https://arxiv.org/abs/2607.02512)\n- **Minify agent state** — state-in-context agents shrink dramatically with minification/context-pruning. [Minification](https://arxiv.org/pdf/2606.01326) · [Context Pruning](https://arxiv.org/pdf/2605.15315)\n\n## Speed up feature development\n\n- **Plan before you code** — collapse ~20 ambiguous decisions into one reviewed spec so each lands near 100% instead of 80%. The cheapest speed-up there is. [Claude Code Docs](https://code.claude.com/docs/en/best-practices)\n- **Delegate to subagents** — a subagent explores in its own context and reports back a compressed summary, keeping the main session clean and fast (great for large read/exploration tasks). [SmartScope](https://smartscope.blog/en/generative-ai/claude/claude-code-best-practices-advanced-2026/)\n- **Chain the SDLC as skills** — brainstorm → worktree → implementation plan → subagent execution → TDD → review-before-merge (e.g., the \"Superpowers\" collection). [duet.so](https://duet.so/guides/claude-code-skills-complete-guide)\n- **Enforce TDD with hooks** — a deterministic red-green-refactor loop (write failing test → watch it fail → make it pass) via hooks/state machine yields regression-proof code; one HN dev built a 300k-line SaaS this way. [HN](https://news.ycombinator.com/item?id=48413629)\n- **Use a second model as reviewer** — several devs run Codex to review Claude Code output (or vice-versa) as a cheap quality gate. [HN](https://news.ycombinator.com/item?id=48413629)\n\n## Skills to add to a project (and how to manage them)\n\n- **Check skills into the repo** — keep them under `.agents/skills/`, versioned and reviewed via PR, so every contributor inherits the project's conventions automatically. [Developers Digest](https://www.developersdigest.tech/blog/best-claude-code-skills-2026)\n- **Keep 8–12, audit monthly** — that covers most of a senior dev's day; beyond that you pay a \"context tax.\" Delete any skill you haven't triggered in 30 days. [SmartScope](https://smartscope.blog/en/generative-ai/claude/claude-code-best-practices-advanced-2026/)\n- **Right tool for the job** — *Skills* = how to do something; *MCP* = access to external systems; *Subagents* = delegate to a specialist with its own context. [duet.so](https://duet.so/guides/claude-code-skills-complete-guide)\n- **High-ROI starter skills:** branch/PR review, test generation, CI/CD setup, spec-driven scaffolding, incident triage, changelog/release notes, and a repo-conventions linter.\n\n## Keep AI output trustworthy\n\n- **Treat the agent as a fallible teammate** — extensive unit/automation tests, static analysis (e.g., SonarQube), and CI gates on everything merged to main. [HN](https://news.ycombinator.com/item?id=48445024)\n- **Guard the review surface** — autonomous agents that ship code across many PRs are a real attack surface (a payload can be timed across commits); keep human review and CI gating tight. [Distributed Attacks in Persistent-State AI Control](https://arxiv.org/abs/2607.02514)\n- **Prefer deterministic scripts** — for repeatable ops (deploys, scaffolding), have the agent run pre-built scripts instead of improvising API calls, so results are consistent every time. [HN](https://news.ycombinator.com/item?id=48445024)\n\n## Manage context\n\n- **Rules close to the repo** — put project rules where the code lives; keep prompts short and task-specific rather than \"heroic\" mega-prompts. [HN](https://news.ycombinator.com/item?id=48445024)\n- **Watch for context bloat** — too much in context degrades output; lean context beats a kitchen-sink of skills/MCPs. [HN](https://news.ycombinator.com/item?id=48413629)\n\n## Anti-patterns to avoid\n\n- **Vibe coding without the rest of the software** — code isn't the whole product; skipping docs, tests, and design catches up fast.\n- **Skill hoarding** — untriggered skills/MCPs just tax your context window.\n- **Skim reviews** — pattern-skimming misses duplication, bloat, and inconsistent naming that quietly drain productivity.\n- **Burning tokens on non-AI work** — if a plain shell script does the job, automate it without the model.\n\n---\n*Sources: current best-practice guides + practitioner reports from this week's Hacker News threads and arXiv papers in your digest.*\n", "podcast": "# ◇ Story Desk — This Week's Angles\n\nAngles worth developing from this week's items — for a talk, a post, or a deep-dive. Each has a hook, an angle type, talking points, who to talk to, and a source. Biased toward retrieval, agents, and production reality.\n\n## 1. Seconds → milliseconds: Netflix's Cassandra latency fix  *(War Story · LEAD)*\nHook: a classic read-latency nightmare at scale — and the partitioning change that fixed it.\n- What caused seconds-long reads, and how they diagnosed it.\n- The partition/data-model change and its trade-offs.\n- What transfers to any large-index or vector store you run.\n- When to fix the data model vs. throw hardware at it.\nWho to talk to: an engineer who's run large stateful data stores. [InfoQ](https://www.infoq.com/news/2026/07/netflix-cassandra-partition/)\n\n## 2. Memory that survives the session: semantic persistence for LLM workflows  *(Tool/Workflow)*\nHook: RAG isn't just retrieval — it's persisting *workflow knowledge* so agents don't start cold.\n- \"Workflow as Knowledge\": what to persist and how to index it.\n- Where hybrid/semantic retrieval helps vs. hurts in agent memory.\n- Cost and staleness trade-offs of long-lived indexes.\nWho to talk to: a retrieval/RAG practitioner (your wheelhouse). [arXiv](http://arxiv.org/abs/2607.08740v1)\n\n## 3. Serving agents at scale: scheduling when every turn hits an LLM  *(War Story)*\nHook: agentic chat in production lives or dies on scheduling and tail latency.\n- SMetric's session-centric scheduling for serving agents.\n- Throughput vs. per-session fairness; what breaks under load.\n- Guardrails for cost blowups when agents loop.\nWho to talk to: an infra/serving engineer. [arXiv](http://arxiv.org/abs/2607.08565v1)\n\n## 4. Postgres → ClickHouse: when your database stops keeping up  *(War Story)*\nHook: the honest version of a migration story — why they switched and what it cost.\n- Signals it was time to move off Postgres.\n- What ClickHouse bought them, and the sharp edges.\n- How they de-risked the cutover.\nWho to talk to: an engineer who's led a datastore migration. [InfoQ](https://www.infoq.com/news/2026/07/momentic-postgres-clickhouse/)\n\n## 5. TDD with AI, for real: Datadog's test-driven production migration  *(Tool/Workflow)*\nHook: a concrete, reviewable way to use AI coding tools without \"vibe coding\" in prod.\n- The test-first loop that kept the migration safe.\n- Where human review stayed non-negotiable.\n- What made it repeatable vs. a one-off.\nWho to talk to: someone shipping AI-assisted migrations. [InfoQ](https://www.infoq.com/news/2026/07/datadog-ai-production-migration/)\n\n## 6. Latency vs. cost: the multi-region architecture trade-off  *(Architecture)*\nHook: the decision every scaling team faces, laid out with the real trade-offs.\n- What actually drives the latency/cost curve.\n- Patterns that fail quietly at multi-region scale.\n- A decision framework you can reuse Monday.\nWho to talk to: an architect who's run multi-region systems. [InfoQ](https://www.infoq.com/articles/multi-region-latency-cost-tradeoffs/)\n\n---\n**Lead with #1** — a concrete, high-stakes latency war story hooks engineers instantly and frames the whole \"production reality\" theme. #2 and #3 are your retrieval/agents depth plays.\n"}, "WEEK": "2026-08-17"};
const DIGEST = BUNDLE.DIGEST, DOCS = BUNDLE.DOCS;
const VIEWS = [
  { key: "morning",   label: "◉ Morning Brief",    type: "md",   doc: "morning" },
  { key: "retrieval", label: "⌕ Retrieval Desk",   type: "desk", tag: "retrieval" },
  { key: "agents",    label: "⛓ Agents in Prod",   type: "desk", tag: "agents" },
  { key: "warstory",  label: "⚠ War Stories",      type: "desk", tag: "warstory" },
  { key: "strategy",  label: "↗ Strategy Signals", type: "md",   doc: "strategy" },
  { key: "playbook",  label: "⚙ Playbook",         type: "md",   doc: "playbook" },
  { key: "podcast",   label: "◇ Story Desk",       type: "md",   doc: "podcast" },
];
const SRC_LABEL = { arxiv: "arXiv", blogs: "Blog", github: "GitHub", hackernews: "HN" };
let tab = "morning";
const esc = s => (s || "").replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function itemsByTag(tag) {
  const src = DIGEST.sources || {}; const out = [];
  for (const k of Object.keys(src)) for (const it of (src[k] || [])) if ((it.tags || []).includes(tag)) out.push({ it, src: k });
  return out;
}
function tabButton(v, count) {
  const div = document.createElement("div");
  div.className = "tab" + (v.key === tab ? " active" : "");
  div.innerHTML = v.label + (count != null ? ` <span class="count">${count}</span>` : "");
  div.onclick = () => { tab = v.key; renderTabs(); renderItems(); };
  return div;
}
function renderTabs() {
  const el = document.getElementById("tabs"); el.innerHTML = "";
  for (const v of VIEWS) {
    if (v.type === "desk") { const c = itemsByTag(v.tag).length; if (!c) continue; el.appendChild(tabButton(v, c)); }
    else el.appendChild(tabButton(v, null));
  }
}
function mdToHtml(md) {
  const lines = (md || "").replace(/\r/g, "").split("\n"); let html = "", inList = false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*(.+?)\*/g, "<em>$1</em>");
  const cl = () => { if (inList) { html += "</ul>"; inList = false; } };
  for (const raw of lines) { const line = raw.trimEnd();
    if (/^#{1,6}\s/.test(line)) { cl(); const lvl = line.match(/^#+/)[0].length; html += `<h${lvl} class="md-h">${inline(line.replace(/^#+\s/, ""))}</h${lvl}>`; }
    else if (/^---+$/.test(line)) { cl(); html += "<hr>"; }
    else if (/^[-*]\s/.test(line)) { if (!inList) { html += '<ul class="md-ul">'; inList = true; } html += `<li>${inline(line.replace(/^[-*]\s/, ""))}</li>`; }
    else if (line === "") { cl(); } else { cl(); html += `<p class="md-p">${inline(line)}</p>`; } }
  cl(); return html;
}
function badge(t) { return `<span class="badge">${esc(String(t))}</span>`; }
function deskCard(it, srcKey) {
  const title = `<a class="title" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`;
  let meta = [`<span class="badge src">${esc(SRC_LABEL[srcKey] || srcKey)}</span>`];
  if (srcKey === "arxiv")  meta.push(badge(it.authors || "—"), badge(it.published));
  if (srcKey === "blogs")  meta.push(badge(it.blog || "blog"), badge(it.published || ""));
  if (srcKey === "github") meta.push(badge("★ " + (it.stars ?? 0)), badge(it.language || "—"));
  let extra = "";
  if (srcKey === "hackernews") {
    meta.push(badge((it.comments ?? 0) + " comments"), `<a class="badge" href="${esc(it.hn_url)}" target="_blank" rel="noopener">HN thread</a>`);
    if (it.discussion_summary) {
      const quotes = (it.top_comments || []).map(c => `<div class="quote">“${esc(c.text)}”<span class="who"> — ${esc(c.author)}</span></div>`).join("");
      extra = `<div class="disc"><div class="disc-h">💬 What people are saying</div><div class="disc-body">${esc(it.discussion_summary)}</div>${quotes}</div>`;
    }
  }
  const summary = it.summary ? `<div class="summary">${esc(it.summary)}</div>` : "";
  return `<div class="card">${title}${summary}${extra}<div class="meta">${meta.join("")}</div></div>`;
}
function renderItems() {
  const root = document.getElementById("content");
  const view = VIEWS.find(v => v.key === tab) || VIEWS[0];
  if (view.type === "md") {
    const md = DOCS[view.doc];
    root.innerHTML = md ? `<div class="brief">${mdToHtml(md)}</div>` : `<div class="empty">Not in this edition.</div>`;
    return;
  }
  const rows = itemsByTag(view.tag);
  root.innerHTML = rows.length ? rows.map(r => deskCard(r.it, r.src)).join("") : `<div class="empty">No items on this desk this week.</div>`;
}
document.getElementById("weeklabel").textContent = BUNDLE.WEEK ? "Week of " + BUNDLE.WEEK : "";
renderTabs(); renderItems();
</script>
