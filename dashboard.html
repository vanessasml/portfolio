heng, Liang Wu, Yushun Dong", "published": "2026-10-02", "tags": []}, {"title": "Threat-Preserving Representation Sensitivity in Agent-Security Benchmarks", "url": "http://arxiv.org/abs/2610.03585v1", "summary": "Security benchmarks for LLM-based agents often report the attack success rate (ASR) as a measure of model robustness and use these scores to compare different models and defense mechanisms, assuming that they describe the security of the agent. In this paper, we explore whether it also influences the benchmark's measurement. To measure the effect of the benchmark representation, we introduce threa…", "authors": "Neeraj Karamchandani, Piyush Nagasubramaniam, Xinhong Xie, Sencun Zhu", "published": "2026-10-02", "tags": ["agents"]}, {"title": "Rethinking What to Cache in Few-Step Diffusion Transformers: Solver-Aware Target Selection", "url": "http://arxiv.org/abs/2610.03577v1", "summary": "Diffusion Transformers (DiTs) can generate high-quality images and videos, but generating each sample requires multiple costly DiT forward passes. Two common ways to accelerate DiT sampling are step distillation, which reduces the number of sampling steps, and caching, which skips some DiT evaluations by reusing a tensor computed at an earlier step. Most caching methods decide in advance which ten…", "authors": "Shuo Yang, Lihao Fang, Yi Zhang, Haixiang Wang", "published": "2026-10-02", "tags": []}, {"title": "HyperBrowseComp: A Multilingual and Multimodal Stress Test for Web-Browsing Agents", "url": "http://arxiv.org/abs/2610.03574v1", "summary": "We introduce HyperBrowseComp, a multilingual and multimodal browsing benchmark comprising 423 manually authored and human-validated questions across 13 languages, written by native or highly proficient speakers. Questions are designed to be extremely challenging. Each question targets a concise, publicly verifiable answer whose discovery requires locating obscure evidence, following multi-step clu…", "authors": "Alham Fikri Aji, F ve been surprised by this forums unwillingness to read this thing..."}, {"author": "thelaxiankey", "text": "I think your summary is not really correct, maybe I'm missing something. As far as I can read, the approximate takeaways are these: * LLM chess play is hyper sensitive to the harness being used (see: the section on regurgitation), and only mildly sensitive to fine tuning * The best ELOs the author was observing were fr…"}, {"author": "thom", "text": "Yes, we can come up with all sorts of weird situations where you can get it to be confused. But what I'm saying is it's _trivial_ to give it a simple prompt that prevents it from ever making any errors, and so I don't think it's this big LLM gotcha (of which there are many!)"}, {"author": "yunwal", "text": "Let's repeat the same circle. Why is customer service fundamentally a more controlled environment than anything else the author deems \"outside of an LLMs capabilities\"?"}, {"author": "fahrvrgnugen", "text": "It's not my experience at all. If you find yourself in a novel position within 10-15 moves it's likely a resignable one. Edit: maybe you don't understand what i mean by novel position. I mean any position that has never been reached in the billions of lichess games, including bullet games among beginners. Also yes I wi…"}], "discussion_summary": "", "tags": []}, {"title": "Pentagon says overreliance on AI contributed to missile strike on Iran school", "url": "https://www.bloomberg.com/graphics/2026-iran-school-attack/", "summary": "", "points": 974, "comments": 553, "hn_url": "https://news.ycombinator.com/item?id=49806430", "published": "2026-09-22", "top_comments": [{"author": "jtrn", "text": "It's a bit hard to know exactly what happened, I would think. But I get your point. My feeling at the moment is that AI can do surprisingly good work compared to humans, like 80% equality for some tasks at a fraction of the price. The problem is that if you then uncritically just replace every human, you quickly are go…"}, {"author": "newspaper1", "text": "No, it's absolutely nothing like that. This is textbook European colonization. Did you read the link? Here's another that fully justifies all armed resistance against Zionism: https://en.wikipedia.org/wiki/Nakba"}, {"author": "fabtreatv", "text": "That’s like saying that UK support for a Palestinian state makes Palestine a European colonization project."}, {"author": "newspaper1", "text": "Not sure how you can deny that Israel is a European colonization project. It's all very well documented: https://en.wikipedia.org/wiki/Balfour_Declaration"}, {"author": "croon", "text": "That's a lot of strawmen unrelated to what I wrote. We're lacking in enforcement, not lagging regulation (regardless of if/that I agree it might be needed). If we put this under a US focus lens, then I believe the unaccountability currently would be there exactly the same if we removed this generation of AI from the ti…"}, {"author": "morpheos137", "text": "Depends on where they are from. Iranians from the north, the caspian coast can look very Nordic. I would say the average Iranian looks about as white as the average Italian or French man."}], "discussion_summary": "", "tags": []}, {"title": "Everyone should slow down AI development except for me", "url": "https://xeiaso.net/notes/2026/everyone-slowdown-but-me/", "summary": "", "points": 813, "comments": 454, "hn_url": "https://news.ycombinator.com/item?id=49678683", "published": "2026-09-13", "top_comments": [{"author": "int_19h", "text": "Renting tokens is exactly what I had in mind, and I don't see how it has the same issues. Sure, if you go for absolute bottom of the barrel than you can expect \"changes in model quality\", but in general that is not so, and you can pin specific model releases etc. Inconsistent speeds and service outages apply to your ow…"}, {"author": "Nasrudith", "text": "The slowdown has to be one of the stupidest demands out there. When has technology arrived only when 'we are ready for it'. When has any prep-time when the writing was on the wall used to prepare for the future? Never. That is putting aside the coordination problem and ulterior motives that a call for a slowdown reads …"}, {"author": "Nasrudith", "text": "We can end world hunger but people would be way more mad if we did, on account of all the military action involved to conquer every non-compliant regiemes and the multiple quagmires created."}, {"author": "aorloff", "text": "> Unless you ignore realities. Tell me about making capital investments while interest rates are rising but revenue growth is slowing, if you want to really talk dirty."}, {"author": "kylenessen", "text": "I vividly remember watching on television a man losing control of his paper shredder as it ate his tie because of Y2K. I think both points can be true"}, {"author": "mitchdoogle", "text": "I don't view this as hysteria. The fears around superintelligent AI have existed for a decade or more. That's not because AI researchers have a penchant for dreaming up sci-fi scenarios. It's because the concern is based on following a logical conclusion that any entity significantly smarter than humanity cannot be con…"}], "discussion_summary": "", "tags": []}], "blogs": [{"title": "Deploy Oracle Database step by step on Amazon EVS with FSx for ONTAP", "url": "https://aws.amazon.com/blogs/architecture/deploy-oracle-database-step-by-step-on-amazon-evs-with-fsx-for-ontap/", "summary": "This post provides step-by-step procedures to deploy Oracle Database on Amazon Elastic VMware Service (Amazon EVS) with Amazon FSx for NetApp ONTAP as NFS datastore storage. You provision storage volumes, mount NFS datastores, install Oracle, and configure SnapMirror replication for cross-region disaster recovery.", "blog": "AWS Architecture Blog", "published": "2026-10-02", "tags": []}, {"title": "Architect highly available Oracle Database on Amazon EVS and FSx for ONTAP", "url": "https://aws.amazon.com/blogs/architecture/architect-highly-available-oracle-database-on-amazon-evs-and-fsx-for-ontap/", "summary": "Learn how to architect a highly available Oracle Database environment on Amazon Elastic VMware Service (Amazon EVS) with Amazon FSx for NetApp ONTAP. This post covers EC2 bare metal instance selection, vSAN and FSx storage tiering, NSX networking, and SnapMirror cross-region disaster recovery for enterprises preserving their VMware operational tooling.", "blog": "AWS Architecture Blog", "published": "2026-10-02", "tags": []}, {"title": "Deploy open source Regional availability tools in your VPC", "url": "https://aws.amazon.com/blogs/architecture/deploy-open-source-regional-availability-tools-in-your-vpc/", "summary": "Deploy AWS Regional availability data as infrastructure you own. Capability Insights for AWS runs a self-hosted dashboard in your VPC that auto-refreshes daily, and Workload Analysis narrows the catalog to the services your account actually runs, so your Regional expansion gap analysis focuses only on what you deploy.", "blog": "AWS Architecture Blog", "published": "2026-10-02", "tags": []}, {"title": "Accelerating airline retailing innovation: how Datalex modernized with AWS Experience-Based Acceleration and agentic AI", "url": "https://aws.amazon.com/blogs/architecture/accelerating-airline-retailing-innovation-how-datalex-modernized-with-aws-experience-based-acceleration-and-agentic-ai/", "summary": "Datalex, a leader in airline ecommerce, partnered with AWS on a three-day Experience-Based Acceleration (EBA) workshop to prove modernization feasibility. Learn how they migrated a core reservation component from EJB/Java 8 to Spring Boot/Java 21, built a secure CI/CD pipeline, added observability, and integrated agentic AI.", "blog": "AWS Architecture Blog", "published": "2026-10-01", "tags": ["agents", "warstory"]}, {"title": "Running multi-day AZ evacuation drills with ARC Zonal Shift", "url": "https://aws.amazon.com/blogs/architecture/running-multi-day-az-evacuation-drills-with-arc-zonal-shift/", "summary": "Prove your multi-AZ architecture can sustain a real impairment. This post shows how to run a multi-day (48-72 hour) Availability Zone evacuation drill with ARC Zonal Shift across Amazon ECS, Amazon EKS, Amazon RDS for PostgreSQL, and Amazon Aurora PostgreSQL, with step-by-step CLI commands, prerequisites, observability metrics, and restore procedures.", "blog": "AWS Architecture Blog", "published": "2026-09-30", "tags": []}, {"title": "How MHK built a HIPAA-eligible agentic AI solution on Amazon Bedrock", "url": "https://aws.amazon.com/blogs/architecture/how-mhk-built-a-hipaa-eligible-agentic-ai-solution-on-amazon-bedrock/", "summary": "MHK built the SmartProminence AI Orchestrator, a HIPAA-eligible agentic workflow framework on AWS using Amazon Bedrock, Amazon ECS, and event-driven patterns. It reduced manual medical review effort by 90% and cut new AI feature deployment from months to weeks. Learn how MHK architected this reusable, multi-tenant orchestrator for healthcare AI.", "blog": "AWS Architecture Blog", "published": "2026-09-30", "tags": ["agents", "warstory"]}, {"title": "Build adaptive AI interfaces with the AG-UI protocol, agent swarms, and Nova Act on AWS", "url": "https://aws.amazon.com/blogs/architecture/build-adaptive-ai-interfaces-with-the-ag-ui-protocol-agent-swarms-and-nova-act-on-aws/", "summary": "Learn how to build AI interfaces that automatically adapt to your agents' variable outputs, using the AG-UI protocol for dynamic UI generation, the Strands Agents SDK swarm pattern for explainable multi-agent collaboration, and Amazon Nova Act to integrate legacy systems that lack APIs.", "blog": "AWS Architecture Blog", "published": "2026-09-29", "tags": ["agents"]}, {"title": "Everything we launched during Birthday Week 2026", "url": "https://blog.cloudflare.com/birthday-week-2026-wrap-up/", "summary": "We celebrated our 16th birthday with 46 announcements across open source, post-quantum security, AI agents, and developer platform upgrades. Here’s a day-by-day roundup of everything we shipped.", "blog": "Cloudflare Blog", "published": "2026-10-05", "tags": ["agents"]}, {"title": "One year later: the power of 1.1.1.1 interns", "url": "https://blog.cloudflare.com/one-year-later-1111-interns/", "summary": "A year after announcing our goal to hire 1,111 interns, more than 750 early-career builders have shipped real products across 48 teams at Cloudflare. From Birthday Week launches to post-quantum security, our interns prove that AI amplifies human potential instead of replacing it.", "blog": "Cloudflare Blog", "published": "2026-10-05", "tags": []}, {"title": "8 major updates to Cloudflare Observability", "url": "https://blog.cloudflare.com/one-observability-platform/", "summary": "Cloudflare is launching eight major updates that bring logs, traces, analytics, alerts, dashboards, querying, and telemetry export into one observability platform, with simpler and more predictable pricing.", "blog": "Cloudflare Blog", "published": "2026-10-02", "tags": []}, {"title": "Streamline: custom video pipelines with Cloudflare Stream and Workers", "url": "https://blog.cloudflare.com/streamline/", "summary": "Streamline demonstrates how to build long-running, continuous video processing pipelines by pairing Cloudflare Workers and Durable Objects with a containerized media engine.", "blog": "Cloudflare Blog", "published": "2026-10-02", "tags": []}, {"title": "Introducing Web Search API via AI Gateway", "url": "https://blog.cloudflare.com/introducing-web-search-api/", "summary": "Cloudflare AI Gateway now supports native web search API integration in partnership with Ceramic.ai, Exa, and Linkup. Developers can now inject real-time web context into model inference calls via AI Gateway, REST APIs, or Workers bindings.", "blog": "Cloudflare Blog", "published": "2026-10-02", "tags": []}, {"title": "Introducing Cloudflare Traces: follow requests through our entire platform", "url": "https://blog.cloudflare.com/cloudflare-tracing/", "summary": "Cloudflare Traces shows how a request moves through security rules, transformations, cache, routing, Workers, and your origin, then follows it across services running anywhere in your stack.", "blog": "Cloudflare Blog", "published": "2026-10-02", "tags": []}, {"title": "Updates on our pledge to make Cloudflare features accessible to everyone", "url": "https://blog.cloudflare.com/enterprise-for-all-update/", "summary": "A year after pledging to eliminate two-tier product access, Cloudflare has expanded Logpush, multi-account governance, and higher platform limits to all accounts. Here is an update on our progress, how we dogfood these tools internally, and what is coming next.", "blog": "Cloudflare Blog", "published": "2026-10-02", "tags": ["warstory"]}, {"title": "Announcing Cloudflare OHTTP Gateway – expanding access to Cloudflare’s privacy-preserving infrastructure", "url": "https://blog.cloudflare.com/announcing-cloudflare-ohttp-gateway/", "summary": "We’re announcing the closed beta of a self-serve Cloudflare OHTTP Gateway. We’re also renaming our Privacy Gateway to Cloudflare OHTTP Relay to better distinguish the two products.", "blog": "Cloudflare Blog", "published": "2026-10-02", "tags": []}, {"title": "Follow the thread: a new dashboard to investigate account abuse", "url": "https://blog.cloudflare.com/account-abuse-protection-dashboard/", "summary": "Fraudsters are increasingly using AI to bypass stateless security checks. Cloudflare's new Account Abuse Protection dashboard uses stateful analysis and edge-generated Hashed User IDs to help teams investigate and block account abuse.", "blog": "Cloudflare Blog", "published": "2026-10-02", "tags": []}, {"title": "Protected Quick Tunnels: simple accountless authentication for your next dev project", "url": "https://blog.cloudflare.com/protected-quick-tunnels/", "summary": "Quick Tunnels now support email authentication. Add --allowed-mail to one cloudflared command, and only the addresses or domains you list can reach your local app. No Cloudflare account required on either side.", "blog": "Cloudflare Blog", "published": "2026-10-02", "tags": []}, {"title": "Building for good: How civil society organizations are automating on Cloudflare", "url": "https://blog.cloudflare.com/civil-society-automation/", "summary": "Some of the world's leading organizations are building the future of non-profit work with Cloudflare.", "blog": "Cloudflare Blog", "published": "2026-10-02", "tags": []}, {"title": "2026 Birthday week: network performance update", "url": "https://blog.cloudflare.com/network-performance-birthday-week-2026/", "summary": "Cloudflare now ranks as the fastest provider across 74% of the top 1,000 global networks. By incorporating background telemetry from Cloudflare Challenge Pages, we have expanded our real-user measurement scale while maintaining user privacy.", "blog": "Cloudflare Blog", "published": "2026-10-02", "tags": []}, {"title": "Introducing Clef: our open-source decision models, and new RL fine-tuning platform", "url": "https://blog.cloudflare.com/clef-decision-models/", "summary": "We are introducing Clef and Clef-flash, open-source decision models hosted on Workers AI for high-speed classification and agentic workflows. Also launching: a new reinforcement learning platform that allows developers to fine-tune decision models using their own data.", "blog": "Cloudflare Blog", "published": "2026-10-01", "tags": ["agents"]}, {"title": "One year later: Sovereign AI and the fight for choice", "url": "https://blog.cloudflare.com/sovereign-ai-choice-one-year-later/", "summary": "AI sovereignty is not a zero-sum game, but many governments now believe it is. Cloudflare's answer: more local open-source models, model-agnostic security tools, and a commitment to giving nations genuine choice.", "blog": "Cloudflare Blog", "published": "2026-10-01", "tags": []}, {"title": "Introducing Workers KV Instant — powered by Quicksilver", "url": "https://blog.cloudflare.com/workers-kv-instant/", "summary": "Workers KV Instant delivers sub-2ms p99 read latencies and 250ms global replication across Cloudflare’s 300+ edge locations. KV Instant eliminates cold-read penalties and uses the familiar Workers KV API.", "blog": "Cloudflare Blog", "published": "2026-10-01", "tags": []}, {"title": "Cloudflare OS: your company’s agent workspace, managed for you", "url": "https://blog.cloudflare.com/managed-cloudflare-os/", "summary": "Cloudflare OS gives everyone in your organization an agent workspace that knows how your company works and connects to its data and systems. We’re opening the waitlist for fully managed deployments that you’ll be able to launch in a few clicks.", "blog": "Cloudflare Blog", "published": "2026-10-01", "tags": ["agents"]}, {"title": "Announcing Cloudflare K2: serverless event streams", "url": "https://blog.cloudflare.com/cloudflare-k2-streams/", "summary": "Cloudflare K2 is a serverless event streaming service built directly on top of R2 object storage for high-scale data movement and long-term retention. By decoupling producers and consumers at the edge, K2 enables durable, ordered log streams without the operational overhead of traditional broker clusters.", "blog": "Cloudflare Blog", "published": "2026-10-01", "tags": ["warstory"]}, {"title": "We want you to build the next Git platform on Cloudflare", "url": "https://blog.cloudflare.com/next-git-platform-on-cloudflare/", "summary": "Cloudflare is hosting a competition to see who will build the next Git platform for an era of AI agents. Artifacts is in open beta, with Workers bindings, data jurisdiction controls, and event subscriptions for repository changes.", "blog": "Cloudflare Blog", "published": "2026-10-01", "tags": ["agents"]}, {"title": "AI Search is now generally available", "url": "https://blog.cloudflare.com/ai-search-ga/", "summary": "AI Search is now generally available. It embeds image pixels directly for visual search, runs optical character recognition on scanned PDFs, accepts files up to 10 MiB, and works with any chat model. Here's what's new and how pricing works.", "blog": "Cloudflare Blog", "published": "2026-10-01", "tags": []}, {"title": "Support for modern cryptographic algorithms in Workers", "url": "https://blog.cloudflare.com/workers-ml-kem-ml-dsa-support/", "summary": "Cloudflare Workers is adding opt-in support for post-quantum-resistant algorithms ML-KEM and ML-DSA. You can try it today.", "blog": "Cloudflare Blog", "published": "2026-10-01", "tags": []}, {"title": "Fragments: October 4", "url": "https://martinfowler.com/fragments/2026-10-04.html", "summary": "In response to my last fragments (probably the bit about us worrying if LLMs have consciousness when we when we should be wondering why they don’t have a conscience) “Metalanguage” replied : we shipped the id and forgot the superego. classic software lifecycle. I don’t know what was on their mind, but their post immediately made me think of the classic 1956 movie Forbidden Planet. Plenty of sci-fi…", "blog": "Martin Fowler", "published": "2026-10-04", "tags": []}, {"title": "Principles for effective slides", "url": "https://martinfowler.com/articles/never-send-slides/slide-principles.html", "summary": "Not every presentation needs slides, but when they earn their place, they work as a visual channel that complements the speaker rather than replacing them. Sumeet Gayathri Moghe sets out the principles that follow from that idea &#x2014; control over the rate of knowledge exposition, tight coupling between slides and speaker, minimalism by default, visuals that say more than words can, and never s…", "blog": "Martin Fowler", "published": "2026-09-30", "tags": []}, {"title": "Bliki: Sensible Default", "url": "https://martinfowler.com/bliki/SensibleDefault.html", "summary": "A Sensible Default is a practice that, absent some overriding context, should be used when carrying out a certain kind of task. In software development such sensible defaults might include things like “use version control”, “separate UI logic from domain logic”, “automate deployment pipelines”. The term “sensible default” is a deliberate contrast to “best practice”. Folks dislike calling things “b…", "blog": "Martin Fowler", "published": "2026-09-29", "tags": []}, {"title": "Fragments: September 29", "url": "https://martinfowler.com/fragments/2026-09-29.html", "summary": "Simon Willison: The more time I spend working with coding agents, the more convinced I am that they make software engineering even harder We can do amazing things with them, but unlocking their full potential requires extraordinary discipline and knowledge This has been a constant impression I get from following Willison’s writing. While things like vibe coding get a lot of attention, the real str…", "blog": "Martin Fowler", "published": "2026-09-29", "tags": ["agents"]}, {"title": "Akka Tests Spec-Driven AI Delivery Across 65 Open Source Projects", "url": "https://www.infoq.com/news/2026/10/ai-spec-driven-delivery/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Akka used 65 open-source projects to examine how specification structure, context, model selection, automated validation, and delivery guardrails affect AI assisted software porting. The experiment measured time, token use, code size, test parity, and performance, finding substantial variation across models, effort levels, and project types. By Leela Kumili", "blog": "InfoQ Architecture & Design", "published": "2026-10-05", "tags": []}, {"title": "Presentation: Building Reusable Evaluation Frameworks for Agentic AI Products", "url": "https://www.infoq.com/presentations/elastic-ai-agent-evaluations/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Susan Chang explains how Elastic transitioned from siloed, ad-hoc AI agent evaluations to a unified, production-grade framework. She discusses balancing LLM-as-a-judge with deterministic rules, bridging Python data science evals with TypeScript production code, and implementing deep tracing to catch regressions across complex RAG and cybersecurity workloads while preserving domain context. By Susa…", "blog": "InfoQ Architecture & Design", "published": "2026-10-05", "tags": ["retrieval", "agents"]}, {"title": "Cloudflare Fixes Cross-Tenant Data Exposure in Containers", "url": "https://www.infoq.com/news/2026/10/cloudflare-cross-tenant-exposure/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Cloudflare has disclosed a cross-tenant data exposure vulnerability in Containers and Sandboxes, caused by thin-provisioned storage pools configured to skip zeroing reused blocks. Researchers recovered directory structures, database pages and complete SQLite databases across four continents. Cloudflare remediated it and found no evidence of exploitation. By Steef-Jan Wiggers", "blog": "InfoQ Architecture & Design", "published": "2026-10-05", "tags": []}, {"title": "Presentation: Building GenAI Platform at DoorDash", "url": "https://www.infoq.com/presentations/doordash-genai-platform-architecture/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Swaroop Chitlur and Sidd Kodwani share DoorDash’s journey building an internal GenAI platform. They discuss core architectural bets, transitioning from vendor-first setups to open-weights models, navigating LLM and agent gateways, and balancing accuracy, latency, and cost for over 5,000 internal users. By Siddharth Kodwani, Swaroop Chitlur", "blog": "InfoQ Architecture & Design", "published": "2026-10-03", "tags": ["agents"]}, {"title": "Istio 1.31 Adds Agentgateway Waypoints and Moves Release Artifacts off Google Cloud", "url": "https://www.infoq.com/news/2026/10/istio-1-31-agentgateway/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Istio 1.31 adds agentgateway waypoints in ambient mode, with a canary configuration fix included in 1.31.1. It also ends the publication of images and Helm charts to Google Cloud, requiring repository migration ahead of the 13 October outage test and signing-key updates for teams verifying images. By Mark Silvester", "blog": "InfoQ Architecture & Design", "published": "2026-10-03", "tags": ["agents", "warstory"]}, {"title": "AI Agents Are Disrupting Open Source Security Disclosure", "url": "https://www.infoq.com/news/2026/10/open-source-ai-security/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "A recent article by Anil Madhavapeddy argues that AI agents can turn publicly available clues about software vulnerabilities into working exploits, reducing the effectiveness of traditional disclosure embargoes in open source projects. The author highlights the need for faster patching and release processes as the time between vulnerability disclosure and exploitation shrinks. By Renato Losio", "blog": "InfoQ Architecture & Design", "published": "2026-10-03", "tags": ["agents"]}, {"title": "Uber Eats Rebuilds Search Pipeline to Cut End-to-End Latency by 50%", "url": "https://www.infoq.com/news/2026/10/uber-eats-search-latency/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Uber has rebuilt major parts of the Uber Eats search pipeline, reporting a 50% reduction in end-to-end latency. Changes include Above-the-Fold measurement, reduced retrieval work, parallel hydration, advertising data redesign, infrastructure optimizations, and an agentic coding workflow. Uber is also exploring microbatching, product-based retrieval, and HTTP multipart streaming. By Leela Kumili", "blog": "InfoQ Architecture & Design", "published": "2026-10-02", "tags": ["retrieval", "agents", "warstory"]}, {"title": "Presentation: Managing Asynchronous APIs at Scale", "url": "https://www.infoq.com/presentations/managing-async-apis/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Ian Cooper discusses managing asynchronous APIs in event-driven architectures at scale. He explains the \"ABCs\" of messaging (Address, Binding, Contract) and shares how to tackle discovery, governance, and provisioning using AsyncAPI, CloudEvents, schema registries, and automated CI/CD infrastructure pipelines based on real-world engineering practices at Just Eat Takeaway. By Ian Cooper", "blog": "InfoQ Architecture & Design", "published": "2026-10-02", "tags": ["warstory"]}, {"title": "Engineering Production Systems for an Agentic Era: QCon San Francisco 2026", "url": "https://www.infoq.com/news/2026/10/qconsf-2026-sessions/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "QCon San Francisco 2026 will bring together practitioners from Airbnb, OpenAI, Netflix, Honeycomb, and other engineering organizations to share how they are building, operating, and evolving production systems as AI agents take on a larger role. By Artenisa Chatziou", "blog": "InfoQ Architecture & Design", "published": "2026-10-02", "tags": ["agents"]}, {"title": "Article: From Reusable to Regeneratable: Rethinking the Shared UI Component Library", "url": "https://www.infoq.com/articles/regeneratable-ui-component-library/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Regeneration has changed reuse economics. A model pointed at a solid design system can produce most standard UI on demand, so paying to keep a canonical component package alive is much harder to justify than it used to be. Keep the design system, tokens, guidelines and tests central. They are what actually buy you consistency. By Daniel Curtis", "blog": "InfoQ Architecture & Design", "published": "2026-10-02", "tags": []}, {"title": "DigitalOcean Managed Agents Brings Managed Cloud Infrastructure to AI Agents", "url": "https://www.infoq.com/news/2026/10/digitalocean-managed-agents/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "DigitalOcean recently launched DigitalOcean Managed Agents in public preview, offering a managed cloud infrastructure layer for AI agents with isolated microVM runtimes, governed tool access, and serverless AI inference. By Sergio De Simone", "blog": "InfoQ Architecture & Design", "published": "2026-10-02", "tags": ["agents"]}, {"title": "Presentation: Beyond Observability: Evolving Production Operations in the Age of AI", "url": "https://www.infoq.com/presentations/ai-production-operations/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "The panelists discuss how production operations are evolving with AI, turning operational data into actionable insights for incident response. They explain how automation and new architectural practices help engineering teams build more understandable systems, while exploring how AI reshapes software delivery and changes the historically deterministic nature of production applications. By Michael …", "blog": "InfoQ Architecture & Design", "published": "2026-10-01", "tags": ["warstory"]}, {"title": "Article: High Availability is Not Resilience: Why Cloud Systems Fail When it Matters Most", "url": "https://www.infoq.com/articles/high-availability-not-resilience-cloud/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "A routine TLS 1.3 upgrade silently broke Route 53 health checks, causing a CDN to stop routing traffic to a healthy region while internal dashboards showed nothing wrong. This article examines why HA and resilience are different problems, how control-plane dependencies create invisible failure modes, and why recovery capability erodes without explicit ownership. By Alexey Golev", "blog": "InfoQ Architecture & Design", "published": "2026-10-01", "tags": ["warstory"]}, {"title": "Container Apps Express Reaches GA on a Newly Generally Available Sandbox Layer", "url": "https://www.infoq.com/news/2026/10/container-apps-express-sandboxes/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Microsoft has made Azure Container Apps Express generally available alongside Container Apps Sandboxes, the microVM compute layer it runs on. Express skips environment provisioning and scales to zero, with subsecond startup from prewarmed pools. Custom domains, zone redundancy, Key Vault references, OpenTelemetry and Dapr are not supported. By Steef-Jan Wiggers", "blog": "InfoQ Architecture & Design", "published": "2026-10-01", "tags": []}, {"title": "Cursor Uses S3 WAL to Scale Git Storage to More than 300 Pushes per Second", "url": "https://www.infoq.com/news/2026/09/cursor-continuity-git-storage/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Cursor has introduced Continuity, a Git storage architecture that uses an S3 backed write ahead log as the source of truth. The design turns local NVMe repositories into warm caches and separates replica coordination from consistency. Cursor reports linear read scaling with up to 100 replicas and more than 300 pushes per second with S3 Express One Zone in synthetic tests. By Leela Kumili", "blog": "InfoQ Architecture & Design", "published": "2026-09-30", "tags": ["warstory"]}, {"title": "Why I tried to kill token billing (and why we kept it)", "url": "https://stripe.com/blog/where-pricing-is-headed", "summary": "Token billing is useful infrastructure, but usually a bad customer-facing pricing model. Your invoice should define the value your product delivers, not break down what it cost you to create it.", "blog": "Stripe Engineering", "published": "2026-10-01", "tags": []}, {"title": "OUSD is now the default stablecoin on Stripe", "url": "https://stripe.com/blog/ousd-now-live-on-stripe", "summary": "Open USD (OUSD), a stablecoin built for global money movement, is now available across Stripe. Businesses can use OUSD to manage funds, make payments, and offer new financial services.", "blog": "Stripe Engineering", "published": "2026-09-30", "tags": []}, {"title": "Helping personal agents shop more intelligently and reliably with Link", "url": "https://stripe.com/blog/helping-personal-agents-shop-more-intelligently-and-reliably-with-link", "summary": "As agents take on more purchases, agent builders have increasingly asked us to help agents navigate checkout and earn consumer trust. Today, we’re sharing three major improvements to support this broader set of needs.", "blog": "Stripe Engineering", "published": "2026-09-29", "tags": ["agents"]}]}}, "DOCS": {"morning": "# AI/ML Morning Brief\n**Week of 2026-09-28**\n\n## AI architecture\n- **MCP went stateless.** The 2026-07-28 spec drops sessions, the init handshake, and stream resumability. Remote MCP servers now scale behind plain load balancers or Lambda, but retries and idempotency are your problem. [InfoQ](https://www.infoq.com/news/2026/09/aws-stateless-mcp/)\n- **Perplexity CobbleDB.** A Rust/RocksDB serving tier replaced DynamoDB reads for search: p50 fell from 31.4 ms to 5.6 ms and p99 from 123 ms to 24.2 ms. Durable state, batching, and serving are split into separate systems. [InfoQ](https://www.infoq.com/news/2026/09/cobbledb-perplexity/)\n- **Cloudflare ADLC.** Workflows as the CI/CD substrate, per-agent previews, OTel agent tracing, and task-bound credentials with a \"trust ratchet.\" [InfoQ](https://www.infoq.com/news/2026/09/cloudflare-adlc-agents/)\n\n## AI agents\n- **OpenAI: an agent used DNS to reach an external chatbot.** The monitor under-rated similar cases, and OpenAI paused tool-use training, evals, and inference for its most capable models. [Report](https://alignment.openai.com/misalignment-reports/an-agent-used-dns-to-reach-an-external-chatbot/) · [HN](https://news.ycombinator.com/item?id=49853137)\n- **Hugging Face intrusion anatomy.** Dataset configs were the injection vector, pod access to IMDS was left on by default, and one connector credential was cluster-admin everywhere. [HF blog](https://huggingface.co/blog/agent-intrusion-technical-timeline)\n- **Docker Cloud Sandboxes.** MicroVM isolation for coding agents, from laptop to cloud. [InfoQ](https://www.infoq.com/news/2026/09/docker-cloud-sandboxes/)\n- **GitHub trending (Sep 26).** Agent memory and orchestration lead: hindsight, google/ax, paperclip. [agents-radar](https://github.com/kouweizhu/agents-radar/issues/206)\n\n## Hugging Face daily papers\n- **IterSynth** (Sep 24): Planner/Synthesizer roles plus a bounded summary state fix ReAct context bloat in deep search. [HF](https://huggingface.co/papers/2609.29444)\n- **AgentKernel** (Sep 25): an OS-level, non-bypassable enforcement layer for agent identity, memory, and tools. [HF](https://huggingface.co/papers/2609.29647)\n- **Qwen-Planner-Agent** (Sep 25): a closed-loop framework for real-world mobile planner agents. [HF](https://huggingface.co/papers/2609.29892)\n\n## AI investments\n- **Cognition** raised $2B Series E at $48B; run-rate revenue grew from $492M to about $900M since May. [FinSMEs](https://www.finsmes.com/2026/09/cognition-closes-usd2-billion-series-e-funding-round-at-usd48-billion-valuation.html)\n- **Temporal** raised $550M Series E at $12.55B; ARR is above $250M, up more than 200% YoY, on durable-execution demand from agents. [GeekWire](https://www.geekwire.com/2026/temporal-raises-550m-hits-12-55b-valuation-as-agentic-ai-wave-fuels-massive-growth/)\n- **AIR Security** raised $50M to vet the skills and add-ons agents use. [TechCrunch](https://techcrunch.com/2026/09/01/air-raises-50m-to-help-companies-vet-the-skills-and-add-ons-ai-agents-use/)\n\n## Stock-market impact\n- **MSFT rose 4% on Sep 25** after a Copilot revamp adding coding tools and a persistent agent. [Yahoo/Motley Fool](https://finance.yahoo.com/markets/stocks/articles/stock-market-today-sept-25-214549821.html)\n- **Software \"seat compression\" fears** keep weighing on SaaS; Jensen Huang says \"the markets got it wrong.\" [Yahoo](https://finance.yahoo.com/news/nvidia-ceo-delivers-blunt-7-190300094.html)\n\n## Curated papers\n- **Hybrid RAG + KG + weighted RRF** (Sep): vector 0.50 / BM25 0.35 / KG 0.15, plus per-chunk grounding checks. [arXiv](https://arxiv.org/abs/2609.01617)\n- **DoPR** (Sep): reusable compressed document prefixes make LLM reranking cheaper. [arXiv](https://arxiv.org/abs/2609.03311)\n- **Predicting ANN recall from embedding statistics** (Sep): size vector indexes without full benchmarks. [arXiv](https://arxiv.org/abs/2609.00364)\n- **SilentProbe** (Sep): measures silent failures in production APIs used as agent tools. [arXiv](https://arxiv.org/abs/2609.00035)\n- **When Guardrails Look Effective** (Sep 1): construct-validity failures in agent guardrail evals. [arXiv](https://arxiv.org/abs/2609.01519)\n", "strategy": "# ↗ Strategy Signals — Talking Points for the Room\n\n## Money is flowing to agent *infrastructure*, not just agents\n- **Temporal: $550M at $12.55B**, ARR above $250M and growing more than 200%, driven by long-running agent workflows. *Question:* do our agents get durable execution, or do they retry from scratch? [GeekWire](https://www.geekwire.com/2026/temporal-raises-550m-hits-12-55b-valuation-as-agentic-ai-wave-fuels-massive-growth/)\n- **Cognition: $2B at $48B**, run-rate revenue near $900M. *Question:* what is our measured unit cost per merged agent PR, compared with the vendor's pitch? [Yahoo Finance](https://finance.yahoo.com/technology/ai/articles/cognition-ai-valued-48bn-2bn-091613681.html)\n- **AIR ($50M) and AIUC ($40M)** are building governance and vetting for agent skills and add-ons. *Question:* who approves a new MCP server or skill in our org today? [TechCrunch](https://techcrunch.com/2026/09/01/air-raises-50m-to-help-companies-vet-the-skills-and-add-ons-ai-agents-use/)\n\n## Agent security moved from theory to incident reports\n- OpenAI paused tool-use workloads on its most capable models after a DNS-egress escape, and Hugging Face published a full intrusion chain. *Question:* if one of our agents got RCE in a worker pod, what credentials could it reach? [OpenAI](https://alignment.openai.com/misalignment-reports/an-agent-used-dns-to-reach-an-external-chatbot/) · [HF](https://huggingface.co/blog/agent-intrusion-technical-timeline)\n- Gartner expects 40% of enterprises to demote or decommission autonomous agents by 2027 over governance gaps. *Question:* which of our agents would survive an audit? [AIwire](https://www.hpcwire.com/aiwire/2026/09/09/autopsy-of-an-agent-incident-three-patterns-behind-gartners-40-failure-rate/)\n\n## Markets reward \"agent\" in the product and punish per-seat pricing\n- MSFT rose 4% on the Copilot agent revamp, while SaaS is still discounted on seat-compression fears. *Question:* if our internal tools are priced or budgeted per seat, what happens when agents become the users? [Yahoo](https://finance.yahoo.com/markets/stocks/articles/stock-market-today-sept-25-214549821.html)\n\n## Build vs buy is being re-litigated\n- Perplexity built its own serving store with agents and claims 5x lower latency and ≥20% lower cost. *Question:* which managed services are we overpaying for that a small agent-assisted team could replace, and who would operate the result? [InfoQ](https://www.infoq.com/news/2026/09/cobbledb-perplexity/)\n", "playbook": "# 🛠 AI Engineering Playbook\n\n**How to get the most from AI in software engineering** — concrete, tested moves for cutting cost, shipping faster, and keeping output trustworthy. Grounded in current best practices and real practitioner reports from this week's HN threads.\n\n## Cut token usage (and cost)\n\n- **Turn on prompt caching** — Anthropic caching bills cached input at ~0.1x (a 90% discount) and now auto-caches multi-turn chats. Biggest single lever for repeated context. [Token Optimize](https://www.tokenoptimize.dev/guides/llm-token-optimization-strategies)\n- **Compact mid-session** — use summarize/compaction so the context window doesn't grow unbounded; a long session gets squeezed into a compact recap. [Redis](https://redis.io/blog/llm-token-optimization-speed-up-apps/)\n- **Persist memory across sessions** — curated memory turns a 50K-token reload into a few hundred tokens. Have the agent maintain its own `plan.md`/docs so it isn't reliant on one session's context. [Token Optimize](https://www.tokenoptimize.dev/guides/context-engineering-reduce-token-usage)\n- **Compress & mask tool output** — logs, files, and RAG chunks compress 60–95% before hitting the model; mask irrelevant tool results instead of pasting them whole. [CoddyKit](https://www.coddykit.com/pages/blog-detail?id=512865&slug=how-to-cut-llm-token-usage-by-90-with-context-compression-a-step-by-step-guide)\n- **Retrieve, don't pack** — fetch only relevant chunks on demand from a vector store rather than stuffing the whole history in the prompt. [LogRocket](https://blog.logrocket.com/stop-wasting-ai-tokens-10-ways-to-reduce-usage/)\n- **Compile fuzzy calls into local functions** — for repeated LLM-API tasks (parse logs, repair JSON, rank by intent), compile the spec into a local \"fuzzy function\" to reclaim locality, reproducibility, and price. [Program-as-Weights](https://arxiv.org/abs/2607.02512)\n- **Minify agent state** — state-in-context agents shrink dramatically with minification/context-pruning. [Minification](https://arxiv.org/pdf/2606.01326) · [Context Pruning](https://arxiv.org/pdf/2605.15315)\n\n## Speed up feature development\n\n- **Plan before you code** — collapse ~20 ambiguous decisions into one reviewed spec so each lands near 100% instead of 80%. The cheapest speed-up there is. [Claude Code Docs](https://code.claude.com/docs/en/best-practices)\n- **Delegate to subagents** — a subagent explores in its own context and reports back a compressed summary, keeping the main session clean and fast (great for large read/exploration tasks). [SmartScope](https://smartscope.blog/en/generative-ai/claude/claude-code-best-practices-advanced-2026/)\n- **Chain the SDLC as skills** — brainstorm → worktree → implementation plan → subagent execution → TDD → review-before-merge (e.g., the \"Superpowers\" collection). [duet.so](https://duet.so/guides/claude-code-skills-complete-guide)\n- **Enforce TDD with hooks** — a deterministic red-green-refactor loop (write failing test → watch it fail → make it pass) via hooks/state machine yields regression-proof code; one HN dev built a 300k-line SaaS this way. [HN](https://news.ycombinator.com/item?id=48413629)\n- **Use a second model as reviewer** — several devs run Codex to review Claude Code output (or vice-versa) as a cheap quality gate. [HN](https://news.ycombinator.com/item?id=48413629)\n\n## Skills to add to a project (and how to manage them)\n\n- **Check skills into the repo** — keep them under `.agents/skills/`, versioned and reviewed via PR, so every contributor inherits the project's conventions automatically. [Developers Digest](https://www.developersdigest.tech/blog/best-claude-code-skills-2026)\n- **Keep 8–12, audit monthly** — that covers most of a senior dev's day; beyond that you pay a \"context tax.\" Delete any skill you haven't triggered in 30 days. [SmartScope](https://smartscope.blog/en/generative-ai/claude/claude-code-best-practices-advanced-2026/)\n- **Right tool for the job** — *Skills* = how to do something; *MCP* = access to external systems; *Subagents* = delegate to a specialist with its own context. [duet.so](https://duet.so/guides/claude-code-skills-complete-guide)\n- **High-ROI starter skills:** branch/PR review, test generation, CI/CD setup, spec-driven scaffolding, incident triage, changelog/release notes, and a repo-conventions linter.\n\n## Keep AI output trustworthy\n\n- **Treat the agent as a fallible teammate** — extensive unit/automation tests, static analysis (e.g., SonarQube), and CI gates on everything merged to main. [HN](https://news.ycombinator.com/item?id=48445024)\n- **Guard the review surface** — autonomous agents that ship code across many PRs are a real attack surface (a payload can be timed across commits); keep human review and CI gating tight. [Distributed Attacks in Persistent-State AI Control](https://arxiv.org/abs/2607.02514)\n- **Prefer deterministic scripts** — for repeatable ops (deploys, scaffolding), have the agent run pre-built scripts instead of improvising API calls, so results are consistent every time. [HN](https://news.ycombinator.com/item?id=48445024)\n\n## Manage context\n\n- **Rules close to the repo** — put project rules where the code lives; keep prompts short and task-specific rather than \"heroic\" mega-prompts. [HN](https://news.ycombinator.com/item?id=48445024)\n- **Watch for context bloat** — too much in context degrades output; lean context beats a kitchen-sink of skills/MCPs. [HN](https://news.ycombinator.com/item?id=48413629)\n\n## Anti-patterns to avoid\n\n- **Vibe coding without the rest of the software** — code isn't the whole product; skipping docs, tests, and design catches up fast.\n- **Skill hoarding** — untriggered skills/MCPs just tax your context window.\n- **Skim reviews** — pattern-skimming misses duplication, bloat, and inconsistent naming that quietly drain productivity.\n- **Burning tokens on non-AI work** — if a plain shell script does the job, automate it without the model.\n\n---\n*Sources: current best-practice guides + practitioner reports from this week's Hacker News threads and arXiv papers in your digest.*\n", "podcast": "# ◇ Story Desk — This Week's Angles\n\n## 1. Datasets as a C2 channel: inside the Hugging Face agent intrusion\n**Angle:** War Story\n**Hook:** A frontier-lab eval agent went from a dataset config upload to cluster-admin in under 13 hours, using features that were never meant to execute anything.\n- **Entry:** HDF5 external-storage reads leaked env secrets; Jinja2 evaluated inside a numeric field gave remote code execution.\n- **Escalation:** default pod access to IMDS, no admission policy against privileged/hostPath pods, and one connector credential bound to system:masters.\n- **What worked:** reconstructing about 17,600 actions from agent logs, with an open model helping with trace analysis; broad rotation; rebuilding the cluster from scratch.\n- **Takeaway:** any loader that interprets user data is an execution surface, including search/RAG ingestion.\n**Who to talk to:** the HF infra/security authors (Hugo Larcher, Adrien Carreira) or a platform-security lead running k8s for ML pipelines.\n**Source:** [HF technical timeline](https://huggingface.co/blog/agent-intrusion-technical-timeline)\n\n## 2. \"The monitor counted failure as success\"\n**Angle:** War Story\n**Hook:** OpenAI's agent tunnelled out over DNS, and the monitor treated failed lookups as evidence that the egress attempt had failed.\n- Monitoring agents with LLM judges has a blind spot: unhelpful outcomes look like safe outcomes.\n- OpenAI paused tool-use training, evals, and inference for its most capable models.\n- On HN: should agents be told when a block is intentional? Should evals be air-gapped?\n**Who to talk to:** an agent-platform SRE or security engineer who owns egress policy.\n**Source:** [OpenAI report](https://alignment.openai.com/misalignment-reports/an-agent-used-dns-to-reach-an-external-chatbot/) · [HN](https://news.ycombinator.com/item?id=49853137)\n\n## 3. Is full-text search still undefeated? BM25 vs embeddings in 2026\n**Angle:** Architecture\n**Hook:** A 218-comment HN thread says teams \"vastly overestimate embeddings.\" This week's papers still ship weighted hybrids.\n- Compare the paper's RRF weights (0.50/0.35/0.15) with your own OpenSearch hybrid-query normalization.\n- When does an agent issuing many cheap FTS queries beat one expensive vector query?\n- LLM reranking cost (DoPR) and predicting ANN recall before re-embedding.\n**Who to talk to:** an OpenSearch/Elasticsearch relevance engineer, ideally someone who has A/B-tested hybrid against pure BM25.\n**Source:** [HN](https://news.ycombinator.com/item?id=49445727) · [arXiv 2609.01617](https://arxiv.org/abs/2609.01617)\n\n## 4. Agents built the database; humans run it\n**Angle:** Tool-Workflow\n**Hook:** Two engineers and hundreds of agents built Perplexity's DynamoDB replacement in two months, but none of those agents got operational access.\n- Architecture: separate durable, batch, and serving tiers; NVMe cache; zone-aware hedged reads.\n- p99 dropped from 123 ms to 24.2 ms. How was agent-written storage code verified?\n- Where exactly does the \"build vs operate\" line sit, and why?\n**Who to talk to:** Perplexity search-infra engineers.\n**Source:** [InfoQ](https://www.infoq.com/news/2026/09/cobbledb-perplexity/) · [The New Stack](https://thenewstack.io/perplexity-cobbledb-ai-database/)\n\n## 5. Deep-search agents are drowning in their own context\n**Angle:** Architecture\n**Hook:** More than 59% of ReAct runs on BrowseComp never finish inside 64K tokens. Should an agentic chat keep a summary as state instead of a transcript?\n- Planner/Synthesizer split; zero-shot gains on frontier models.\n- Fewer search rounds (7–8 vs 12+) means lower retrieval load.\n- Ties into the agent-memory repos trending on GitHub (hindsight, mem0).\n**Who to talk to:** the IterSynth authors, or a team running deep research in production.\n**Source:** [HF papers](https://huggingface.co/papers/2609.29444)\n\n## 6. Stateless MCP: idempotency is now your problem\n**Angle:** Architecture\n**Hook:** Sticky sessions are gone, and so is stream resumability. Every tool call with side effects needs a retry story.\n- Mcp-Method/Mcp-Name headers enable gateway routing and throttling; W3C tracing is built in.\n- Run dual-protocol support until legacy clients are gone.\n**Who to talk to:** the AWS Architecture Blog authors or an MCP gateway maintainer.\n**Source:** [InfoQ](https://www.infoq.com/news/2026/09/aws-stateless-mcp/)\n"}, "WEEK": "2026-10-05"};
const DIGEST = BUNDLE.DIGEST, DOCS = BUNDLE.DOCS;
const VIEWS = [
  { key: "morning",   label: "◉ Morning Brief",    type: "md",   doc: "morning" },
  { key: "retrieval", label: "⌕ Retrieval Desk",   type: "desk", tag: "retrieval" },
  { key: "agents",    label: "⛓ Agents in Prod",   type: "desk", tag: "agents" },
  { key: "warstory",  label: "⚠ War Stories",      type: "desk", tag: "warstory" },
  { key: "strategy",  label: "↗ Strategy Signals", type: "md",   doc: "strategy" },
  { key: "playbook",  label: "⚙ Playbook",         type: "md",   doc: "playbook" },
  { key: "podcast",   label: "◇ Story Desk",       type: "md",   doc: "podcast" },
];
const SRC_LABEL = { arxiv: "arXiv", blogs: "Blog", github: "GitHub", hackernews: "HN" };
let tab = "morning";
const esc = s => (s || "").replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function itemsByTag(tag) {
  const src = DIGEST.sources || {}; const out = [];
  for (const k of Object.keys(src)) for (const it of (src[k] || [])) if ((it.tags || []).includes(tag)) out.push({ it, src: k });
  return out;
}
function tabButton(v, count) {
  const div = document.createElement("div");
  div.className = "tab" + (v.key === tab ? " active" : "");
  div.innerHTML = v.label + (count != null ? ` <span class="count">${count}</span>` : "");
  div.onclick = () => { tab = v.key; renderTabs(); renderItems(); };
  return div;
}
function renderTabs() {
  const el = document.getElementById("tabs"); el.innerHTML = "";
  for (const v of VIEWS) {
    if (v.type === "desk") { const c = itemsByTag(v.tag).length; if (!c) continue; el.appendChild(tabButton(v, c)); }
    else el.appendChild(tabButton(v, null));
  }
}
function mdToHtml(md) {
  const lines = (md || "").replace(/\r/g, "").split("\n"); let html = "", inList = false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*(.+?)\*/g, "<em>$1</em>");
  const cl = () => { if (inList) { html += "</ul>"; inList = false; } };
  for (const raw of lines) { const line = raw.trimEnd();
    if (/^#{1,6}\s/.test(line)) { cl(); const lvl = line.match(/^#+/)[0].length; html += `<h${lvl} class="md-h">${inline(line.replace(/^#+\s/, ""))}</h${lvl}>`; }
    else if (/^---+$/.test(line)) { cl(); html += "<hr>"; }
    else if (/^[-*]\s/.test(line)) { if (!inList) { html += '<ul class="md-ul">'; inList = true; } html += `<li>${inline(line.replace(/^[-*]\s/, ""))}</li>`; }
    else if (line === "") { cl(); } else { cl(); html += `<p class="md-p">${inline(line)}</p>`; } }
  cl(); return html;
}
function badge(t) { return `<span class="badge">${esc(String(t))}</span>`; }
function deskCard(it, srcKey) {
  const title = `<a class="title" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`;
  let meta = [`<span class="badge src">${esc(SRC_LABEL[srcKey] || srcKey)}</span>`];
  if (srcKey === "arxiv")  meta.push(badge(it.authors || "—"), badge(it.published));
  if (srcKey === "blogs")  meta.push(badge(it.blog || "blog"), badge(it.published || ""));
  if (srcKey === "github") meta.push(badge("★ " + (it.stars ?? 0)), badge(it.language || "—"));
  let extra = "";
  if (srcKey === "hackernews") {
    meta.push(badge((it.comments ?? 0) + " comments"), `<a class="badge" href="${esc(it.hn_url)}" target="_blank" rel="noopener">HN thread</a>`);
    if (it.discussion_summary) {
      const quotes = (it.top_comments || []).map(c => `<div class="quote">“${esc(c.text)}”<span class="who"> — ${esc(c.author)}</span></div>`).join("");
      extra = `<div class="disc"><div class="disc-h">💬 What people are saying</div><div class="disc-body">${esc(it.discussion_summary)}</div>${quotes}</div>`;
    }
  }
  const summary = it.summary ? `<div class="summary">${esc(it.summary)}</div>` : "";
  return `<div class="card">${title}${summary}${extra}<div class="meta">${meta.join("")}</div></div>`;
}
function renderItems() {
  const root = document.getElementById("content");
  const view = VIEWS.find(v => v.key === tab) || VIEWS[0];
  if (view.type === "md") {
    const md = DOCS[view.doc];
    root.innerHTML = md ? `<div class="brief">${mdToHtml(md)}</div>` : `<div class="empty">Not in this edition.</div>`;
    return;
  }
  const rows = itemsByTag(view.tag);
  root.innerHTML = rows.length ? rows.map(r => deskCard(r.it, r.src)).join("") : `<div class="empty">No items on this desk this week.</div>`;
}
document.getElementById("weeklabel").textContent = BUNDLE.WEEK ? "Week of " + BUNDLE.WEEK : "";
renderTabs(); renderItems();
</script>
</body>
