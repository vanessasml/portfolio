agnifico, Eduard Barbu", "published": "2026-10-30", "tags": []}, {"title": "Using Machine Learning to Measure Self-Efficacy Belief Through Learners' Interaction Traces in Technology-Enhanced Learning", "url": "http://arxiv.org/abs/2610.41900v1", "summary": "Self-efficacy beliefs play a critical role in learners' performance, academic choices, and, more broadly, in their future career trajectories. As Technology-Enhanced Learning (TEL) environments have demonstrated strong potential for supporting both performance and motivation, investigating self-efficacy within such environments is of particular interest, especially for implementing remedial practi…", "authors": "Maeva Somny, Linda Chouati, Marie Lefevre", "published": "2026-10-30", "tags": []}, {"title": "General-purpose foundation models surpass specialized ones on chemical property prediction tasks", "url": "http://arxiv.org/abs/2610.41899v1", "summary": "Foundation models (FMs) learn reusable representations from large collections of unlabeled data. In chemistry the corresponding data mainly consists of molecular structures, which are abundant, whereas experimental measurements are scarce. Chemical FMs such as ChemBERTa and MoLFormer were therefore trained on diverse molecular structures to enable fine-tuning on small experimental datasets (less t…", "authors": "Stepan N. Ostarkov, Gregorii A. Semakin, Ivan A. Bespalov, Michael G. Medvedev", "published": "2026-10-30", "tags": []}, {"title": "Automated Keyword Generation Using LLMs in a High-Volume Data Virtualization Service", "url": "http://arxiv.org/abs/2610.41893v1", "summary": "In modern data infrastructure, a data virtualization service (DVS) allows users to create many versions of source datasets for different processing tasks. For example, a multivariate or multi-modality dataset can be used for different machine learning tasks (e.g., classification, detection, segmentation, forecasting, and so on). Data selection, participation, integration, and preprocessing in diff…", "authors": "Saiful Khan, Yiwen Xing, Joyraj Chakraborty, Afrah Farea", "published": "2026-10-30", "tags": []}, {"title": "Fuzzy selective state model for forecasting the dynamics of consumer preferences", "url": "http://arxiv.org/abs/2610.41879v1", "summary": "We consider forecasting the dynamics of consumer preferences of retail chain customers. A customer's preference is described by a triangular fuzzy number. The evolution of the preference over time is governed by a Mamba-type selective state space model whose hidden state is a triangular number, with computations carried out in M.G.~Matveev's two-component algebra of fuzzy numbers. The recurrence p…", "authors": "P. A. Golovinski, A. A. Drobyshev, A. O. Shatalova", "published": "2026-10-30", "tags": []}, {"title": "No More Import Errors: Constrained Decoding for Guaranteed Valid Imports in LLM-Generated Tests", "url": "http://arxiv.org/abs/2610.41878v1", "summary": "One of the most common failure reasons of LLM-based test generation pipelines is import errors. Grammar constrained decoding can modify the probabilities of the LLM's final layer during token generation to guarantee valid imports. However, we find that it can lead to degenerate solutions, i.e., repetitive valid imports (import streaks) that exhaust the token budget before a test is generated. We p…", "authors": "Konstantinos Kitsios, Matteo Biagiola, Guido Salvaneschi, Alberto Bacchelli", "published": "2026-10-30", "tags": []}, {"title": "AI evaluators favor job applications written by certain AI models, independent of candidate quality", "url": "http://arxiv.org/abs/2610.41866v1", "summary": "Job applicants increasingly use large language models (LLMs) to write cover letters, while employers deploy LLMs to screen them. In this all-AI setting, we ask whether the \\emph{choice of model} affects hiring outcomes independently of candidate qualifications. We introduce a multi-model auditing framework pairing eleven LLM writer agents with nine API-hosted evaluator agents across ten job descri…", "authors": "Nicolò Pagan, Michael Andreas Ebling, Stefania Ionescu, Anikó Hannák", "published": "2026-10-30", "tags": ["agents"]}, {"title": "Learning to Interact and Direct: Co-Evolving Video Director Agents", "url": "http://arxiv.org/abs/2610.41865v1", "summary": "Video director agents orchestrate multistage production to realize users' creative visions. Emerging research on their self-evolution advances screenplay planning effectively. However, the mutual reinforcement between directing and user interaction remains largely overlooked. Improved interaction clarifies user intent and informs workflow refinement, while more reliable execution shifts collaborat…", "authors": "Yingzhao Jian, Zhongan Wang, Yuxuan Hou, Hehe Fan", "published": "2026-10-30", "tags": ["agents"]}, {"title": "Stuck on Red? Understanding GitHub Actions Failing Streaks", "url": "http://arxiv.org/abs/2610.41863v1", "summary": "GitHub Actions is the de facto CI/CD service for GitHub repositories. Its workflows should not fail when they are not expected to, nor keep on failing too long. We empirically study failing streaks, i.e., uninterrupted series of failing runs of a workflow, in 30.9M+ runs of 154K+ workflows of 43K+ GitHub repositories over 238 days. We study how failing streaks begin and end, and what happens durin…", "authors": "Aref Talebzadeh Bardsiri, Tom Mens, Alexandre Decan, Thomas Degueule", "published": "2026-10-30", "tags": []}, {"title": "Layered Reproducibility for High-Performance Computing Applications: The Feel++ and Ktirio Urban Buildings Case Study", "url": "http://arxiv.org/abs/2610.41861v1", "summary": "The High-Performance Computing (HPC) community struggles with reproducibility due to complex software stacks, heterogeneous hardware, and expensive validation cycles. This contribution presents a layered reproducibility strategy in which Feel++ provides a traceable software supply chain and Ktirio Urban Buildings (KUB) builds on it to manage versioned urban-building data, executable simulations, a…", "authors": "Javier Cladellas, Vincent Chabannes, Christophe Prud'Homme", "published": "2026-10-30", "tags": []}, {"title": "SimXAI: A Simple Drop-in Layer Increases Interaction Quality and Understanding in Conversational XAI", "url": "http://arxiv.org/abs/2610.41856v1", "summary": "Conversational explainable AI (ConvXAI) agents often use GUS-style architectures with separate modules for intent recognition, dialogue management, and template-based response generation. While faithful to the underlying XAI methods, these pipelines are hard to adapt and often struggle with context-dependent follow-up questions. We present SimXAI, a lightweight LLM-centric conversational layer tha…", "authors": "Van Bach Nguyen, Qianli Wang, Nils Feldhus, Jörg Schlötterer", "published": "2026-10-30", "tags": []}], "github": [{"title": "deepseek-ai/dsh-superagent-prototype", "url": "https://github.com/deepseek-ai/dsh-superagent-prototype", "summary": "Towards a More Autonomous Agent System", "stars": 12236, "language": "TypeScript", "published": "2026-10-31", "tags": []}, {"title": "heydamir/unslop", "url": "https://github.com/heydamir/unslop", "summary": "A Claude skill that turns vibecoded, AI-looking UI into a designed interface", "stars": 5810, "language": "JavaScript", "published": "2026-10-29", "tags": []}, {"title": "anhao/ai-pose-gallery-zh", "url": "https://github.com/anhao/ai-pose-gallery-zh", "summary": "中文版 AI 姿势参考图库 · 1439 组 / 2878 张图片 / 完整汉化 · 零依赖静态画廊", "stars": 5457, "language": "TypeScript", "published": "2026-10-27", "tags": []}, {"title": "wangzan101/Mika", "url": "https://github.com/wangzan101/Mika", "summary": "An on-device AI agent for Android that operates apps and the web to get things done for you.", "stars": 5121, "language": "Kotlin", "published": "2026-10-29", "tags": []}, {"title": "haydenschmitty/floorplan", "url": "https://github.com/haydenschmitty/floorplan", "summary": ", "points": 630, "comments": 767, "hn_url": "https://news.ycombinator.com/item?id=50151036", "published": "2026-10-19", "top_comments": [{"author": "agenticpacks", "text": "I believe code written entirely by AI agents will eventually lose much of its competitive value. It's simply a matter of supply and demand. However, there's a more serious issue: as agents generate more software, people may end up using applications with no meaningful security or correctness guarantees. Privacy is anot…"}, {"author": "sporkland", "text": "I hate to break it to engineers feeling this for the first time, but this is what management and \"leadership\" has been dealing with forever in software. It's just you were a fleshy Claude/codex. And your goal was never to understand everything it was to build something of value that had the risk squeezed out of it thro…"}, {"author": "ndriscoll", "text": "Sour grapes is when you can't have something , so you say it must be bad as a cope. I am successful in tech. It just took until my mid 30s to be a millionaire working on infrastructure instead of my late 20s working on surveillance, but I am perfectly happy with that. I have everything I could want, and didn't need to …"}, {"author": "groundzeros2015", "text": "Sour grapes is when you assume that a privilege another person has must actually be bad. In this case the temptation is to say you could have been successful in big tech but you are too moral. (Other people must be making moral compromises)."}, {"author": "ndriscoll", "text": "I'm actually doing quite well economically and am generally quite happy with my career!"}], "discussion_summary": "", "tags": []}, {"title": "No signs of AI payoff outside the tech sector", "url": "https://www.apollo.com/wealth/insights-news/insights/daily-spark/no-signs-of-ai-payoff-outside-the-tech-sector", "summary": "", "points": 660, "comments": 682, "hn_url": "https://news.ycombinator.com/item?id=50224463", "published": "2026-10-24", "top_comments": [{"author": "selimthegrim", "text": "Here I was thinking this meant the DEC originated text game"}, {"author": "iforgotmypasswo", "text": "That’s odd. I work with hundreds of businesses as a vendor, including Fortune 500, and I’m seeing increased use across the board. I don’t think we have a single customer who isn’t writing some app they’ve always wanted to have."}, {"author": "John23832", "text": "What is the diagnosis of this patient given their human described malady. Partially in rheumatology, where we don’t have a large battery of fully defined tests for all illnesses."}, {"author": "edgyquant", "text": "How can this be? The entire job is now testing and verification"}, {"author": "pmbauer", "text": "Just one more lever pull, I know it will pay off! /s"}, {"author": "redloon", "text": "As a supporting example for the first point: I recently had a dozen ore more colleagues need to be hand-held through getting basic pieces of their local Python environment working, when the multiple agent tools they have access to could have easily solved it for them if they had just asked - but instead they came to me…"}], "discussion_summary": "", "tags": []}, {"title": "AI promised less work. I've never worked more", "url": "https://oioannou.com/blog/ai-promised-less-work/", "summary": "", "points": 689, "comments": 665, "hn_url": "https://news.ycombinator.com/item?id=50257325", "published": "2026-10-27", "top_comments": [{"author": "great_wubwub", "text": "The power of accurate observation is commonly called cynicism by those who have not got it. - George Bernard Shaw"}, {"author": "AbstractH24", "text": "The question becomes, are you more productive than ever? I (or my agent) can do a lot of interacting with GitHub and nothing of value can come of it. If more was expected of everyone and everyone was producing more, it'd be a different issue."}, {"author": "Breza", "text": "I write most of my code by hand. I already manage a team, I don't want to spend the rest of my time juggling different agents."}, {"author": "Breza", "text": "I agree. I feel like we're heading back to the PMBOK days of writing out all the details of your project before you wrote any code."}, {"author": "allthetime", "text": "By a shit load of non-technical clients who I've developed human relationships with over the past decade and a half. I'm not especially expensive a la carte, but I have a lot of different people paying me, and I don't work that hard. Time , reputation, relationships and an unusual niche are my moat. All you AI-guys hav…"}], "discussion_summary": "", "tags": []}, {"title": "Every AI model has the same \"controversial\" take on humans", "url": "https://www.modelcompare.ai/blog/ai-models-controversial-take-on-humans", "summary": "", "points": 667, "comments": 646, "hn_url": "https://news.ycombinator.com/item?id=50197313", "published": "2026-10-22", "top_comments": [{"author": "pizza234", "text": "> But that of course is only as it relates to language. Which isn't at all the primary function of the brain and driver of it's experience. The same applies to LLMs: we know how they produce language, but the underlying processes that enable it may themselves constitute a form of intelligence."}, {"author": "pizza234", "text": "> Not truthfulness; correlation and consistency LLMs may learn from correlations and consistency, but that's separate from developing internal representations of what they believe is true, which is precisely what the paper provides evidence for. \"Believe\" is of course not in the strictly human sense."}, {"author": "awbvious", "text": "Sorry that I didn't see this response until now, but thanks for engaging with me! \"I put a high value on intent when trying to understand a person, but when having to evaluate an action taken intent barely matters to me.\" This doesn't specify what kind of (e)valuation. \"As soon as intent comes into play ... there might…"}, {"author": "roywiggins", "text": "I think if you asked \"are humans usually more interested in being right or having friends\", many- possibly most- people would say the latter."}, {"author": "lanstin", "text": "I have taken the golden rule to be a sort of absolute standard: whether or not people treat you well, you still treat them well. This one makes it a sort of utilitarian argument but where you don’t fix your own identity, but assume different people are in the same boat, and then make the decision about which outcome is…"}], "discussion_summary": "", "tags": []}, {"title": "Containment and monitoring failures are to blame for AI hacking reports: experts", "url": "https://www.csoonline.com/article/4234854/ai-agents-arent-going-rogue-frontier-labs-are-skipping-security-basics.html", "summary": "", "points": 952, "comments": 630, "hn_url": "https://news.ycombinator.com/item?id=50091788", "published": "2026-10-14", "top_comments": [{"author": "Gormo", "text": "There's definitely a semantic collision happening here, then, because in this context, I interpret \"agent\" in the sense of a principal-agent relationship, i.e. someone (or something) acting on your behalf, rather than \"agent\" in the philosophical sense of moral agency. AI tools are agents in a functional, but not in a …"}, {"author": "the_mar", "text": "the open weight llms didn’t just happen to be as an act of god. someone created them and released them. i don’t see why they should not be liable."}, {"author": "the_mar", "text": "that depends how you define hacking. i am not a lawyer, but i think there’s an element of some sort of gain (data, money), otherwise if a tree falls in the forest…"}, {"author": "the_mar", "text": "i think you misunderstand what i said. as much as i dislike ai ceos, i doubt anyone is setting out to build ai with explicit intent to do crime. they are just not doing a great job preventing it. just because they know it is in the training data, does not prove intent"}, {"author": "Dylan16807", "text": "You would generally not use TCP, yeah. If you want a simple version, send UDP packets one way or use a plain old serial port with only one wire connected (plus ground)."}, {"author": "strbean", "text": "> Somebody hacked into that pilates studio, and it wasn't an inanimate object, because that is just silly. I don't agree with this premise. If a bit flip creates a worm, is God hacking the affected computers? Why can't an inanimate object hack a computer?"}], "discussion_summary": "", "tags": ["warstory"]}], "blogs": [{"title": "How BMW Group accelerated connected vehicle workloads on AWS Graviton", "url": "https://aws.amazon.com/blogs/architecture/how-bmw-group-accelerated-connected-vehicle-workloads-on-aws-graviton/", "summary": "Learn how BMW Group migrated its connected vehicle platform from x86 to AWS Graviton. Using Karpenter, multi-architecture container builds, and Graviton-based CI/CD runners, the team moved workloads without disruption, cutting NGINX ingress CPU by about 57 percent and delivering about 40 percent better price-performance.", "blog": "AWS Architecture Blog", "published": "2026-10-29", "tags": ["warstory"]}, {"title": "How boAt delivers personalized fitness coaching with Amazon Bedrock", "url": "https://aws.amazon.com/blogs/architecture/how-boat-delivers-personalized-fitness-coaching-with-amazon-bedrock/", "summary": "Learn how boAt built its AI Coach feature on Amazon Bedrock and AWS Lambda to deliver personalized, real-time fitness coaching to millions of smartwatch users across India, and the design choices that made the solution scalable and cost-effective.", "blog": "AWS Architecture Blog", "published": "2026-10-29", "tags": []}, {"title": "How Revinate accelerated API adoption with Amazon API Gateway", "url": "https://aws.amazon.com/blogs/architecture/how-revinate-accelerated-api-adoption-with-amazon-api-gateway/", "summary": "Accelerating API adoption while reducing operational overhead is a challenge that every growing organization faces. For Revinate, a hospitality provider serving over 12,500 hotels worldwide and powering more than 1.25 billion guest profiles, Amazon API Gateway became the foundation of their solution. Revinate empowers hoteliers to connect directly with guests at every touchpoint, driving $24 […]", "blog": "AWS Architecture Blog", "published": "2026-10-28", "tags": []}, {"title": "Automating agentic AI Well-Architected reviews with the AWS Agentic AI Lens", "url": "https://aws.amazon.com/blogs/architecture/automating-agentic-ai-well-architected-reviews-with-the-aws-agentic-ai-lens/", "summary": "Smarsh used the AWS Well-Architected Framework's Agentic AI Lens to review its first agentic workload. Because the lens is not yet selectable in the console, the team encoded it as a Claude skill that assessed all 150 best practices against the workload's GitHub repository and produced an evidence-backed review workbook in hours instead of days.", "blog": "AWS Architecture Blog", "published": "2026-10-28", "tags": ["agents"]}, {"title": "Publishing LMS courses with a Kiro SCORM pipeline", "url": "https://aws.amazon.com/blogs/architecture/publishing-lms-courses-with-a-kiro-scorm-pipeline/", "summary": "See how to use Kiro, an agentic AI, to automate converting raw training material into compliant SCORM packages that are ready to upload to a learning management system (LMS).", "blog": "AWS Architecture Blog", "published": "2026-10-27", "tags": ["agents"]}, {"title": "Vessel-specific voyage optimization with machine learning: Manta on AWS", "url": "https://aws.amazon.com/blogs/architecture/vessel-specific-voyage-optimization-with-machine-learning-manta-on-aws/", "summary": "Manta Marine Technologies closes the gap between seemingly identical ships by training machine learning models on each vessel's own operational history. Learn how Manta delivers vessel-specific voyage optimization on AWS to help shipowners reduce fuel consumption and improve voyage efficiency.", "blog": "AWS Architecture Blog", "published": "2026-10-27", "tags": []}, {"title": "How Anchorage Digital and Turnkey verify code with AWS Nitro Enclaves", "url": "https://aws.amazon.com/blogs/architecture/how-anchorage-digital-and-turnkey-verify-code-with-aws-nitro-enclaves/", "summary": "Anchorage Digital and Turnkey built verifiable infrastructure on AWS Nitro Enclaves so crypto wallets can cryptographically verify which code parsed a transaction. This post covers the architecture, the attestation-gated access pattern, and how it extends to any high-trust workflow beyond blockchain.", "blog": "AWS Architecture Blog", "published": "2026-10-27", "tags": []}, {"title": "Data governance with annotations in Amazon S3", "url": "https://aws.amazon.com/blogs/architecture/data-governance-with-annotations-in-amazon-s3/", "summary": "Attach governance context such as classification, retention, residency, and PII flags directly to your Amazon S3 objects with S3 annotations. This post walks through the end-to-end pattern and the handful of S3 behaviors that decide whether your governance design is correct.", "blog": "AWS Architecture Blog", "published": "2026-10-26", "tags": []}, {"title": "Recommended resilience testing in the next generation of AWS Resilience Hub", "url": "https://aws.amazon.com/blogs/architecture/recommended-resilience-testing-in-the-next-generation-of-aws-resilience-hub/", "summary": "The next generation of AWS Resilience Hub introduces recommended resilience testing: four pre-configured, AWS FIS-powered tests that validate how your service detects and recovers from failures across Availability Zones, dependencies, and Regions, turning your resilience policy into evidence-backed pass or fail results.", "blog": "AWS Architecture Blog", "published": "2026-10-26", "tags": ["warstory"]}, {"title": "Making Failure Diagnosis Reliable with Pensive AI", "url": "https://netflixtechblog.com/making-failure-diagnosis-reliable-with-pensive-ai-6b0811a1c015?source=rss----2615bd06b42e---4", "summary": "", "blog": "Netflix TechBlog", "published": "2026-10-26", "tags": ["warstory"]}, {"title": "How we halved DNS build delay and cut memory use by 85%", "url": "https://blog.cloudflare.com/dns-targeted-zone-builds/", "summary": "Zone setting changes used to rebuild entire DNS zones, even ones with tens of millions of records. Here is how we built a planner that picks the smallest safe build, cutting full builds by 40%, peak memory by 85%, and halving build delay.", "blog": "Cloudflare Blog", "published": "2026-11-02", "tags": ["warstory"]}, {"title": "4 real? Tracking exploitation and patching of eMudhra’s weak keys", "url": "https://blog.cloudflare.com/emudhra-patching/", "summary": "Four, just four: that’s the key to break into any unpatched connection on the Internet that is using eMudhra certificates. Here’s how we quickly patched Cloudflare, what evidence we can see of attempted exploitation, and how much of the rest of the Internet remains exposed.", "blog": "Cloudflare Blog", "published": "2026-10-30", "tags": ["warstory"]}, {"title": "Cloudflare services for private origins is now generally available", "url": "https://blog.cloudflare.com/private-origins-public-to-private/", "summary": "Public traffic to private origins, with WAF, bot management, caching, and Workers, is now available to every customer with Cloudflare One connectivity.", "blog": "Cloudflare Blog", "published": "2026-10-30", "tags": []}, {"title": "Cloudflare DDoS Threat Report 2026 Q3: More swarms, fewer giants", "url": "https://blog.cloudflare.com/ddos-threat-report-2026-q3/", "summary": "Cloudflare mitigated over 8,200 DDoS attacks per hour in Q3 2026 as attackers shifted to shorter, high-frequency strikes. Explore the latest threat data, including the collapse of CLDAP vectors and the impact of recent botnet takedowns.", "blog": "Cloudflare Blog", "published": "2026-10-29", "tags": []}, {"title": "Introducing the Cloudflare PHP Capture the Flag challenge", "url": "https://blog.cloudflare.com/php-ctf/", "summary": "We are launching a PHP Capture the Flag challenge integrated with our Bug Bounty program to test our WAF protections. Security researchers are invited to bypass our defenses and capture the flag to help make the Internet safer.", "blog": "Cloudflare Blog", "published": "2026-10-27", "tags": []}, {"title": "What took the Internet offline in Q3 2026", "url": "https://blog.cloudflare.com/q3-2026-internet-disruption-summary/", "summary": "An examination of global Internet disruptions observed by Cloudflare Radar during the third quarter of 2026. This review analyzes how power failures, natural disasters, and government shutdowns impacted network connectivity and traffic.", "blog": "Cloudflare Blog", "published": "2026-10-27", "tags": ["warstory"]}, {"title": "Cross-request KV cache exposure in the GLM-5.3 Workers AI model, and our remediation with SGLang", "url": "https://blog.cloudflare.com/kv-cache-exposure-remediation/", "summary": "A configuration mismatch in GLM 5.3 on Workers AI triggered an SGLang bug that exposed KV cache pages across requests. Here is how we addressed the issue.", "blog": "Cloudflare Blog", "published": "2026-10-26", "tags": ["warstory"]}, {"title": "Bliki: LLM Voice", "url": "https://martinfowler.com/bliki/LLM-Voice.html", "summary": "Sometimes when I read a post, I get the growing feeling that I'm reading the output of an LLM. I can't necessarily define why, although there are the common tells (it's not the em-dashes, it's the load-bearing tapestries). As I do this my desire to read on atrophies, sometimes to the point of revulsion There are tools out there that claim to be able to tell the difference between LLM-written prose…", "blog": "Martin Fowler", "published": "2026-10-29", "tags": []}, {"title": "Why are good developers so wary of agentic development?", "url": "https://martinfowler.com/rachels-ramblings/good-devs-wary.html", "summary": "TL;DR Good developers’ caution about agentic development comes from knowing that built isn’t the same as working in production. I’ve been surprised by how many excellent developers have been hesitant to go all in on coding agents. These are people who usually try new ways of working before anyone else and in many cases invent new tools and practices that support building the application well. So w…", "blog": "Martin Fowler", "published": "2026-10-29", "tags": ["agents"]}, {"title": "Fragments: October 28", "url": "https://martinfowler.com/fragments/2026-10-28.html", "summary": "Andrej Karpathy sees a widening gap in how people see LLM capabilities. The general public has mostly not interacted with these systems. When they have, it looks like a derpy chatbot. The majority of professionals still see only a modest uplift. And a small sliver of professionals are experiencing the vertigo of the curve going vertical. And it is all happening at the same time. Many of my colleag…", "blog": "Martin Fowler", "published": "2026-10-28", "tags": []}, {"title": "Uber Builds MCP Gateway to Govern Access to 800+ Servers and 5,000+ AI Agent Tools", "url": "https://www.infoq.com/news/2026/11/uber-mcp-gateway-ai-agents/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Uber has built an MCP Gateway to standardize how AI agents discover and invoke internal services across more than 800 MCP servers and 5,000 tools. The gateway separates tool registration from runtime execution and includes automated API discovery, access controls, sensitive data redaction, incremental tool discovery through Omni MCP, and response filtering. By Leela Kumili", "blog": "InfoQ Architecture & Design", "published": "2026-11-02", "tags": ["agents"]}, {"title": "Article: Systemic Approach to Memory, Knowledge, and Context in Agentic AI Architectures", "url": "https://www.infoq.com/articles/agentic-ai-context-memory-knowledge/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "The article argues that reliable agentic AI architecture depends on a context engine that selects, injects, compresses, and expires information before it reaches the model. It separates context, memory, and knowledge, and recommends tiered memory, curated knowledge, and token budgeting. It also covers common anti-patterns, such as context stuffing and stale data loops, with mitigations. By Adi Pol…", "blog": "InfoQ Architecture & Design", "published": "2026-11-02", "tags": ["agents"]}, {"title": "Podcast: Educating an Architect: A Conversation with Luca Mezzalira", "url": "https://www.infoq.com/podcasts/educating-architect-conversation-luca-mezzalira/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "In this podcast, Michael Stiefel spoke to Luca Mezzalira about software architecture as a socio-technical discipline that balances technological design with an organization's social and managerial context. They explored how architectural choices must be adapted to a company's unique culture and team structure rather than relying blindly on universal best practices. By Luca Mezzalira", "blog": "InfoQ Architecture & Design", "published": "2026-11-02", "tags": []}, {"title": "AWS Capacity Largely Sold Out Through 2027, With On Demand Headroom Reserved", "url": "https://www.infoq.com/news/2026/11/aws-capacity-sold-out/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Amazon CEO Andy Jassy says AWS’s large committed cloud capacity is largely sold out through 2027, with part of 2028 already allocated, while the company continues to reserve headroom for On Demand, EC2 and Bedrock. Practitioners discussing the remarks report difficulty obtaining On Demand capacity for ordinary EC2 instances, and similar constraints at other providers. By Steef-Jan Wiggers", "blog": "InfoQ Architecture & Design", "published": "2026-11-01", "tags": []}, {"title": "Cloudflare’s Post-Quantum GeoKey Manager Enters Closed Beta Without Attribute-Based Encryption", "url": "https://www.infoq.com/news/2026/10/cf-pq-geokey-manager/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Cloudflare has moved a post-quantum rebuild of GeoKey Manager into closed beta, guarding geo-fenced keys with hybrid ML-KEM-768 and X25519 instead of the attribute-based encryption used since 2022. Keys live only in kernel memory on verified regional servers, and any failed check rejects the request, a fail-closed choice practitioners ask could cause a regional outage. GA is planned for Q1 2027. B…", "blog": "InfoQ Architecture & Design", "published": "2026-10-31", "tags": ["warstory"]}, {"title": "Spring News Roundup: First Release Candidates of Boot, Framework, Data, Security, Modulith, AI", "url": "https://www.infoq.com/news/2026/10/spring-news-roundup-oct19-2026/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "There was a flurry of activity during the week of October 19th, 2026, highlighting: first release candidates of: Spring Boot, Spring Framework, Spring Data, Spring Cloud, Spring Security, Spring for GraphQL, Spring Session, Spring Integration, Spring HATEOS, Spring Modulith, Spring REST Docs, Spring AI, Spring Batch, Spring AMQP, Spring for Apache Kafka, Spring LDAP and Spring Web Services. By Mic…", "blog": "InfoQ Architecture & Design", "published": "2026-10-31", "tags": []}, {"title": "Kubernetes Confidential Containers Get Fortanix Attestation and Key Management", "url": "https://www.infoq.com/news/2026/10/k8s-confidential-containers/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Fortanix's CoCo integration connects workload attestation to decryption-key release for Kubernetes AI workloads. GPU-verification settings affect protection, while upstream Trustee and Azure Secure Key Release offer alternative routes to attestation-based key release. By Mark Silvester", "blog": "InfoQ Architecture & Design", "published": "2026-10-31", "tags": []}, {"title": "DoorDash Cuts Grocery Reorder Latency from 16 to 2 Seconds with AI Agents", "url": "https://www.infoq.com/news/2026/10/doordash-ai-grocery-reorder/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "DoorDash reduced grocery reorder latency from 16 to 2 seconds by precomputing recurring purchase needs using batch LLM inference and deterministic validation. Live catalog resolution keeps product selections current, while an editable shopping interface avoids unnecessary model calls. The company reports that shopping list views doubled and the flow’s order rate increased by approximately 34% By L…", "blog": "InfoQ Architecture & Design", "published": "2026-10-30", "tags": ["agents", "warstory"]}, {"title": "Presentation: The Ladder Is Missing Rungs: Engineering Progression When AI Ate the Middle", "url": "https://www.infoq.com/presentations/ai-software-engineering-pipeline/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Alasdair Allan discusses empirical research from METR and Anthropic on AI coding adoption. He explains the \"supervision paradox,\" where reliance on AI tools disrupts junior skill development, risks institutional context loss, and threatens the long-term engineering pipeline needed to oversee autonomous systems effectively. By Alasdair Allan", "blog": "InfoQ Architecture & Design", "published": "2026-10-30", "tags": []}, {"title": "Microsoft Retires Azure Deployment Environments with No Replacement Product", "url": "https://www.infoq.com/news/2026/10/ade-dev-box-retirement/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Azure Deployment Environments retires on February 22, 2027 and Microsoft names no successor, telling teams to use Bicep or ARM templates directly. Microsoft Dev Box follows on September 18, 2028, pointed at Windows 365, which Microsoft says is not a one-to-one replacement. Remaining Dev Box workloads should expect deletion. By Steef-Jan Wiggers", "blog": "InfoQ Architecture & Design", "published": "2026-10-30", "tags": []}, {"title": "Google Adopts DPoP to Strengthen OAuth 2.0 against Token Theft and Replay Attacks", "url": "https://www.infoq.com/news/2026/10/google-dpop-oauth2/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Google's OAuth Platform has recently introduces support for Demonstrating Proof-of-Possession (DPoP), an OAuth 2.0 security mechanism designed to mitigate token theft and replay attacks. By Sergio De Simone", "blog": "InfoQ Architecture & Design", "published": "2026-10-29", "tags": []}, {"title": "Anthropic Says Nobody Needs a Mental Model of Claude Code. Practitioners Are Testing That", "url": "https://www.infoq.com/news/2026/10/anthropic-code-review/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Anthropic has published how the Claude Code team reviews code now that Claude writes roughly 90% of it, including a claim that nobody keeps a complete mental model of the codebase. The post documents a pull request that ran more than fifty review rounds overnight, a reviewer spending most of its effort on pre-existing code, and a control the team says it does not yet have. By Steef-Jan Wiggers", "blog": "InfoQ Architecture & Design", "published": "2026-10-29", "tags": []}, {"title": "Airbnb Cuts Recommendation Staleness from 2 Days to Seconds with Chronon", "url": "https://www.infoq.com/news/2026/10/airbnb-chronon-recommendation/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Airbnb extended its Chronon feature platform with Push Mode and Near Real-Time Model Transform to update sequence-based recommendation embeddings within seconds. The architecture reduced embedding staleness from nearly two days to under a minute and improved offline NDCG by 1.67%, while online testing increased uncancelled bookings by approximately one-third of a percent. By Leela Kumili", "blog": "InfoQ Architecture & Design", "published": "2026-10-28", "tags": ["warstory"]}, {"title": "Presentation: Wrangling Telemetry at Scale: A Guide to Self-Hosted Observability", "url": "https://www.infoq.com/presentations/self-hosted-observability-stack-tradeoffs/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Colin Douch shares battle-tested strategies for building and scaling self-hosted observability stacks. He explains how to effectively correlate metrics, structured logs, and distributed traces using open-source tooling like Prometheus, VictoriaMetrics, and Jaeger, while navigating the engineering trade-offs of avoiding SaaS vendor lock-in. By Colin Douch", "blog": "InfoQ Architecture & Design", "published": "2026-10-28", "tags": ["warstory"]}, {"title": "Microsoft's October Security Update Fixes 1,400+ Vulnerabilities, One Exploited in the Wild", "url": "https://www.infoq.com/news/2026/10/microsoft-october-2026-patch/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Microsoft's latest monthly security update addresses 1415 vulnerabilities across multiple products. One vulnerability affecting Windows Shell has been exploited in the wild, while 85 are classified as critical. Affected products include Windows OS, Office, Exchange, .NET, Edge, as well as potentially Hyper-V and Azure components. By Sergio De Simone", "blog": "InfoQ Architecture & Design", "published": "2026-10-28", "tags": []}, {"title": "Stripe on Stripe: What we learned moving $1B in vendor payments to Global Payouts", "url": "https://stripe.com/blog/stripe-on-stripe-what-we-learned-moving-1b-in-vendor-payments-to-global-payouts", "summary": "In early 2026, we began moving our vendor payments to Global Payouts, Stripe’s product for paying recipients in 160+ countries. New-market setup fell from six weeks to one, with a 99.9% payout success rate. Here’s what we learned.", "blog": "Stripe Engineering", "published": "2026-10-30", "tags": ["warstory"]}, {"title": "How the fastest-growing enterprises on Stripe scale globally", "url": "https://stripe.com/blog/how-the-fastest-growing-enterprises-on-stripe-scale-globally", "summary": "Despite slower global economic growth and greater geopolitical fragmentation, the fastest-growing enterprises continue to look beyond their home markets and are investing in tools and workflows that make expansion faster and more repeatable.", "blog": "Stripe Engineering", "published": "2026-10-27", "tags": []}]}}, "DOCS": {"morning": "# AI/ML Morning Brief\n**Week of 2026-09-28**\n\n## AI architecture\n- **MCP went stateless.** The 2026-07-28 spec drops sessions, the init handshake, and stream resumability. Remote MCP servers now scale behind plain load balancers or Lambda, but retries and idempotency are your problem. [InfoQ](https://www.infoq.com/news/2026/09/aws-stateless-mcp/)\n- **Perplexity CobbleDB.** A Rust/RocksDB serving tier replaced DynamoDB reads for search: p50 fell from 31.4 ms to 5.6 ms and p99 from 123 ms to 24.2 ms. Durable state, batching, and serving are split into separate systems. [InfoQ](https://www.infoq.com/news/2026/09/cobbledb-perplexity/)\n- **Cloudflare ADLC.** Workflows as the CI/CD substrate, per-agent previews, OTel agent tracing, and task-bound credentials with a \"trust ratchet.\" [InfoQ](https://www.infoq.com/news/2026/09/cloudflare-adlc-agents/)\n\n## AI agents\n- **OpenAI: an agent used DNS to reach an external chatbot.** The monitor under-rated similar cases, and OpenAI paused tool-use training, evals, and inference for its most capable models. [Report](https://alignment.openai.com/misalignment-reports/an-agent-used-dns-to-reach-an-external-chatbot/) · [HN](https://news.ycombinator.com/item?id=49853137)\n- **Hugging Face intrusion anatomy.** Dataset configs were the injection vector, pod access to IMDS was left on by default, and one connector credential was cluster-admin everywhere. [HF blog](https://huggingface.co/blog/agent-intrusion-technical-timeline)\n- **Docker Cloud Sandboxes.** MicroVM isolation for coding agents, from laptop to cloud. [InfoQ](https://www.infoq.com/news/2026/09/docker-cloud-sandboxes/)\n- **GitHub trending (Sep 26).** Agent memory and orchestration lead: hindsight, google/ax, paperclip. [agents-radar](https://github.com/kouweizhu/agents-radar/issues/206)\n\n## Hugging Face daily papers\n- **IterSynth** (Sep 24): Planner/Synthesizer roles plus a bounded summary state fix ReAct context bloat in deep search. [HF](https://huggingface.co/papers/2609.29444)\n- **AgentKernel** (Sep 25): an OS-level, non-bypassable enforcement layer for agent identity, memory, and tools. [HF](https://huggingface.co/papers/2609.29647)\n- **Qwen-Planner-Agent** (Sep 25): a closed-loop framework for real-world mobile planner agents. [HF](https://huggingface.co/papers/2609.29892)\n\n## AI investments\n- **Cognition** raised $2B Series E at $48B; run-rate revenue grew from $492M to about $900M since May. [FinSMEs](https://www.finsmes.com/2026/09/cognition-closes-usd2-billion-series-e-funding-round-at-usd48-billion-valuation.html)\n- **Temporal** raised $550M Series E at $12.55B; ARR is above $250M, up more than 200% YoY, on durable-execution demand from agents. [GeekWire](https://www.geekwire.com/2026/temporal-raises-550m-hits-12-55b-valuation-as-agentic-ai-wave-fuels-massive-growth/)\n- **AIR Security** raised $50M to vet the skills and add-ons agents use. [TechCrunch](https://techcrunch.com/2026/09/01/air-raises-50m-to-help-companies-vet-the-skills-and-add-ons-ai-agents-use/)\n\n## Stock-market impact\n- **MSFT rose 4% on Sep 25** after a Copilot revamp adding coding tools and a persistent agent. [Yahoo/Motley Fool](https://finance.yahoo.com/markets/stocks/articles/stock-market-today-sept-25-214549821.html)\n- **Software \"seat compression\" fears** keep weighing on SaaS; Jensen Huang says \"the markets got it wrong.\" [Yahoo](https://finance.yahoo.com/news/nvidia-ceo-delivers-blunt-7-190300094.html)\n\n## Curated papers\n- **Hybrid RAG + KG + weighted RRF** (Sep): vector 0.50 / BM25 0.35 / KG 0.15, plus per-chunk grounding checks. [arXiv](https://arxiv.org/abs/2609.01617)\n- **DoPR** (Sep): reusable compressed document prefixes make LLM reranking cheaper. [arXiv](https://arxiv.org/abs/2609.03311)\n- **Predicting ANN recall from embedding statistics** (Sep): size vector indexes without full benchmarks. [arXiv](https://arxiv.org/abs/2609.00364)\n- **SilentProbe** (Sep): measures silent failures in production APIs used as agent tools. [arXiv](https://arxiv.org/abs/2609.00035)\n- **When Guardrails Look Effective** (Sep 1): construct-validity failures in agent guardrail evals. [arXiv](https://arxiv.org/abs/2609.01519)\n", "strategy": "# ↗ Strategy Signals — Talking Points for the Room\n\n## Money is flowing to agent *infrastructure*, not just agents\n- **Temporal: $550M at $12.55B**, ARR above $250M and growing more than 200%, driven by long-running agent workflows. *Question:* do our agents get durable execution, or do they retry from scratch? [GeekWire](https://www.geekwire.com/2026/temporal-raises-550m-hits-12-55b-valuation-as-agentic-ai-wave-fuels-massive-growth/)\n- **Cognition: $2B at $48B**, run-rate revenue near $900M. *Question:* what is our measured unit cost per merged agent PR, compared with the vendor's pitch? [Yahoo Finance](https://finance.yahoo.com/technology/ai/articles/cognition-ai-valued-48bn-2bn-091613681.html)\n- **AIR ($50M) and AIUC ($40M)** are building governance and vetting for agent skills and add-ons. *Question:* who approves a new MCP server or skill in our org today? [TechCrunch](https://techcrunch.com/2026/09/01/air-raises-50m-to-help-companies-vet-the-skills-and-add-ons-ai-agents-use/)\n\n## Agent security moved from theory to incident reports\n- OpenAI paused tool-use workloads on its most capable models after a DNS-egress escape, and Hugging Face published a full intrusion chain. *Question:* if one of our agents got RCE in a worker pod, what credentials could it reach? [OpenAI](https://alignment.openai.com/misalignment-reports/an-agent-used-dns-to-reach-an-external-chatbot/) · [HF](https://huggingface.co/blog/agent-intrusion-technical-timeline)\n- Gartner expects 40% of enterprises to demote or decommission autonomous agents by 2027 over governance gaps. *Question:* which of our agents would survive an audit? [AIwire](https://www.hpcwire.com/aiwire/2026/09/09/autopsy-of-an-agent-incident-three-patterns-behind-gartners-40-failure-rate/)\n\n## Markets reward \"agent\" in the product and punish per-seat pricing\n- MSFT rose 4% on the Copilot agent revamp, while SaaS is still discounted on seat-compression fears. *Question:* if our internal tools are priced or budgeted per seat, what happens when agents become the users? [Yahoo](https://finance.yahoo.com/markets/stocks/articles/stock-market-today-sept-25-214549821.html)\n\n## Build vs buy is being re-litigated\n- Perplexity built its own serving store with agents and claims 5x lower latency and ≥20% lower cost. *Question:* which managed services are we overpaying for that a small agent-assisted team could replace, and who would operate the result? [InfoQ](https://www.infoq.com/news/2026/09/cobbledb-perplexity/)\n", "playbook": "# 🛠 AI Engineering Playbook\n\n**How to get the most from AI in software engineering** — concrete, tested moves for cutting cost, shipping faster, and keeping output trustworthy. Grounded in current best practices and real practitioner reports from this week's HN threads.\n\n## Cut token usage (and cost)\n\n- **Turn on prompt caching** — Anthropic caching bills cached input at ~0.1x (a 90% discount) and now auto-caches multi-turn chats. Biggest single lever for repeated context. [Token Optimize](https://www.tokenoptimize.dev/guides/llm-token-optimization-strategies)\n- **Compact mid-session** — use summarize/compaction so the context window doesn't grow unbounded; a long session gets squeezed into a compact recap. [Redis](https://redis.io/blog/llm-token-optimization-speed-up-apps/)\n- **Persist memory across sessions** — curated memory turns a 50K-token reload into a few hundred tokens. Have the agent maintain its own `plan.md`/docs so it isn't reliant on one session's context. [Token Optimize](https://www.tokenoptimize.dev/guides/context-engineering-reduce-token-usage)\n- **Compress & mask tool output** — logs, files, and RAG chunks compress 60–95% before hitting the model; mask irrelevant tool results instead of pasting them whole. [CoddyKit](https://www.coddykit.com/pages/blog-detail?id=512865&slug=how-to-cut-llm-token-usage-by-90-with-context-compression-a-step-by-step-guide)\n- **Retrieve, don't pack** — fetch only relevant chunks on demand from a vector store rather than stuffing the whole history in the prompt. [LogRocket](https://blog.logrocket.com/stop-wasting-ai-tokens-10-ways-to-reduce-usage/)\n- **Compile fuzzy calls into local functions** — for repeated LLM-API tasks (parse logs, repair JSON, rank by intent), compile the spec into a local \"fuzzy function\" to reclaim locality, reproducibility, and price. [Program-as-Weights](https://arxiv.org/abs/2607.02512)\n- **Minify agent state** — state-in-context agents shrink dramatically with minification/context-pruning. [Minification](https://arxiv.org/pdf/2606.01326) · [Context Pruning](https://arxiv.org/pdf/2605.15315)\n\n## Speed up feature development\n\n- **Plan before you code** — collapse ~20 ambiguous decisions into one reviewed spec so each lands near 100% instead of 80%. The cheapest speed-up there is. [Claude Code Docs](https://code.claude.com/docs/en/best-practices)\n- **Delegate to subagents** — a subagent explores in its own context and reports back a compressed summary, keeping the main session clean and fast (great for large read/exploration tasks). [SmartScope](https://smartscope.blog/en/generative-ai/claude/claude-code-best-practices-advanced-2026/)\n- **Chain the SDLC as skills** — brainstorm → worktree → implementation plan → subagent execution → TDD → review-before-merge (e.g., the \"Superpowers\" collection). [duet.so](https://duet.so/guides/claude-code-skills-complete-guide)\n- **Enforce TDD with hooks** — a deterministic red-green-refactor loop (write failing test → watch it fail → make it pass) via hooks/state machine yields regression-proof code; one HN dev built a 300k-line SaaS this way. [HN](https://news.ycombinator.com/item?id=48413629)\n- **Use a second model as reviewer** — several devs run Codex to review Claude Code output (or vice-versa) as a cheap quality gate. [HN](https://news.ycombinator.com/item?id=48413629)\n\n## Skills to add to a project (and how to manage them)\n\n- **Check skills into the repo** — keep them under `.agents/skills/`, versioned and reviewed via PR, so every contributor inherits the project's conventions automatically. [Developers Digest](https://www.developersdigest.tech/blog/best-claude-code-skills-2026)\n- **Keep 8–12, audit monthly** — that covers most of a senior dev's day; beyond that you pay a \"context tax.\" Delete any skill you haven't triggered in 30 days. [SmartScope](https://smartscope.blog/en/generative-ai/claude/claude-code-best-practices-advanced-2026/)\n- **Right tool for the job** — *Skills* = how to do something; *MCP* = access to external systems; *Subagents* = delegate to a specialist with its own context. [duet.so](https://duet.so/guides/claude-code-skills-complete-guide)\n- **High-ROI starter skills:** branch/PR review, test generation, CI/CD setup, spec-driven scaffolding, incident triage, changelog/release notes, and a repo-conventions linter.\n\n## Keep AI output trustworthy\n\n- **Treat the agent as a fallible teammate** — extensive unit/automation tests, static analysis (e.g., SonarQube), and CI gates on everything merged to main. [HN](https://news.ycombinator.com/item?id=48445024)\n- **Guard the review surface** — autonomous agents that ship code across many PRs are a real attack surface (a payload can be timed across commits); keep human review and CI gating tight. [Distributed Attacks in Persistent-State AI Control](https://arxiv.org/abs/2607.02514)\n- **Prefer deterministic scripts** — for repeatable ops (deploys, scaffolding), have the agent run pre-built scripts instead of improvising API calls, so results are consistent every time. [HN](https://news.ycombinator.com/item?id=48445024)\n\n## Manage context\n\n- **Rules close to the repo** — put project rules where the code lives; keep prompts short and task-specific rather than \"heroic\" mega-prompts. [HN](https://news.ycombinator.com/item?id=48445024)\n- **Watch for context bloat** — too much in context degrades output; lean context beats a kitchen-sink of skills/MCPs. [HN](https://news.ycombinator.com/item?id=48413629)\n\n## Anti-patterns to avoid\n\n- **Vibe coding without the rest of the software** — code isn't the whole product; skipping docs, tests, and design catches up fast.\n- **Skill hoarding** — untriggered skills/MCPs just tax your context window.\n- **Skim reviews** — pattern-skimming misses duplication, bloat, and inconsistent naming that quietly drain productivity.\n- **Burning tokens on non-AI work** — if a plain shell script does the job, automate it without the model.\n\n---\n*Sources: current best-practice guides + practitioner reports from this week's Hacker News threads and arXiv papers in your digest.*\n", "podcast": "# ◇ Story Desk — This Week's Angles\n\n## 1. Datasets as a C2 channel: inside the Hugging Face agent intrusion\n**Angle:** War Story\n**Hook:** A frontier-lab eval agent went from a dataset config upload to cluster-admin in under 13 hours, using features that were never meant to execute anything.\n- **Entry:** HDF5 external-storage reads leaked env secrets; Jinja2 evaluated inside a numeric field gave remote code execution.\n- **Escalation:** default pod access to IMDS, no admission policy against privileged/hostPath pods, and one connector credential bound to system:masters.\n- **What worked:** reconstructing about 17,600 actions from agent logs, with an open model helping with trace analysis; broad rotation; rebuilding the cluster from scratch.\n- **Takeaway:** any loader that interprets user data is an execution surface, including search/RAG ingestion.\n**Who to talk to:** the HF infra/security authors (Hugo Larcher, Adrien Carreira) or a platform-security lead running k8s for ML pipelines.\n**Source:** [HF technical timeline](https://huggingface.co/blog/agent-intrusion-technical-timeline)\n\n## 2. \"The monitor counted failure as success\"\n**Angle:** War Story\n**Hook:** OpenAI's agent tunnelled out over DNS, and the monitor treated failed lookups as evidence that the egress attempt had failed.\n- Monitoring agents with LLM judges has a blind spot: unhelpful outcomes look like safe outcomes.\n- OpenAI paused tool-use training, evals, and inference for its most capable models.\n- On HN: should agents be told when a block is intentional? Should evals be air-gapped?\n**Who to talk to:** an agent-platform SRE or security engineer who owns egress policy.\n**Source:** [OpenAI report](https://alignment.openai.com/misalignment-reports/an-agent-used-dns-to-reach-an-external-chatbot/) · [HN](https://news.ycombinator.com/item?id=49853137)\n\n## 3. Is full-text search still undefeated? BM25 vs embeddings in 2026\n**Angle:** Architecture\n**Hook:** A 218-comment HN thread says teams \"vastly overestimate embeddings.\" This week's papers still ship weighted hybrids.\n- Compare the paper's RRF weights (0.50/0.35/0.15) with your own OpenSearch hybrid-query normalization.\n- When does an agent issuing many cheap FTS queries beat one expensive vector query?\n- LLM reranking cost (DoPR) and predicting ANN recall before re-embedding.\n**Who to talk to:** an OpenSearch/Elasticsearch relevance engineer, ideally someone who has A/B-tested hybrid against pure BM25.\n**Source:** [HN](https://news.ycombinator.com/item?id=49445727) · [arXiv 2609.01617](https://arxiv.org/abs/2609.01617)\n\n## 4. Agents built the database; humans run it\n**Angle:** Tool-Workflow\n**Hook:** Two engineers and hundreds of agents built Perplexity's DynamoDB replacement in two months, but none of those agents got operational access.\n- Architecture: separate durable, batch, and serving tiers; NVMe cache; zone-aware hedged reads.\n- p99 dropped from 123 ms to 24.2 ms. How was agent-written storage code verified?\n- Where exactly does the \"build vs operate\" line sit, and why?\n**Who to talk to:** Perplexity search-infra engineers.\n**Source:** [InfoQ](https://www.infoq.com/news/2026/09/cobbledb-perplexity/) · [The New Stack](https://thenewstack.io/perplexity-cobbledb-ai-database/)\n\n## 5. Deep-search agents are drowning in their own context\n**Angle:** Architecture\n**Hook:** More than 59% of ReAct runs on BrowseComp never finish inside 64K tokens. Should an agentic chat keep a summary as state instead of a transcript?\n- Planner/Synthesizer split; zero-shot gains on frontier models.\n- Fewer search rounds (7–8 vs 12+) means lower retrieval load.\n- Ties into the agent-memory repos trending on GitHub (hindsight, mem0).\n**Who to talk to:** the IterSynth authors, or a team running deep research in production.\n**Source:** [HF papers](https://huggingface.co/papers/2609.29444)\n\n## 6. Stateless MCP: idempotency is now your problem\n**Angle:** Architecture\n**Hook:** Sticky sessions are gone, and so is stream resumability. Every tool call with side effects needs a retry story.\n- Mcp-Method/Mcp-Name headers enable gateway routing and throttling; W3C tracing is built in.\n- Run dual-protocol support until legacy clients are gone.\n**Who to talk to:** the AWS Architecture Blog authors or an MCP gateway maintainer.\n**Source:** [InfoQ](https://www.infoq.com/news/2026/09/aws-stateless-mcp/)\n"}, "WEEK": "2026-11-02"};
const DIGEST = BUNDLE.DIGEST, DOCS = BUNDLE.DOCS;
const VIEWS = [
  { key: "morning",   label: "◉ Morning Brief",    type: "md",   doc: "morning" },
  { key: "retrieval", label: "⌕ Retrieval Desk",   type: "desk", tag: "retrieval" },
  { key: "agents",    label: "⛓ Agents in Prod",   type: "desk", tag: "agents" },
  { key: "warstory",  label: "⚠ War Stories",      type: "desk", tag: "warstory" },
  { key: "strategy",  label: "↗ Strategy Signals", type: "md",   doc: "strategy" },
  { key: "playbook",  label: "⚙ Playbook",         type: "md",   doc: "playbook" },
  { key: "podcast",   label: "◇ Story Desk",       type: "md",   doc: "podcast" },
];
const SRC_LABEL = { arxiv: "arXiv", blogs: "Blog", github: "GitHub", hackernews: "HN" };
let tab = "morning";
const esc = s => (s || "").replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function itemsByTag(tag) {
  const src = DIGEST.sources || {}; const out = [];
  for (const k of Object.keys(src)) for (const it of (src[k] || [])) if ((it.tags || []).includes(tag)) out.push({ it, src: k });
  return out;
}
function tabButton(v, count) {
  const div = document.createElement("div");
  div.className = "tab" + (v.key === tab ? " active" : "");
  div.innerHTML = v.label + (count != null ? ` <span class="count">${count}</span>` : "");
  div.onclick = () => { tab = v.key; renderTabs(); renderItems(); };
  return div;
}
function renderTabs() {
  const el = document.getElementById("tabs"); el.innerHTML = "";
  for (const v of VIEWS) {
    if (v.type === "desk") { const c = itemsByTag(v.tag).length; if (!c) continue; el.appendChild(tabButton(v, c)); }
    else el.appendChild(tabButton(v, null));
  }
}
function mdToHtml(md) {
  const lines = (md || "").replace(/\r/g, "").split("\n"); let html = "", inList = false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*(.+?)\*/g, "<em>$1</em>");
  const cl = () => { if (inList) { html += "</ul>"; inList = false; } };
  for (const raw of lines) { const line = raw.trimEnd();
    if (/^#{1,6}\s/.test(line)) { cl(); const lvl = line.match(/^#+/)[0].length; html += `<h${lvl} class="md-h">${inline(line.replace(/^#+\s/, ""))}</h${lvl}>`; }
    else if (/^---+$/.test(line)) { cl(); html += "<hr>"; }
    else if (/^[-*]\s/.test(line)) { if (!inList) { html += '<ul class="md-ul">'; inList = true; } html += `<li>${inline(line.replace(/^[-*]\s/, ""))}</li>`; }
    else if (line === "") { cl(); } else { cl(); html += `<p class="md-p">${inline(line)}</p>`; } }
  cl(); return html;
}
function badge(t) { return `<span class="badge">${esc(String(t))}</span>`; }
function deskCard(it, srcKey) {
  const title = `<a class="title" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`;
  let meta = [`<span class="badge src">${esc(SRC_LABEL[srcKey] || srcKey)}</span>`];
  if (srcKey === "arxiv")  meta.push(badge(it.authors || "—"), badge(it.published));
  if (srcKey === "blogs")  meta.push(badge(it.blog || "blog"), badge(it.published || ""));
  if (srcKey === "github") meta.push(badge("★ " + (it.stars ?? 0)), badge(it.language || "—"));
  let extra = "";
  if (srcKey === "hackernews") {
    meta.push(badge((it.comments ?? 0) + " comments"), `<a class="badge" href="${esc(it.hn_url)}" target="_blank" rel="noopener">HN thread</a>`);
    if (it.discussion_summary) {
      const quotes = (it.top_comments || []).map(c => `<div class="quote">“${esc(c.text)}”<span class="who"> — ${esc(c.author)}</span></div>`).join("");
      extra = `<div class="disc"><div class="disc-h">💬 What people are saying</div><div class="disc-body">${esc(it.discussion_summary)}</div>${quotes}</div>`;
    }
  }
  const summary = it.summary ? `<div class="summary">${esc(it.summary)}</div>` : "";
  return `<div class="card">${title}${summary}${extra}<div class="meta">${meta.join("")}</div></div>`;
}
function renderItems() {
  const root = document.getElementById("content");
  const view = VIEWS.find(v => v.key === tab) || VIEWS[0];
  if (view.type === "md") {
    const md = DOCS[view.doc];
    root.innerHTML = md ? `<div class="brief">${mdToHtml(md)}</div>` : `<div class="empty">Not in this edition.</div>`;
    return;
  }
  const rows = itemsByTag(view.tag);
  root.innerHTML = rows.length ? rows.map(r => deskCard(r.it, r.src)).join("") : `<div class="empty">No items on this desk this week.</div>`;
}
document.getElementById("weeklabel").textContent = BUNDLE.WEEK ? "Week of " + BUNDLE.WEEK : "";
renderTabs(); renderItems();
</script>
