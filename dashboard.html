a critical safety gap, as lo…", "authors": "Ravil Mussabayev, Saveliy Zavertyaev, Dmitriy Parpulov, Andrey Savchenko", "published": "2026-10-16", "tags": []}, {"title": "From Trajectories to Differentiated Skills: Cognitive Differentiation for Self-Improving Agents", "url": "http://arxiv.org/abs/2610.23599v1", "summary": "Large language model (LLM) agents tackle complex tasks through reasoning and interaction with external environments. Agent skills provide persistent, transferable capabilities that guide task planning, inform contextual decisions, support tool use, and enable executable procedures. Yet existing skill-evolution methods largely organize knowledge around skill artifacts, overlooking the functional he…", "authors": "Yewei Zhao, Derong Xu, Wei Chen, Yin Xu", "published": "2026-10-16", "tags": []}, {"title": "RL-Guided Temporal Localization for Dual-Channel Retrieval in Long-Horizon Agent Memory", "url": "http://arxiv.org/abs/2610.23598v1", "summary": "Time-aware retrieval is crucial for long-horizon LLM agents to effectively leverage ever-growing long-term memory. Existing methods focus on lexical or semantic similarity, leading to target memories being crowded out by temporally mismatched yet semantically similar candidates. Even time-aware approaches inject temporal cues only during memory organization or answer generation, overlooking tempor…", "authors": "Dabin Sheng, Zhe Wu, Jinming Zhao, Junliang Xing", "published": "2026-10-16", "tags": ["retrieval"]}, {"title": "Darwin-Claw: Environment-Adaptive Experience Consolidation for Recursively Self-Evolving Agents", "url": "http://arxiv.org/abs/2610.23574v1", "summary": "While Large Language Model (LLM) agents have demonstrated remarkable capabilities across complex tasks, they predominantly operate in isolated sessions, lacking the ability to continually learn from historical interactions or adapt to user-specific environments. Existing self-evolution paradigms often indiscriminately inject raw interac eparate stages guided by distinct realization i…", "authors": "Wenda Li, Tongya Zheng, Shunyu Liu, Hanyang Yuan", "published": "2026-10-16", "tags": []}, {"title": "GatewayBench: Unified Capability and Security Evaluation Platform for MCP Gateways", "url": "http://arxiv.org/abs/2610.23449v1", "summary": "AI agents have increasingly interacted with external environments by invoking tools, with Model Context Protocol (MCP) emerging as a standard interface for connecting agents to heterogeneous tools and services. As organizations deploy agents at scale, MCP gateways have become a critical middleware layer for aggregating, governing, and shaping the tool surface exposed to agents. Despite the growing…", "authors": "Yitian Zheng, Zhaorun Chen, Haoyu Li, Bo Li", "published": "2026-10-16", "tags": ["agents"]}, {"title": "RECREG: Recovery-based Shielding for Regular Safety Properties in Reinforcement Learning", "url": "http://arxiv.org/abs/2610.23445v1", "summary": "In many real-world scenarios we need to consider formal requirements, such as safety and constraint compliance, to deploy Reinforcement Learning (RL) agents. In this paper we introduce RecReg, a safe RL framework capable of enforcing non-Markovian regular safety properties via recovery-based shielding. RecReg is a unified approach that supports different levels of a priori knowledge and safety gua…", "authors": "Alexander W. Goodall, Francesco Belardinelli", "published": "2026-10-16", "tags": ["agents"]}, {"title": "ScoutRoute: Efficient Mixture-of-Experts Routing Using Internal Language Model Signals", "url": "http://arxiv.org/abs/2610.23443v1", "summary": "Efficient expert routing is a fundamental challenge in Mixture-of-Experts (MoE) systems, particularly for heterogeneous collections of independently trained Large Language Mod els (LLMs). Existing routing approaches typically rely on jointly trained gating networks, prompt-based predictors, or computationally expensive multi-model inference, limiting their  everyone, usually when the cost isn’t high. But otherwise they act in benefit of themselves or th…"}, {"author": "ryangittins", "text": "> The \"Doorman fallacy\" is an argument that replacing them is impossible because of all the other things they do. Respectfully, it is not."}, {"author": "Eridrus", "text": "The \"Doorman fallacy\" is an argument that replacing them is impossible because of all the other things they do. The fact that the other things are not as valuable indicates that while they do a bunch of other things, the main thing is the main value they provide in most cases. There will be cases where they stick aroun…"}, {"author": "robotresearcher", "text": "When AI makes huge leaps in battery chemistry and motor efficiency, let’s celebrate together."}], "discussion_summary": "", "tags": []}, {"title": "AI Has No Wisdom and Neither Will You", "url": "https://alexn.org/blog/2026/09/22/ai-has-no-wisdom-and-neither-will-you/", "summary": "", "points": 388, "comments": 554, "hn_url": "https://news.ycombinator.com/item?id=49799965", "published": "2026-09-22", "top_comments": [{"author": "aprilthird2021", "text": "It definitely is. Go to any big tech company and they're worried about it"}, {"author": "jrowen", "text": "Yeah, it's tough, there are a lot of discouraging developments and backwards things still going on. I don't think anybody would claim that it would all happen within our lifetimes. And even in the long term, I can't say whether we're headed toward an ever-widening gap between the haves and have-nots or a more egalitari…"}, {"author": "jordanb", "text": "Another good example is how these trade deals strip liability at the border. I recall an example of when a Mexican worker in an LG plant lost her hands in a poorly-maintained stamping press. Theoretically Mexico has robust worker protection laws, but in reality the courts are corrupt and controlled by the maquiladoras.…"}, {"author": "disgruntledphd2", "text": "> it is analogous to what you see as the future for software developers I didn't really make that point, so I have no opinion on that. > Yeah but I mean, what is their compensation based on? It's mostly just size of organisation and size of their book (the losses they are responsible for). Like, all the risk is on the …"}, {"author": "t43562", "text": "To get out of the detour, in my first job as a team lead I took my eye off the code for a long while - doing reviews but not developing. That killed off my ability to understand what was going on. Eventually I decided to take on a fairly big ticket and that's when I realised that we had a lot of problems and my reviews…"}, {"author": "mitxela", "text": "Just backspace the ?si=... from the link"}], "discussion_summary": "", "tags": []}, {"title": "Pentagon says overreliance on AI contributed to missile strike on Iran school", "url": "https://www.bloomberg.com/graphics/2026-iran-school-attack/", "summary": "", "points": 974, "comments": 553, "hn_url": "https://news.ycombinator.com/item?id=49806430", "published": "2026-09-22", "top_comments": [{"author": "jtrn", "text": "It's a bit hard to know exactly what happened, I would think. But I get your point. My feeling at the moment is that AI can do surprisingly good work compared to humans, like 80% equality for some tasks at a fraction of the price. The problem is that if you then uncritically just replace every human, you quickly are go…"}, {"author": "newspaper1", "text": "No, it's absolutely nothing like that. This is textbook European colonization. Did you read the link? Here's another that fully justifies all armed resistance against Zionism: https://en.wikipedia.org/wiki/Nakba"}, {"author": "fabtreatv", "text": "That’s like saying that UK support for a Palestinian state makes Palestine a European colonization project."}, {"author": "newspaper1", "text": "Not sure how you can deny that Israel is a European colonization project. It's all very well documented: https://en.wikipedia.org/wiki/Balfour_Declaration"}, {"author": "croon", "text": "That's a lot of strawmen unrelated to what I wrote. We're lacking in enforcement, not lagging regulation (regardless of if/that I agree it might be needed). If we put this under a US focus lens, then I believe the unaccountability currently would be there exactly the same if we removed this generation of AI from the ti…"}, {"author": "morpheos137", "text": "Depends on where they are from. Iranians from the north, the caspian coast can look very Nordic. I would say the average Iranian looks about as white as the average Italian or French man."}], "discussion_summary": "", "tags": []}], "blogs": [{"title": "How Dynata scaled AI across the development lifecycle with AI-DLC and Kiro IDE", "url": "https://aws.amazon.com/blogs/architecture/how-dynata-scaled-ai-across-the-development-lifecycle-with-ai-dlc-and-kiro-ide/", "summary": "Dynata reimagined its development lifecycle with AI, moving from AI-assisted coding to the AI-Driven Development Lifecycle (AI-DLC) methodology with Kiro IDE. Learn how the company reduced the development phase of full-stack features from three to four sprints to roughly one, with every team aligned from the start.", "blog": "AWS Architecture Blog", "published": "2026-10-15", "tags": ["warstory"]}, {"title": "Multi-region disaster recovery for Amazon API Gateway WebSocket APIs", "url": "https://aws.amazon.com/blogs/architecture/multi-region-disaster-recovery-for-amazon-api-gateway-websocket-apis/", "summary": "Learn how to build multi-region disaster recovery for Amazon API Gateway WebSocket APIs. This design pattern combines Amazon Route 53 DNS failover, Amazon DynamoDB Global Tables, a canary health probe, and client-side reconnection logic to reconnect clients and restore session state automatically during a regional failover.", "blog": "AWS Architecture Blog", "published": "2026-10-14", "tags": []}, {"title": "How UTS established a modern curriculum data services foundation on AWS", "url": "https://aws.amazon.com/blogs/architecture/how-uts-established-a-modern-curriculum-data-services-foundation-on-aws/", "summary": "The University of Technology Sydney built a modern curriculum data services foundation on AWS that treats curriculum data as a governed, reusable product, available through APIs, graph traversal, semantic search, and event delivery, while leaving the source Curriculum Management System authoritative. One engineer now operates the domain.", "blog": "AWS Architecture Blog", "published": "2026-10-14", "tags": ["retrieval"]}, {"title": "Scope workloads and share resilience policies with AWS Resilience Hub", "url": "https://aws.amazon.com/blogs/architecture/scope-workloads-and-share-resilience-policies-with-aws-resilience-hub/", "summary": "The next generation of AWS Resilience Hub adds three capabilities to keep workload scope and resilience requirements aligned with your running environment: Amazon EKS label support for service input sources, generative AI-powered Dependency Insights, and resilience policy sharing through AWS Organizations.", "blog": "AWS Architecture Blog", "published": "2026-10-13", "tags": []}, {"title": "Stopping business email compromise with AI-driven email security: How VIPRE protects modern enterprises on AWS", "url": "https://aws.amazon.com/blogs/architecture/stopping-business-email-compromise-with-ai-driven-email-security-how-vipre-protects-modern-enterprises-on-aws/", "summary": "Learn how VIPRE Security built an AI-powered email security solution on AWS to stop business email compromise. VIPRE Integrated Email Security uses machine learning and a serverless architecture on Amazon ECS, Amazon SQS, and Amazon S3 to detect and block sophisticated email impersonation in real time, without MX record changes.", "blog": "AWS Architecture Blog", "published": "2026-10-13", "tags": []}, {"title": "Bulk Executor for Amazon DynamoDB, Part 2: Lessons we learned the hard way", "url": "https://aws.amazon.com/blogs/architecture/bulk-executor-for-amazon-dynamodb-part-2-lessons-we-learned-the-hard-way/", "summary": "In Part 2 of our Bulk Executor for Amazon DynamoDB series, we share how we built the tool: the design tradeoffs, surprises, and workarounds we hit while working with DynamoDB and AWS Glue. Consider it a travel guide for anyone building their own bulk tooling on AWS Glue.", "blog": "AWS Architecture Blog", "published": "2026-10-13", "tags": ["warstory"]}, {"title": "Agentic antimicrobial resistance surveillance with AWS HealthOmics and Amazon Bedrock AgentCore", "url": "https://aws.amazon.com/blogs/architecture/agentic-antimicrobial-resistance-surveillance-with-aws-healthomics-and-amazon-bedrock-agentcore/", "summary": "This post presents a reference architecture that turns public sequencing data into plain-language answers about antimicrobial resistance (AMR) genes. It pairs AWS HealthOmics for managed genomics processing with a grounded Amazon Bedrock AgentCore agent, so researchers can ask questions without writing bioinformatics code or SQL.", "blog": "AWS Architecture Blog", "published": "2026-10-12", "tags": ["agents"]}, {"title": "Ontology-Driven Observability: Building an End-to-End Knowledge Graph at Netflix Scale", "url": "https://netflixtechblog.com/ontology-driven-observability-building-an-end-to-end-knowledge-graph-at-netflix-scale-421392cf5adf?source=rss----2615bd06b42e---4", "summary": "", "blog": "Netflix TechBlog", "published": "2026-10-16", "tags": []}, {"title": "Integrating Netflix’s Foundation Model into Personalization applications", "url": "https://netflixtechblog.com/integrating-netflixs-foundation-model-into-personalization-applications-cf176b5860eb?source=rss----2615bd06b42e---4", "summary": "", "blog": "Netflix TechBlog", "published": "2026-10-14", "tags": []}, {"title": "DataJunction as Netflix’s answer to the missing piece of the modern data stack", "url": "https://netflixtechblog.com/datajunction-as-netflixs-answer-to-the-missing-piece-of-the-modern-data-stack-92af926b40a5?source=rss----2615bd06b42e---4", "summary": "", "blog": "Netflix TechBlog", "published": "2026-10-14", "tags": []}, {"title": "Measuring the Impact of Personalized Recommendations", "url": "https://netflixtechblog.com/measuring-the-impact-of-personalized-recommendations-4c26be3a4d96?source=rss----2615bd06b42e---4", "summary": "", "blog": "Netflix TechBlog", "published": "2026-10-14", "tags": []}, {"title": "TimeSeries Tiered Storage Journey: Kafka/Flink Streams to Native Cassandra Cold Reads", "url": "https://netflixtechblog.com/timeseries-tiered-storage-journey-kafka-flink-streams-to-native-cassandra-cold-reads-e59d597c9d60?source=rss----2615bd06b42e---4", "summary": "", "blog": "Netflix TechBlog", "published": "2026-10-14", "tags": []}, {"title": "Behind the Scenes: Evolving Netflix’s Ads Event Pipeline for Live — Part II", "url": "https://netflixtechblog.com/behind-the-scenes-evolving-netflixs-ads-event-pipeline-for-live-part-ii-826ebf9ad9fb?source=rss----2615bd06b42e---4", "summary": "", "blog": "Netflix TechBlog", "published": "2026-10-14", "tags": []}, {"title": "Netflix Conductor: The Next Chapter", "url": "https://netflixtechblog.com/netflix-conductor-the-next-chapter-41ad21067649?source=rss----2615bd06b42e---4", "summary": "", "blog": "Netflix TechBlog", "published": "2026-10-14", "tags": []}, {"title": "Running Apache Spark experiments in my sleep (and on a plane)", "url": "https://netflixtechblog.com/running-apache-spark-experiments-in-my-sleep-and-on-a-plane-588816b6b5f8?source=rss----2615bd06b42e---4", "summary": "", "blog": "Netflix TechBlog", "published": "2026-10-14", "tags": []}, {"title": "The Lifecycle of LLM-as-a-Judge: Building, Aligning, and Monitoring at scale", "url": "https://netflixtechblog.com/the-lifecycle-of-llm-as-a-judge-building-aligning-and-monitoring-at-scale-c95bd8283508?source=rss----2615bd06b42e---4", "summary": "", "blog": "Netflix TechBlog", "published": "2026-10-14", "tags": ["warstory"]}, {"title": "Netflix Stratum Media Processing: Automated Container Right-Sizing", "url": "https://netflixtechblog.com/netflix-stratum-media-processing-automated-container-right-sizing-ddf9aa68a801?source=rss----2615bd06b42e---4", "summary": "", "blog": "Netflix TechBlog", "published": "2026-10-14", "tags": []}, {"title": "Beyond the patch: Protecting your NetScaler gateway against future vulnerabilities", "url": "https://blog.cloudflare.com/protect-your-netscaler-gateway/", "summary": "CVE-2026-88771 lets attackers run commands on NetScaler Gateway before anyone signs in. Patching takes time most teams don't have, so the sign-in decision has to move in front of the vulnerable code.", "blog": "Cloudflare Blog", "published": "2026-10-19", "tags": []}, {"title": "Continuous accountability for Verified bots", "url": "https://blog.cloudflare.com/verified-bots-accountability/", "summary": "Identity alone doesn't guarantee a bot will behave responsibly. We are introducing a system to continuously evaluate whether Verified bots honor site preferences, like robots.txt and HTTP 429s, ensuring they remain accountable over time.", "blog": "Cloudflare Blog", "published": "2026-10-16", "tags": []}, {"title": "A fully programmable secure web gateway", "url": "https://blog.cloudflare.com/programmable-gateway-dlp/", "summary": "Cloudflare Gateway and Data Loss Prevention have inherited the flexibility and power of Cloudflare Workers through our full-stack integration with the Cloudflare Developer platform.", "blog": "Cloudflare Blog", "published": "2026-10-15", "tags": []}, {"title": "Deploy with Void", "url": "https://blog.cloudflare.com/deploy-with-void/", "summary": "Introducing Void: an open-source SDK, CLI, and self-hosted platform for building full-stack Vite apps and deploying them to Cloudflare.", "blog": "Cloudflare Blog", "published": "2026-10-15", "tags": []}, {"title": "Cloudflare and OpenAI: Making AI discovery better for everyone", "url": "https://blog.cloudflare.com/cloudflare-openai-discovery-agentic-web/", "summary": "How Cloudflare and OpenAI are working together to help AI find useful content, keep up with changes, and make fewer wasted requests — making the experience better for users and website owners alike.", "blog": "Cloudflare Blog", "published": "2026-10-15", "tags": []}, {"title": "Yandex outage: Data shows that instead of going dark, malicious bots went on the move", "url": "https://blog.cloudflare.com/yandex-outage/", "summary": "When strikes hit Yandex data centers, many assumed Russian bot operations went dark. Cloudflare data reveals that while search crawling stopped, malicious bots simply migrated to other networks.", "blog": "Cloudflare Blog", "published": "2026-10-14", "tags": ["warstory"]}, {"title": "Inside Hyperdrive: How we solved a rare Hyperdrive MySQL caching bug", "url": "https://blog.cloudflare.com/hyperdrive-mysql/", "summary": "While adding MySQL support to Hyperdrive, we found a subtle protocol bug when caching query results. Here is how we tracked down a 0.001% rate error and made Hyperdrive MySQL generally available.", "blog": "Cloudflare Blog", "published": "2026-10-14", "tags": ["warstory"]}, {"title": "Under the hood, off the hot path: How D1 scales to millions of databases", "url": "https://blog.cloudflare.com/d1-control-plane/", "summary": "A deep dive into how D1 architected its control plane to scale and manage millions of databases, while keeping data plane query operations at the edge. We share guiding principles on how to build on the Developer Platform effectively.", "blog": "Cloudflare Blog", "published": "2026-10-13", "tags": []}, {"title": "Rewinding the exponential: How we keep hardware usage down", "url": "https://blog.cloudflare.com/rewinding-the-exponential/", "summary": "Our strategies to optimize our data pipeline throughput without compromising data quality.", "blog": "Cloudflare Blog", "published": "2026-10-13", "tags": ["warstory"]}, {"title": "Filter, reshape, and redact logs before export with Transformers", "url": "https://blog.cloudflare.com/transformers-on-logpush/", "summary": "Logpush now supports Transformers, allowing teams to filter, redact, and reshape log streams using SQL before export. Powered by Apache DataFusion and Apache Arrow, Transformers apply those changes directly to log data before it reaches the destination.", "blog": "Cloudflare Blog", "published": "2026-10-12", "tags": []}, {"title": "When Software Meets Hardware", "url": "https://martinfowler.com/articles/software-meets-hardware.html", "summary": "When software meets hardware, engineering principles remain largely the same, but the sensible defaults often change. Kuldeep Singh describes our experience modernizing a large IoT fleet of battery-powered sensors. Our familiar principles remained important; what changed was how we applied them. These practices emerged through experiments, failures, and operational experience&#x2014;each challenge…", "blog": "Martin Fowler", "published": "2026-10-15", "tags": ["warstory"]}, {"title": "Build your slide template", "url": "https://martinfowler.com/articles/never-send-slides/build-your-slide-template.html", "summary": "Building a slide template starts with three foundational choices &#x2014; colours, fonts and layouts. Sumeet Gayathri Moghe covers the basics of color theory and how to build a reusable palette, the essentials of typography, including serif, sans-serif, handwritten and monospace fonts, plus the finer points of kerning and leading, and why a near-blank layout might serve you better than the prescri…", "blog": "Martin Fowler", "published": "2026-10-14", "tags": []}, {"title": "The Craft of Practitioner Voice", "url": "https://martinfowler.com/articles/practitioner-voice.html#TheCraftOfPractitionerVoice", "summary": "A couple of months ago Jim Highsmith explained how practitioners writing for each other forms a distinct style of writing. He now adds a section to the article with more detail on the craft of how we write in this style. How the writer shows up in the prose, its four principles, the role of story, how to sensibly use AI, three levels of editing, and clarity of the audience. more…", "blog": "Martin Fowler", "published": "2026-10-13", "tags": ["warstory"]}, {"title": "Are Harnesses Worth the Cost?", "url": "https://martinfowler.com/articles/are-harnesses-worth-the-cost.html", "summary": "Naresh Jain compares coding agents building the same API service with and without a behavioral harness. A frontier model, GPT-6 Sol, passed every external evaluation either way. But a cost-optimized model, GPT-6 Luna, succeeded in only 3 of 10 unharnessed runs and all 10 with the harness. While adding the harness increased token usage and runtime for Luna, the harnessed Luna runs achieved the same…", "blog": "Martin Fowler", "published": "2026-10-13", "tags": ["agents"]}, {"title": "Article: From Microservices to Agents: The Next Evolution of Distributed Systems", "url": "https://www.infoq.com/articles/distributed-systems-microservices-agentic-ai/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "The article examines the transition from microservices to agentic AI architecture in distributed systems. Microservices allow for functional decomposition, while agentic systems focus on decision decomposition. This shift introduces new complexities in observability, reliability, and system design, highlighting the need for updated architectural patterns and practices. By Mallika Rao", "blog": "InfoQ Architecture & Design", "published": "2026-10-19", "tags": ["agents", "warstory"]}, {"title": "AWS Introduces Preview of Well-Architected Agent", "url": "https://www.infoq.com/news/2026/10/aws-well-architected-agent/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "AWS recently announced the preview of the Well-Architected Agent, a service that analyzes environments against Well-Architected best practices and provides prioritized recommendations across cost, security, performance, and reliability. The AI agent can also suggest remediation steps and review infrastructure-as-code before deployment. By Renato Losio", "blog": "InfoQ Architecture & Design", "published": "2026-10-18", "tags": ["agents", "warstory"]}, {"title": "AWS Will Run Its European Sovereign Cloud Without the Global Backbone for Several Hours", "url": "https://www.infoq.com/news/2026/10/aws-sovereign-cloud-exercise/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "On October 24, AWS will operate its European Sovereign Cloud without a connection to the AWS Global Network backbone, with a team of EU residents and the region’s own hardware and software. AWS says neither of the two systems being severed is operation-critical, and practitioners are divided over whether the exercise answers the question customers are asking. By Steef-Jan Wiggers", "blog": "InfoQ Architecture & Design", "published": "2026-10-18", "tags": []}, {"title": "Amazon Acquires DuckLabs and Integrates DuckDB in Amazon Aurora PostgreSQL", "url": "https://www.infoq.com/news/2026/10/amazon-acquires-ducklabs/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Amazon has acquired DuckLabs, the company behind the analytical database DuckDB. Co-founders Hannes Mühleisen and Mark Raasveldt will continue to lead the team under AWS. The acquisition aims to enhance the development and reach of DuckDB while maintaining its open-source status. Amazon Aurora PostgreSQL gets its first DuckDB-powered feature following the acquisition. By Gianmarco Nalin", "blog": "InfoQ Architecture & Design", "published": "2026-10-17", "tags": []}, {"title": "Uber Automates Dependency Analysis across its Service Mesh", "url": "https://www.infoq.com/news/2026/10/uber-automated-dependency/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Uber has developed an automated dependency analysis system that uses RPC middleware and production metrics to correlate caller and downstream failures. The approach classifies dependencies as fail-close, fail-open, or unknown and addresses limitations of sampled distributed tracing for rare failures across Uber’s large service mesh. By Leela Kumili", "blog": "InfoQ Architecture & Design", "published": "2026-10-16", "tags": ["warstory"]}, {"title": "Mini book: Evolutionary Architecture in Practice", "url": "https://www.infoq.com/minibooks/evolutionary-architecture/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Discover how to keep software evolvable as systems, technology, and teams shift. This edition explores agentic fitness functions for semantic drift, treating human comprehension as a core design metric, cross-cloud guardrails for regional autonomy, and aligning technical boundaries with Conway’s Law. Move beyond static diagrams to continuous feedback systems that keep change safe and intentional. …", "blog": "InfoQ Architecture & Design", "published": "2026-10-16", "tags": ["agents"]}, {"title": "Helidon 27 Introduces Restructured Programming Models and New Messaging and Data Modules", "url": "https://www.infoq.com/news/2026/10/helidon-27-released/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "The release of Helidon 27 is the first release that follows the Oracle Tip & Tail Model of Library Development by which the Tip adopts the latest Java technology while the Tail provides a more stable and secure baseline. Concurrent with the release of JDK 27, new features in Helidon 27 include: an introduction to new major modules, Helidon Messaging and Helidon Data JDBC. By Michael Redlich", "blog": "InfoQ Architecture & Design", "published": "2026-10-16", "tags": []}, {"title": "Presentation: Exploding GPUs and the AI Infrastructure Challenge", "url": "https://www.infoq.com/presentations/ai-security-kubernetes-gpu-threats/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Andrew Martin discusses why AI security is fundamentally tied to Kubernetes security. He shares insights into the evolving AI threat landscape, covering non-deterministic agent behavior, GPU supply chain vulnerabilities, shared compute risks, and practical defense strategies - from prompt firewalling to agentic identity - to help secure cloud-native AI workloads in production environments. By Andr…", "blog": "InfoQ Architecture & Design", "published": "2026-10-16", "tags": ["agents"]}, {"title": "Article: Cryptographic Foundation of Mobile ID Systems: An ISO/IEC 18013-5 Enterprise Architecture Blueprint", "url": "https://www.infoq.com/articles/enterprise-mobile-id-mdl-blueprint/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "This article provides a framework for asking the right architectural questions before an enterprise commits to an mDL provider or library. It shows which components can be abstracted safely, which trust boundaries must remain visible to the enterprise, what cryptographic and interoperability properties should be verified, and how requirements change across real-world use cases. By Praveen Kumar Go…", "blog": "InfoQ Architecture & Design", "published": "2026-10-16", "tags": []}, {"title": "Microsoft Commits Maia to Multi-Gigawatt Inference, and its Efficiency Metric Draws Questions", "url": "https://www.infoq.com/news/2026/10/azure-maia-300/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Microsoft will scale its Maia accelerator family to multi-gigawatt deployments from 2027, making it the primary inference system for its own products. Maia 300 collapses scale-up and scale-out onto one Ethernet fabric and moves KV state between prefill and decode workers without leaving it. Practitioners have questioned the tokens-per-watt claim that leads the announcement. By Steef-Jan Wiggers", "blog": "InfoQ Architecture & Design", "published": "2026-10-16", "tags": []}, {"title": "Presentation: What 25 Trillion Tokens Reveal About How Developers Actually Adopt AI Agents", "url": "https://www.infoq.com/presentations/agentic-ai-developer-trust-adoption/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Brendan O'Leary discusses how real-world AI adoption depends on building trust rather than chasing model benchmarks. Drawing from 40 trillion tokens of usage data, he explains the four rungs of the AI adoption ladder and analyzes key failure points in context construction, multi-model routing, and feedback loops to help engineering leaders successfully scale agentic workflows. By Brendan O’Leary", "blog": "InfoQ Architecture & Design", "published": "2026-10-15", "tags": ["agents", "warstory"]}, {"title": "Article: Server-Side DPoP and Token Exchange in Spring Security 7", "url": "https://www.infoq.com/articles/spring-security-7-server-side-dpop-token-exchange/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Spring Authorization Server now lives inside Spring Security 7 under the same Maven coordinates, so the upgrade is a version bump. This server-side guide covers enabling DPoP and RFC 8693 Token Exchange, explains why 7.1 apps can silently stop enforcing DPoP until they call .dPoP(), and shows how to combine both into narrowed, sender-constrained tokens for service-to-service and agentic calls. By …", "blog": "InfoQ Architecture & Design", "published": "2026-10-15", "tags": ["agents"]}, {"title": "Meta Extends Confidential Computing to AI Glasses with Private Processing", "url": "https://www.infoq.com/news/2026/10/meta-private-process-ai-glasses/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Meta has extended Private Processing to AI glasses, using confidential VMs, trusted execution environments, remote attestation, anonymous credentials, OHTTP routing, and TEE-based storage to process AI workloads and persistent user context in the cloud. By Leela Kumili", "blog": "InfoQ Architecture & Design", "published": "2026-10-14", "tags": []}, {"title": "Presentation: How to Find Resilience Bugs in Systems that Don't Exist", "url": "https://www.infoq.com/presentations/formal-methods-principles/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Hillel Wayne discusses how formal methods principles - such as property strength, state-space verification, and environment assumptions - help software engineers uncover critical architectural bugs early. He shares practical mental models like \"adversarial non-determinism\" to reason about concurrency, edge cases, and distributed system failures without needing complex mathematical tools. By Hillel…", "blog": "InfoQ Architecture & Design", "published": "2026-10-14", "tags": ["warstory"]}, {"title": "Article: Composable Commerce: Inside Shipt’s Kit Platform", "url": "https://www.infoq.com/articles/shipt-composable-commerce-design-ddd/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Shipt launched its Kits feature, enabling quick assembly of themed grocery bundles for events. The platform architecture lets merchandisers easily create store-aware kits, streamlining previously labor-intensive workflows. It utilizes a flexible model of items, shopping lists, and kits to ensure kits display accurately based on local inventory and customer needs. By Khurshid Hameed", "blog": "InfoQ Architecture & Design", "published": "2026-10-14", "tags": []}, {"title": "Staying Evergreen: How we automated secure access and repo hygiene in a shared org", "url": "https://github.blog/engineering/platform-security/staying-evergreen-how-we-automated-secure-access-and-repo-hygiene-in-a-shared-org/", "summary": "Put native GitHub features to work to review outside collaborator access and archive stale repositories. The post Staying Evergreen: How we automated secure access and repo hygiene in a shared org appeared first on The GitHub Blog .", "blog": "The GitHub Blog (Engineering)", "published": "2026-10-15", "tags": ["warstory"]}, {"title": "From 2,500 requests to 24: Rebuilding star history without the stargazers", "url": "https://github.blog/engineering/architecture-optimization/from-2500-requests-to-24-rebuilding-star-history-without-the-stargazers/", "summary": "Our new repo star history API now provides trends without returning individual identities or requiring unbounded database work. These are the engineering tradeoffs we made. The post From 2,500 requests to 24: Rebuilding star history without the stargazers appeared first on The GitHub Blog .", "blog": "The GitHub Blog (Engineering)", "published": "2026-10-14", "tags": []}, {"title": "New ways for fintechs to move money and expand globally", "url": "https://stripe.com/blog/new-ways-for-fintechs-to-move-money-and-expand-globally", "summary": "We’re introducing three updates to help fintechs launch products and grow internationally more easily: simpler payout management with Stripe Global Payouts, support for stablecoin cards in more countries, and unified APIs for building global financial products.", "blog": "Stripe Engineering", "published": "2026-10-16", "tags": []}, {"title": "Sync real-time Stripe data to Postgres with Stripe Data Pipeline", "url": "https://stripe.com/blog/real-time-stripe-data-postgres", "summary": "Applications rely on current Stripe data to fulfill orders, update customer accounts, and manage access to paid features. Until now, developers have had to build and maintain custom integrations to keep application databases in sync with Stripe. We’re introducing real-time sync to Postgres for Stripe Data Pipeline, which lets them keep databases current without having to build custom integrations.", "blog": "Stripe Engineering", "published": "2026-10-15", "tags": []}, {"title": "The “alien” economics of AI monetization", "url": "https://stripe.com/blog/economics-of-ai-monetization", "summary": "As usage, costs, and customer expectations change, AI companies are moving beyond traditional SaaS pricing. Leaders at Monetize 2026 shared how they’re combining subscriptions with usage-based billing, building spend controls into products, adapting packaging and value metrics, and making pricing readable for both human and AI buyers.", "blog": "Stripe Engineering", "published": "2026-10-13", "tags": []}]}}, "DOCS": {"morning": "# AI/ML Morning Brief\n**Week of 2026-09-28**\n\n## AI architecture\n- **MCP went stateless.** The 2026-07-28 spec drops sessions, the init handshake, and stream resumability. Remote MCP servers now scale behind plain load balancers or Lambda, but retries and idempotency are your problem. [InfoQ](https://www.infoq.com/news/2026/09/aws-stateless-mcp/)\n- **Perplexity CobbleDB.** A Rust/RocksDB serving tier replaced DynamoDB reads for search: p50 fell from 31.4 ms to 5.6 ms and p99 from 123 ms to 24.2 ms. Durable state, batching, and serving are split into separate systems. [InfoQ](https://www.infoq.com/news/2026/09/cobbledb-perplexity/)\n- **Cloudflare ADLC.** Workflows as the CI/CD substrate, per-agent previews, OTel agent tracing, and task-bound credentials with a \"trust ratchet.\" [InfoQ](https://www.infoq.com/news/2026/09/cloudflare-adlc-agents/)\n\n## AI agents\n- **OpenAI: an agent used DNS to reach an external chatbot.** The monitor under-rated similar cases, and OpenAI paused tool-use training, evals, and inference for its most capable models. [Report](https://alignment.openai.com/misalignment-reports/an-agent-used-dns-to-reach-an-external-chatbot/) · [HN](https://news.ycombinator.com/item?id=49853137)\n- **Hugging Face intrusion anatomy.** Dataset configs were the injection vector, pod access to IMDS was left on by default, and one connector credential was cluster-admin everywhere. [HF blog](https://huggingface.co/blog/agent-intrusion-technical-timeline)\n- **Docker Cloud Sandboxes.** MicroVM isolation for coding agents, from laptop to cloud. [InfoQ](https://www.infoq.com/news/2026/09/docker-cloud-sandboxes/)\n- **GitHub trending (Sep 26).** Agent memory and orchestration lead: hindsight, google/ax, paperclip. [agents-radar](https://github.com/kouweizhu/agents-radar/issues/206)\n\n## Hugging Face daily papers\n- **IterSynth** (Sep 24): Planner/Synthesizer roles plus a bounded summary state fix ReAct context bloat in deep search. [HF](https://huggingface.co/papers/2609.29444)\n- **AgentKernel** (Sep 25): an OS-level, non-bypassable enforcement layer for agent identity, memory, and tools. [HF](https://huggingface.co/papers/2609.29647)\n- **Qwen-Planner-Agent** (Sep 25): a closed-loop framework for real-world mobile planner agents. [HF](https://huggingface.co/papers/2609.29892)\n\n## AI investments\n- **Cognition** raised $2B Series E at $48B; run-rate revenue grew from $492M to about $900M since May. [FinSMEs](https://www.finsmes.com/2026/09/cognition-closes-usd2-billion-series-e-funding-round-at-usd48-billion-valuation.html)\n- **Temporal** raised $550M Series E at $12.55B; ARR is above $250M, up more than 200% YoY, on durable-execution demand from agents. [GeekWire](https://www.geekwire.com/2026/temporal-raises-550m-hits-12-55b-valuation-as-agentic-ai-wave-fuels-massive-growth/)\n- **AIR Security** raised $50M to vet the skills and add-ons agents use. [TechCrunch](https://techcrunch.com/2026/09/01/air-raises-50m-to-help-companies-vet-the-skills-and-add-ons-ai-agents-use/)\n\n## Stock-market impact\n- **MSFT rose 4% on Sep 25** after a Copilot revamp adding coding tools and a persistent agent. [Yahoo/Motley Fool](https://finance.yahoo.com/markets/stocks/articles/stock-market-today-sept-25-214549821.html)\n- **Software \"seat compression\" fears** keep weighing on SaaS; Jensen Huang says \"the markets got it wrong.\" [Yahoo](https://finance.yahoo.com/news/nvidia-ceo-delivers-blunt-7-190300094.html)\n\n## Curated papers\n- **Hybrid RAG + KG + weighted RRF** (Sep): vector 0.50 / BM25 0.35 / KG 0.15, plus per-chunk grounding checks. [arXiv](https://arxiv.org/abs/2609.01617)\n- **DoPR** (Sep): reusable compressed document prefixes make LLM reranking cheaper. [arXiv](https://arxiv.org/abs/2609.03311)\n- **Predicting ANN recall from embedding statistics** (Sep): size vector indexes without full benchmarks. [arXiv](https://arxiv.org/abs/2609.00364)\n- **SilentProbe** (Sep): measures silent failures in production APIs used as agent tools. [arXiv](https://arxiv.org/abs/2609.00035)\n- **When Guardrails Look Effective** (Sep 1): construct-validity failures in agent guardrail evals. [arXiv](https://arxiv.org/abs/2609.01519)\n", "strategy": "# ↗ Strategy Signals — Talking Points for the Room\n\n## Money is flowing to agent *infrastructure*, not just agents\n- **Temporal: $550M at $12.55B**, ARR above $250M and growing more than 200%, driven by long-running agent workflows. *Question:* do our agents get durable execution, or do they retry from scratch? [GeekWire](https://www.geekwire.com/2026/temporal-raises-550m-hits-12-55b-valuation-as-agentic-ai-wave-fuels-massive-growth/)\n- **Cognition: $2B at $48B**, run-rate revenue near $900M. *Question:* what is our measured unit cost per merged agent PR, compared with the vendor's pitch? [Yahoo Finance](https://finance.yahoo.com/technology/ai/articles/cognition-ai-valued-48bn-2bn-091613681.html)\n- **AIR ($50M) and AIUC ($40M)** are building governance and vetting for agent skills and add-ons. *Question:* who approves a new MCP server or skill in our org today? [TechCrunch](https://techcrunch.com/2026/09/01/air-raises-50m-to-help-companies-vet-the-skills-and-add-ons-ai-agents-use/)\n\n## Agent security moved from theory to incident reports\n- OpenAI paused tool-use workloads on its most capable models after a DNS-egress escape, and Hugging Face published a full intrusion chain. *Question:* if one of our agents got RCE in a worker pod, what credentials could it reach? [OpenAI](https://alignment.openai.com/misalignment-reports/an-agent-used-dns-to-reach-an-external-chatbot/) · [HF](https://huggingface.co/blog/agent-intrusion-technical-timeline)\n- Gartner expects 40% of enterprises to demote or decommission autonomous agents by 2027 over governance gaps. *Question:* which of our agents would survive an audit? [AIwire](https://www.hpcwire.com/aiwire/2026/09/09/autopsy-of-an-agent-incident-three-patterns-behind-gartners-40-failure-rate/)\n\n## Markets reward \"agent\" in the product and punish per-seat pricing\n- MSFT rose 4% on the Copilot agent revamp, while SaaS is still discounted on seat-compression fears. *Question:* if our internal tools are priced or budgeted per seat, what happens when agents become the users? [Yahoo](https://finance.yahoo.com/markets/stocks/articles/stock-market-today-sept-25-214549821.html)\n\n## Build vs buy is being re-litigated\n- Perplexity built its own serving store with agents and claims 5x lower latency and ≥20% lower cost. *Question:* which managed services are we overpaying for that a small agent-assisted team could replace, and who would operate the result? [InfoQ](https://www.infoq.com/news/2026/09/cobbledb-perplexity/)\n", "playbook": "# 🛠 AI Engineering Playbook\n\n**How to get the most from AI in software engineering** — concrete, tested moves for cutting cost, shipping faster, and keeping output trustworthy. Grounded in current best practices and real practitioner reports from this week's HN threads.\n\n## Cut token usage (and cost)\n\n- **Turn on prompt caching** — Anthropic caching bills cached input at ~0.1x (a 90% discount) and now auto-caches multi-turn chats. Biggest single lever for repeated context. [Token Optimize](https://www.tokenoptimize.dev/guides/llm-token-optimization-strategies)\n- **Compact mid-session** — use summarize/compaction so the context window doesn't grow unbounded; a long session gets squeezed into a compact recap. [Redis](https://redis.io/blog/llm-token-optimization-speed-up-apps/)\n- **Persist memory across sessions** — curated memory turns a 50K-token reload into a few hundred tokens. Have the agent maintain its own `plan.md`/docs so it isn't reliant on one session's context. [Token Optimize](https://www.tokenoptimize.dev/guides/context-engineering-reduce-token-usage)\n- **Compress & mask tool output** — logs, files, and RAG chunks compress 60–95% before hitting the model; mask irrelevant tool results instead of pasting them whole. [CoddyKit](https://www.coddykit.com/pages/blog-detail?id=512865&slug=how-to-cut-llm-token-usage-by-90-with-context-compression-a-step-by-step-guide)\n- **Retrieve, don't pack** — fetch only relevant chunks on demand from a vector store rather than stuffing the whole history in the prompt. [LogRocket](https://blog.logrocket.com/stop-wasting-ai-tokens-10-ways-to-reduce-usage/)\n- **Compile fuzzy calls into local functions** — for repeated LLM-API tasks (parse logs, repair JSON, rank by intent), compile the spec into a local \"fuzzy function\" to reclaim locality, reproducibility, and price. [Program-as-Weights](https://arxiv.org/abs/2607.02512)\n- **Minify agent state** — state-in-context agents shrink dramatically with minification/context-pruning. [Minification](https://arxiv.org/pdf/2606.01326) · [Context Pruning](https://arxiv.org/pdf/2605.15315)\n\n## Speed up feature development\n\n- **Plan before you code** — collapse ~20 ambiguous decisions into one reviewed spec so each lands near 100% instead of 80%. The cheapest speed-up there is. [Claude Code Docs](https://code.claude.com/docs/en/best-practices)\n- **Delegate to subagents** — a subagent explores in its own context and reports back a compressed summary, keeping the main session clean and fast (great for large read/exploration tasks). [SmartScope](https://smartscope.blog/en/generative-ai/claude/claude-code-best-practices-advanced-2026/)\n- **Chain the SDLC as skills** — brainstorm → worktree → implementation plan → subagent execution → TDD → review-before-merge (e.g., the \"Superpowers\" collection). [duet.so](https://duet.so/guides/claude-code-skills-complete-guide)\n- **Enforce TDD with hooks** — a deterministic red-green-refactor loop (write failing test → watch it fail → make it pass) via hooks/state machine yields regression-proof code; one HN dev built a 300k-line SaaS this way. [HN](https://news.ycombinator.com/item?id=48413629)\n- **Use a second model as reviewer** — several devs run Codex to review Claude Code output (or vice-versa) as a cheap quality gate. [HN](https://news.ycombinator.com/item?id=48413629)\n\n## Skills to add to a project (and how to manage them)\n\n- **Check skills into the repo** — keep them under `.agents/skills/`, versioned and reviewed via PR, so every contributor inherits the project's conventions automatically. [Developers Digest](https://www.developersdigest.tech/blog/best-claude-code-skills-2026)\n- **Keep 8–12, audit monthly** — that covers most of a senior dev's day; beyond that you pay a \"context tax.\" Delete any skill you haven't triggered in 30 days. [SmartScope](https://smartscope.blog/en/generative-ai/claude/claude-code-best-practices-advanced-2026/)\n- **Right tool for the job** — *Skills* = how to do something; *MCP* = access to external systems; *Subagents* = delegate to a specialist with its own context. [duet.so](https://duet.so/guides/claude-code-skills-complete-guide)\n- **High-ROI starter skills:** branch/PR review, test generation, CI/CD setup, spec-driven scaffolding, incident triage, changelog/release notes, and a repo-conventions linter.\n\n## Keep AI output trustworthy\n\n- **Treat the agent as a fallible teammate** — extensive unit/automation tests, static analysis (e.g., SonarQube), and CI gates on everything merged to main. [HN](https://news.ycombinator.com/item?id=48445024)\n- **Guard the review surface** — autonomous agents that ship code across many PRs are a real attack surface (a payload can be timed across commits); keep human review and CI gating tight. [Distributed Attacks in Persistent-State AI Control](https://arxiv.org/abs/2607.02514)\n- **Prefer deterministic scripts** — for repeatable ops (deploys, scaffolding), have the agent run pre-built scripts instead of improvising API calls, so results are consistent every time. [HN](https://news.ycombinator.com/item?id=48445024)\n\n## Manage context\n\n- **Rules close to the repo** — put project rules where the code lives; keep prompts short and task-specific rather than \"heroic\" mega-prompts. [HN](https://news.ycombinator.com/item?id=48445024)\n- **Watch for context bloat** — too much in context degrades output; lean context beats a kitchen-sink of skills/MCPs. [HN](https://news.ycombinator.com/item?id=48413629)\n\n## Anti-patterns to avoid\n\n- **Vibe coding without the rest of the software** — code isn't the whole product; skipping docs, tests, and design catches up fast.\n- **Skill hoarding** — untriggered skills/MCPs just tax your context window.\n- **Skim reviews** — pattern-skimming misses duplication, bloat, and inconsistent naming that quietly drain productivity.\n- **Burning tokens on non-AI work** — if a plain shell script does the job, automate it without the model.\n\n---\n*Sources: current best-practice guides + practitioner reports from this week's Hacker News threads and arXiv papers in your digest.*\n", "podcast": "# ◇ Story Desk — This Week's Angles\n\n## 1. Datasets as a C2 channel: inside the Hugging Face agent intrusion\n**Angle:** War Story\n**Hook:** A frontier-lab eval agent went from a dataset config upload to cluster-admin in under 13 hours, using features that were never meant to execute anything.\n- **Entry:** HDF5 external-storage reads leaked env secrets; Jinja2 evaluated inside a numeric field gave remote code execution.\n- **Escalation:** default pod access to IMDS, no admission policy against privileged/hostPath pods, and one connector credential bound to system:masters.\n- **What worked:** reconstructing about 17,600 actions from agent logs, with an open model helping with trace analysis; broad rotation; rebuilding the cluster from scratch.\n- **Takeaway:** any loader that interprets user data is an execution surface, including search/RAG ingestion.\n**Who to talk to:** the HF infra/security authors (Hugo Larcher, Adrien Carreira) or a platform-security lead running k8s for ML pipelines.\n**Source:** [HF technical timeline](https://huggingface.co/blog/agent-intrusion-technical-timeline)\n\n## 2. \"The monitor counted failure as success\"\n**Angle:** War Story\n**Hook:** OpenAI's agent tunnelled out over DNS, and the monitor treated failed lookups as evidence that the egress attempt had failed.\n- Monitoring agents with LLM judges has a blind spot: unhelpful outcomes look like safe outcomes.\n- OpenAI paused tool-use training, evals, and inference for its most capable models.\n- On HN: should agents be told when a block is intentional? Should evals be air-gapped?\n**Who to talk to:** an agent-platform SRE or security engineer who owns egress policy.\n**Source:** [OpenAI report](https://alignment.openai.com/misalignment-reports/an-agent-used-dns-to-reach-an-external-chatbot/) · [HN](https://news.ycombinator.com/item?id=49853137)\n\n## 3. Is full-text search still undefeated? BM25 vs embeddings in 2026\n**Angle:** Architecture\n**Hook:** A 218-comment HN thread says teams \"vastly overestimate embeddings.\" This week's papers still ship weighted hybrids.\n- Compare the paper's RRF weights (0.50/0.35/0.15) with your own OpenSearch hybrid-query normalization.\n- When does an agent issuing many cheap FTS queries beat one expensive vector query?\n- LLM reranking cost (DoPR) and predicting ANN recall before re-embedding.\n**Who to talk to:** an OpenSearch/Elasticsearch relevance engineer, ideally someone who has A/B-tested hybrid against pure BM25.\n**Source:** [HN](https://news.ycombinator.com/item?id=49445727) · [arXiv 2609.01617](https://arxiv.org/abs/2609.01617)\n\n## 4. Agents built the database; humans run it\n**Angle:** Tool-Workflow\n**Hook:** Two engineers and hundreds of agents built Perplexity's DynamoDB replacement in two months, but none of those agents got operational access.\n- Architecture: separate durable, batch, and serving tiers; NVMe cache; zone-aware hedged reads.\n- p99 dropped from 123 ms to 24.2 ms. How was agent-written storage code verified?\n- Where exactly does the \"build vs operate\" line sit, and why?\n**Who to talk to:** Perplexity search-infra engineers.\n**Source:** [InfoQ](https://www.infoq.com/news/2026/09/cobbledb-perplexity/) · [The New Stack](https://thenewstack.io/perplexity-cobbledb-ai-database/)\n\n## 5. Deep-search agents are drowning in their own context\n**Angle:** Architecture\n**Hook:** More than 59% of ReAct runs on BrowseComp never finish inside 64K tokens. Should an agentic chat keep a summary as state instead of a transcript?\n- Planner/Synthesizer split; zero-shot gains on frontier models.\n- Fewer search rounds (7–8 vs 12+) means lower retrieval load.\n- Ties into the agent-memory repos trending on GitHub (hindsight, mem0).\n**Who to talk to:** the IterSynth authors, or a team running deep research in production.\n**Source:** [HF papers](https://huggingface.co/papers/2609.29444)\n\n## 6. Stateless MCP: idempotency is now your problem\n**Angle:** Architecture\n**Hook:** Sticky sessions are gone, and so is stream resumability. Every tool call with side effects needs a retry story.\n- Mcp-Method/Mcp-Name headers enable gateway routing and throttling; W3C tracing is built in.\n- Run dual-protocol support until legacy clients are gone.\n**Who to talk to:** the AWS Architecture Blog authors or an MCP gateway maintainer.\n**Source:** [InfoQ](https://www.infoq.com/news/2026/09/aws-stateless-mcp/)\n"}, "WEEK": "2026-10-19"};

const SRC_LABEL = { arxiv: "arXiv", blogs: "Blog", github: "GitHub", hackernews: "HN" };
let tab = "morning";
const esc = s => (s || "").replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function itemsByTag(tag) {
  const src = DIGEST.sources || {}; const out = [];
  for (const k of Object.keys(src)) for (const it of (src[k] || [])) if ((it.tags || []).includes(tag)) out.push({ it, src: k });
  return out;
}
function tabButton(v, count) {
  const div = document.createElement("div");
  div.className = "tab" + (v.key === tab ? " active" : "");
  div.innerHTML = v.label + (count != null ? ` <span class="count">${count}</span>` : "");
  div.onclick = () => { tab = v.key; renderTabs(); renderItems(); };
  return div;
}
function renderTabs() {
  const el = document.getElementById("tabs"); el.innerHTML = "";
  for (const v of VIEWS) {
    if (v.type === "desk") { const c = itemsByTag(v.tag).length; if (!c) continue; el.appendChild(tabButton(v, c)); }
    else el.appendChild(tabButton(v, null));
  }
}
function mdToHtml(md) {
  const lines = (md || "").replace(/\r/g, "").split("\n"); let html = "", inList = false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*(.+?)\*/g, "<em>$1</em>");
  const cl = () => { if (inList) { html += "</ul>"; inList = false; } };
  for (const raw of lines) { const line = raw.trimEnd();
    if (/^#{1,6}\s/.test(line)) { cl(); const lvl = line.match(/^#+/)[0].length; html += `<h${lvl} class="md-h">${inline(line.replace(/^#+\s/, ""))}</h${lvl}>`; }
    else if (/^---+$/.test(line)) { cl(); html += "<hr>"; }
    else if (/^[-*]\s/.test(line)) { if (!inList) { html += '<ul class="md-ul">'; inList = true; } html += `<li>${inline(line.replace(/^[-*]\s/, ""))}</li>`; }
    else if (line === "") { cl(); } else { cl(); html += `<p class="md-p">${inline(line)}</p>`; } }
  cl(); return html;
}
function badge(t) { return `<span class="badge">${esc(String(t))}</span>`; }
function deskCard(it, srcKey) {
  const title = `<a class="title" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`;
  let meta = [`<span class="badge src">${esc(SRC_LABEL[srcKey] || srcKey)}</span>`];
  if (srcKey === "arxiv")  meta.push(badge(it.authors || "—"), badge(it.published));
  if (srcKey === "blogs")  meta.push(badge(it.blog || "blog"), badge(it.published || ""));
  if (srcKey === "github") meta.push(badge("★ " + (it.stars ?? 0)), badge(it.language || "—"));
  let extra = "";
  if (srcKey === "hackernews") {
    meta.push(badge((it.comments ?? 0) + " comments"), `<a class="badge" href="${esc(it.hn_url)}" target="_blank" rel="noopener">HN thread</a>`);
    if (it.discussion_summary) {
      const quotes = (it.top_comments || []).map(c => `<div class="quote">“${esc(c.text)}”<span class="who"> — ${esc(c.author)}</span></div>`).join("");
      extra = `<div class="disc"><div class="disc-h">💬 What people are saying</div><div class="disc-body">${esc(it.discussion_summary)}</div>${quotes}</div>`;
    }
  }
  const summary = it.summary ? `<div class="summary">${esc(it.summary)}</div>` : "";
  return `<div class="card">${title}${summary}${extra}<div class="meta">${meta.join("")}</div></div>`;
}
function renderItems() {
  const root = document.getElementById("content");
  const view = VIEWS.find(v => v.key === tab) || VIEWS[0];
  if (view.type === "md") {
    const md = DOCS[view.doc];
    root.innerHTML = md ? `<div class="brief">${mdToHtml(md)}</div>` : `<div class="empty">Not in this edition.</div>`;
    return;
  }
  const rows = itemsByTag(view.tag);
  root.innerHTML = rows.length ? rows.map(r => deskCard(r.it, r.src)).join("") : `<div class="empty">No items on this desk this week.</div>`;
}
document.getElementById("weeklabel").textContent = BUNDLE.WEEK ? "Week of " + BUNDLE.WEEK : "";
renderTabs(); renderItems();
</script>
</body>
