": "2026-07-24", "tags": []}, {"title": "Towards Trustworthy and Cost-Efficient Data Integration: From Naïve RAG to Agentic RAG", "url": "http://arxiv.org/abs/2607.22319v1", "summary": "Large language models (LLMs) and AI agents have demonstrated strong potential for data integration in zero-shot and few-shot settings. However, they continue to face significant accuracy and cost challenges in enterprise environments due to a persistent knowledge gap. This paper envisions trustworthy, scalable, and cost-efficient integration through knowledge-grounded LLMs and agents operating wit…", "authors": "Chuangtao Ma, Arijit Khan", "published": "2026-07-24", "tags": ["retrieval", "agents"]}, {"title": "A Roadmap to Impactful Pluralistic Alignment Research", "url": "http://arxiv.org/abs/2607.22305v1", "summary": "Pluralistic value alignment---the goal of building AI systems that represent and serve diverse human values and perspectives---has emerged as an active research agenda. Yet, there's no public evidence that it has shaped the training or evaluation of the AI systems people actually use. We audit the public behavior documents and evaluations of frontier labs, finding none name pluralism as a goal, an…", "authors": "Elinor Poole-Dayan, Jillian Fisher, Atoosa Kasirzadeh, Jacob Andreas", "published": "2026-07-24", "tags": []}, {"title": "Neptuna: A Comprehensive Machine Learning Framework for Benchmarking Complex Multiphase Flows", "url": "http://arxiv.org/abs/2607.22280v1", "summary": "Compressible multiphase flows involving shocks and material interfaces arise in applications such as bubble collapse and droplet breakup, where strong nonlinear interactions produce complex interface deformation, mixing, and multiscale dynamics. Developing reliable machine learning surrogates for these flows remains challenging due to the simultaneous presence of compressibility, sharp discontinui…", "authors": "Harish Ramachandran, Björn Kimpel, Thomas Paula, Josef Winter", "published": "2026-07-24", "tags": []}, {"title": "NUMA balancing hampering performance of spiking network simulations", "url": "http://arxiv.org/abs/2607.22275v1", "summary": "Computing centers today mostly operate conventional CPU- and GPU-based systems, where the direct way of decreasing energy consumption is a reduction in the applications' runtime. Neuromorphic computing promises an alternative architecture with improved energy efficiency for artificial intelligence. In this endeavor, code for the simulation of large-scale spiking networks on conventional supercompu…", "authors": "Melissa Lober, Alp Inangu, Gorka Peraza Coppola, Dennis Terhorst", "published": "2026-07-24", "tags": []}, {"title": "Comparing and Conceptualizing Data Protection Requirements Worldwide for Privacy Regulatory Compliance", "url": "http://arxiv.org/abs/2607.22270v1", "summary": "The growing digitalization of society has intensified the collection, processing, and sharing of personal data, increasingly moving across national borders and regulatory jurisdictions, prompting a proliferation of data protection frameworks worldwide. These transborder personal data flows (TPDF) are essential to today's economy, but organizations managing them must reconcile data protection requi…", "authors": "Claudia Negri-Ribalta, Lorena Sanchez Chamorro, Ioana Visescu, Muriel Frank", "published": "2026-07-24", "tags": []}, {"title": "Explicit Iteration Complexity of Exact Data-Driven Inverse Optimization for Integer Linear Programs", "url": "http://arxiv.org/abs/2607.22263v1", "summary": "A data-driven inverse optimization problem (DDIOP) is the problem of estimating the objective-function parameters (weights) that explain observed optimal-solution data, and it arises in many applications, including integer linear programming (ILP). It is known that, by applying gradient-based optimization methods to the suboptimality loss, the inverse optimization of ILPs can be solved exactly wit…", "authors": "Akira Kitaoka", "publishe er they've answered your question/solved your problem/Xed your Y/whatever else. Until you …"}, {"author": "20k", "text": ">People with the attitude you demonstrate here are consistently among the worst-behaved and hardest-to-deal-with participants on the meta site, because of a stubborn refusal to accept a core principle of the site. Most edits I saw to answers on stack overflow were crap though, the system was regularly abused That stubb…"}, {"author": "kazinator", "text": "These kinds of incidents always remind me of https://wiki.c2.com/?KornShellStory"}, {"author": "DrewADesign", "text": "Sorry, I’m not going to read your >1000 word reply. So far the only thing you’ve convinced me of is that I’d accurately gauged how zealously out-of-touch the people behind that mess were. Have a good one."}, {"author": "Dragas", "text": "I relate to sfn42. That * is* the stack overflow experience. That is the average programming forum experience when you frequent it for more than just to get your problems solved."}, {"author": "nottorp", "text": "Mostly I'd say their downfall was that they encouraged copypasta material and actively discouraged any kind of behaviour that would have built a community."}], "discussion_summary": "", "tags": []}, {"title": "US citizen charged after GrapheneOS phone wipes during airport search", "url": "https://www.techspot.com/news/113236-us-prosecutors-charge-atlanta-man-after-grapheneos-phone.html", "summary": "", "points": 787, "comments": 581, "hn_url": "https://news.ycombinator.com/item?id=49063022", "published": "2026-07-26", "top_comments": [{"author": "tsimionescu", "text": "They can't compel you, no. However, they can ask you to do so, and if you enter a privacy password that shows them something other than your real device (which is what this thread was about), you can very likely be faced with charges of obstruction of justice or even perjury. The point was that it's better to simply re…"}, {"author": "eru", "text": "Why are you staying in ne way or anoth…"}, {"author": "andriy_koval", "text": "I agree is that money is an issue, but not geo-boundaries. If EU decides to commit XXXB they may have a chance to catch up eventually."}, {"author": "ben_w", "text": "Great for us here in Europe, but an even bigger reason for Apple to be upset about it."}], "discussion_summary": "", "tags": []}, {"title": "The bottleneck might be the air in the room", "url": "https://blog.mikebowler.ca/2026/07/03/co2-and-decision-making/", "summary": "", "points": 833, "comments": 468, "hn_url": "https://news.ycombinator.com/item?id=48783117", "published": "2026-07-04", "top_comments": [{"author": "esikich", "text": "Cars are leaky as fuck. They are more leaky than your house. There is 0 potential of CO2 buildup that is anything remotely close to being harmful."}, {"author": "theshrike79", "text": "In these studies, are the people told that they have less CO2 in the air? My experience is more like being slightly drunk. If you know you need to be sharp (client meeting in a meeting room with shitty air), of course you can do it. But when you have a relaxed team meeting in the same room, the jokes start getting real…"}, {"author": "GreenWatermelon", "text": "And Here is the uncomfortable part: The LLM smell in your article is obvious. Not only will people notice, but they will severely denounce the article. Absolutely Shame."}, {"author": "GreenWatermelon", "text": "Myeter started tingling at \"Not the people. The room.\" On the first paragraph, and reached maximums level at the same part as you. Feels like I wasted time reading bullshit."}, {"author": "bloomingeek", "text": "True, but the vast amount of buildings don't have this technology."}, {"author": "cryptonector", "text": "Uh, no, homes should not be airtight. You'd have a hard time closing exterior doors if they were, and anyways, houses need to be able to \"breathe\" to be able to keep humidity down (you don't want mold problems), oxygen up, CO2 down, etc."}], "discussion_summary": "", "tags": []}], "blogs": [{"title": "Building a serverless AI assistant at Pelago: concept to care in two weeks", "url": "https://aws.amazon.com/blogs/architecture/building-a-serverless-ai-assistant-at-pelago-concept-to-care-in-two-weeks/", "summary": "Healthcare organizations face a critical scaling challenge – how to maintain deeply personalized patient interactions as member bases grow, without overwhelming care teams or compromising quality. At Pelago, a digital health company specializing in substance use disorder support, the engineering team found a way to build an AI-powered solution to address this challenge using AWS […]", "blog": "AWS Architecture Blog", "published": "2026-07-22", "tags": ["warstory"]}, {"title": "Building multi-Region resiliency for AWS CloudFormation custom resource deployment", "url": "https://aws.amazon.com/blogs/architecture/building-multi-region-resiliency-for-aws-cloudformation-custom-resource-deployment/", "summary": "AWS CloudFormation is the foundational tool of infrastructure-as-code for thousands of organizations running workloads on AWS. But as teams push the boundaries of what CloudFormation can do natively, custom resources have emerged as a powerful extension mechanism that unlocks a broad range of possibilities. Yet, when it comes to building resilient, multi-Region deployments with custom […]", "blog": "AWS Architecture Blog", "published": "2026-07-22", "tags": []}, {"title": "Architecting offline-first generative AI applications for edge deployments using AWS services", "url": "https://aws.amazon.com/blogs/architecture/architecting-offline-first-generative-ai-applications-for-edge-deployments-using-aws-services/", "summary": "According to Siemens’ 2024 report The True Cost of Downtime, Fortune 500 companies lose an estimated $1.4 trillion annually because of unplanned downtime. This downtime is often worsened by a lack of skills to detect and resolve issues quickly. Generative AI offers a promising path to address this, but deploying these capabilities in industrial environments […]", "blog": "AWS Architecture Blog", "published": "2026-07-22", "tags": ["warstory"]}, {"title": "Automate custom PII detection at scale with Amazon Macie and Step Functions", "url": "https://aws.amazon.com/blogs/architecture/automate-custom-pii-detection-at-scale-with-amazon-macie-and-step-functions/", "summary": "Organizations in regulated industries like financial services, insurance, healthcare, and government ingest large volumes of data containing personally identifiable information (PII). Your applications, claims processing systems, partner data feeds, and internal workflows produce files that may include names, addresses, Social Security numbers, and domain-specific identifiers such as policy number…", "blog": "AWS Architecture Blog", "published": "2026-07-22", "tags": ["warstory"]}, {"title": "BGP ORIGIN attribute manipulation and its impact on the Internet", "url": "https://blog.cloudflare.com/bgp-origin-attribute/", "summary": "By doing in-depth testing, we found nearly 70% of BGP paths experience ORIGIN attribute rewrites by transit providers seeking traffic advantages. We examine the global impact of this practice and argue for deprecating ORIGIN in route selection.", "blog": "Cloudflare Blog", "published": "2026-07-24", "tags": []}, {"title": "Introducing Cache Response Rules", "url": "https://blog.cloudflare.com/introducing-cache-response-rules/", "summary": "Perhaps you’ve seen something that should sail out of cache get dragged back to the origin by a stray Set-Cookie or Cache-Control, headers that can be difficult to change on the origin itself. Cache Response Rules is the fix, applied at the right time.", "blog": "Cloudflare Blog", "published": "2026-07-23", "tags": []}, {"title": "How the 2026 World Cup affected Internet traffic", "url": "https://blog.cloudflare.com/2026-world-cup-internet-traffic/", "summary": "We analyzed global HTTP traffic to explore how kickoff times, streaming habits, and hydration breaks reshaped online activity worldwide. From late-night traffic surges to halftime browsing spikes, here is how the world connected during the global tournament.", "blog": "Cloudflare Blog", "published": "2026-07-21", "tags": []}, {"title": "Cloudflare Internal DNS is now generally available", "url": "https://blog.cloudflare.com/internal-dns/", "summary": "Cloudflare Internal DNS brings authoritative and recursive DNS for private networks to the same global network and control plane that runs Cloudflare's Zero Trust, networking, and public DNS.", "blog": "Cloudflare Blog", "published": "2026-07-20", "tags": []}, {"title": "Fragments: July 21", "url": "https://martinfowler.com/fragments/2026-07-21.html", "summary": "With this post, I’ll wrap up my notes from the second Future of Software Development Retreat . But before I do, I should note that the full Thoughtworks report on the retreat is now available . They have five headline findings: Code generation is no longer the bottleneck — verification is. ‘Harness engineering’ is emerging as a distinct, ownable discipline. Organizations are colliding with a real …", "blog": "Martin Fowler", "published": "2026-07-21", "tags": []}, {"title": "How Zalando Built an In-Process Client-Side Load Balancer for One Million Requests per Second", "url": "https://www.infoq.com/news/2026/07/client-side-load-balancer/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "The engineering team at Zalando recently described the design and implementation of an in-process, client-side load balancer for a high-throughput API handling around 1 million requests per second. The result was more predictable latency, a drop in infrastructure costs, and better visibility into where failures actually originate. By Renato Losio", "blog": "InfoQ Architecture & Design", "published": "2026-07-25", "tags": ["warstory"]}, {"title": "Airbus Makes Protection from Extraterritorial Law a Scored Criterion in Its Cloud Tender", "url": "https://www.infoq.com/news/2026/07/airbus-scaleway-sovereign-cloud/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Airbus selected Scaleway as its sovereign cloud provider after a tender that scored protection against non-European extraterritorial legislation alongside technical capability. Airbus frames it as complementing multi-cloud, not exiting AWS. Practitioners note the pattern is spreading past hyperscalers to small US SaaS vendors, and that sovereignty claims still require verifiable controls. By Steef…", "blog": "InfoQ Architecture & Design", "published": "2026-07-24", "tags": []}, {"title": "Article: The Self-Building Agent: A LangChain4j Experiment", "url": "https://www.infoq.com/articles/self-building-agent-langchain4j/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "The article discusses an experiment where a code assistant had to design an agentic system using LangChain4j documentation. The assistant created a coding framework capable of writing, testing, and debugging code autonomously. Results showed that two architectural patterns—supervisor and workflow—offered different trade-offs between flexibility and execution speed during debugging tasks. By Kevin …", "blog": "InfoQ Architecture & Design", "published": "2026-07-24", "tags": ["agents"]}, {"title": "Expedia Uses AI-Driven Service Telemetry Analyzer to Accelerate Incident Investigation", "url": "https://www.infoq.com/news/2026/07/expedia-ai-observability-star/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Expedia Group has introduced STAR, an internal AI-assisted observability platform that helps engineers investigate production incidents using service telemetry and LLMs. Built with FastAPI, Datadog, Celery, Redis, and Langfuse, STAR follows structured workflows to analyze telemetry, generate root cause assessments, and support incident response while keeping engineers in the loop. By Leela Kumili", "blog": "InfoQ Architecture & Design", "published": "2026-07-23", "tags": ["warstory"]}, {"title": "Presentation: Compiling Workflows into Databases: The Architecture That Shouldn't Work (But Does)", "url": "https://www.infoq.com/presentations/dbos/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Jeremy Edberg & Qian Li discuss why external orchestrators decrease reliability and how to use your existing database for durable execution. They share how DBOS Transact uses standard tables, SKIP LOCKED queues, and unique primary keys to manage complex, fault-tolerant AI workflows with minimal latency, all without the operational overhead of separate distributed systems. By Jeremy Edberg, Qian Li", "blog": "InfoQ Architecture & Design", "published": "2026-07-23", "tags": ["warstory"]}, {"title": "GitHub Increased Instant Navigation from 4% to 22% by Rethinking Client Side Architecture", "url": "https://www.infoq.com/news/2026/07/github-issues-navigation/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "GitHub redesigned GitHub Issues navigation using a client-side architecture that combines caching, predictive prefetching, and service workers to reduce perceived latency. The approach uses IndexedDB, in-memory caching, and background synchronization to serve data faster. GitHub reported instant navigation improvements from 4% to 22%, with latency reductions across multiple navigation paths. By Le…", "blog": "InfoQ Architecture & Design", "published": "2026-07-22", "tags": []}, {"title": "Anthropic Details How it Contains Claude across Web, Code, and Cowork", "url": "https://www.infoq.com/news/2026/07/anthropic-claude-containment/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Anthropic detailed the containment architectures it uses for Claude across its products. It argues that agent safety depends on placing deterministic limits on an agent’s filesystem, network, and execution environment rather than on permission prompts or safeguards. Most notably, it examines failures at trust boundaries and along permitted egress paths that led Anthropic to revise those designs. B…", "blog": "InfoQ Architecture & Design", "published": "2026-07-22", "tags": ["agents", "warstory"]}, {"title": "AWS Billing Bug Shows Customers Trillion-Dollar Estimates While Its Own Cost Alarms Fail to Act", "url": "https://www.infoq.com/news/2026/07/aws-billing-estimates-incident/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "A configuration change in AWS's bill computation system showed customers estimated bills in the billions and trillions of dollars for over 24 hours. AWS's own alarms detected the anomalies but failed to halt bill generation or page engineers; customer escalations alerted the company 4.5 hours later. Budget and cost anomaly alerts were disabled platform-wide during mitigation. By Steef-Jan Wiggers", "blog": "InfoQ Architecture & Design", "published": "2026-07-22", "tags": []}, {"title": "Java News Roundup: Value Objects, WildFly 41, TornadoVM, LangChain4j, Oracle AI Agent Studio", "url": "https://www.infoq.com/news/2026/07/java-news-roundup-jul13-2026/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "This week's Java roundup for July 13th, 2026, features news highlighting: a reintroduction of Value Objects (Preview); the GA release of WildFly 41; the July 2026 edition of Open Liberty 26.0.0.7; point releases of TornadoVM, Apache TomEE, Java Operator SDK and LangChain4j; a maintenance release of Micronaut; a new extension, Quarkus Shim; and a new Oracle AI Agent Studio for Fusion Applications. …", "blog": "InfoQ Architecture & Design", "published": "2026-07-20", "tags": ["agents"]}, {"title": "DoorDash Uses Envoy and Valkey for a 1.5M RPS Proxy Cache with 99.99999% Availability", "url": "https://www.infoq.com/news/2026/07/doordash-entity-cache-proxy/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "DoorDash has developed Entity Cache, a transparent proxy caching platform built on Envoy and Valkey to reduce redundant service-to-service requests across its microservices architecture. Operating within DoorDash’s service mesh, the platform serves over 1.5M requests per second with 99.99999% availability through caching, event-driven invalidation, failure handling, and performance optimizations. …", "blog": "InfoQ Architecture & Design", "published": "2026-07-20", "tags": ["warstory"]}, {"title": "Three InfoQ Certification Cohorts Start This August: Meet the Facilitators", "url": "https://www.infoq.com/news/2026/07/infoq-online-cohorts-2026/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "InfoQ has opened enrollment for three five-week online certification cohorts starting in August, each led by a senior practitioner applying QCon talk frameworks to participants' own work: architecture with Luca Mezzalira, engineering leadership with Michelle Brush, and AI security and privacy with Katharine Jarmul. By Artenisa Chatziou", "blog": "InfoQ Architecture & Design", "published": "2026-07-20", "tags": []}, {"title": "Podcast: Strands Agents with Clare Liguori", "url": "https://www.infoq.com/podcasts/strands-agents/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Thomas Betts talks with Clare Liguori, the technical lead on the open source Strands Agents SDK. The conversation covers how Strands Agents has grown from a Python SDK to a full agent harness running in production. Clare shares some lessons learned from building agents at scale, shifting to a model-driven architecture, and what comes next as the LLMs that underpin agents continue to improve. By Cl…", "blog": "InfoQ Architecture & Design", "published": "2026-07-20", "tags": ["agents", "warstory"]}, {"title": "Analyzing the evidence that helps businesses win “product not received” disputes", "url": "https://stripe.com/blog/analyzing-the-evidence-that-helps-businesses-win-product-not-received-disputes", "summary": "To understand what can influence win rates, we analyzed evidence packets from one million disputes over a 16-week period. Here’s what the data shows and what it means for how you mitigate disputes.", "blog": "Stripe Engineering", "published": "2026-07-21", "tags": []}]}}, "DOCS": {"morning": "# AI/ML Morning Brief\n\n**Week of Jul 5, 2026**\n\n## 1) AI Architecture — Top Developments\n\n- **Cloudflare postmortem:** BYOIP pipeline change withdrew 25% of customer BGP prefixes; \"fail small\" re-architecture underway. [Cloudflare](https://blog.cloudflare.com/cloudflare-outage-february-20-2026/)\n- **Netflix ships \"Upper\" metamodel** — unified data architecture enforcing consistency across content-engineering services. [InfoQ](https://www.infoq.com/news/2025/12/netflix-upper-uda-architecture/)\n- **\"Code as the harness\" gains ground** — wrap agents in executable/verifiable/stateful scaffolding, not bigger prompts. [arXiv](https://arxiv.org/pdf/2605.18747)\n- **Incident-comms benchmark:** Pragmatic Engineer flags Cloudflare's postmortem as the gold standard. [Pragmatic Engineer](https://blog.pragmaticengineer.com/the-pulse-cloudflare-takes-down-half-the-internet/)\n\n## 2) AI Agents — Key News\n\n- **Microsoft \"Frontier\"** — new AI-deployment company; $2.5B, 6,000 experts, enterprise rollouts. [TechCrunch](https://techcrunch.com/2026/07/02/microsoft-launches-its-own-ai-deployment-company-with-2-5-billion-commitment/)\n- **NVIDIA × ServiceNow** — autonomous enterprise agents launched. [NVIDIA](https://blogs.nvidia.com/blog/servicenow-autonomous-ai-agents-enterprises/)\n- **Anthropic Claude Sonnet 5** live (Jun 30); default for Free/Pro Jul 1. [BuildFast](https://www.buildfastwithai.com/blogs/ai-news-today-july-1-2026)\n- **OpenClaw** — self-extending agent tops GitHub star charts; ClawHub 13k+ skills; supply-chain risk flagged. [GitHub](https://github.com/openclaw/openclaw)\n- **Theme:** demos → workflow replacement; \"Super Agents\" unify siloed agents (Levi's). [PYMNTS](https://www.pymnts.com/news/artificial-intelligence/2026/super-agents-are-connecting-what-enterprise-software-kept-separate/)\n\n## 3) Hugging Face Daily Papers — Top Highlights\n\n- **Scaling the Horizon, Not the Parameters** — trillion-param performance from a 35B agent. [HF](https://huggingface.co/papers/trending)\n- **TACO** — Tool-Augmented Credit Optimization for agentic tool use. [HF](https://huggingface.co/papers/trending)\n- **MIMFlow** — masked image modeling + normalizing flows for end-to-end image gen. [HF](https://huggingface.co/papers/trending)\n- **Volume:** ~20 trending/day, 612 for the month. [HF Papers](https://huggingface.co/papers)\n\n## 4) AI Investments — Major Funding\n\n- **Together AI** — $800M Series C, ~$8.3B post-money; Amazon, Aramco, Blackstone in. [Tech Startups](https://techstartups.com/2026/07/02/venture-capital-startup-funding-roundup-july-2-2026/)\n- **Quantum Systems** — $1.2B Series D (Jul 2); defense/autonomous, Munich. [Funding News](https://blog.mean.ceo/ai-startup-funding-news-july-2026/)\n- **Macro:** H1'26 global VC record $510B, AI-led; Q1 ~$300B. [Crunchbase](https://news.crunchbase.com/venture/record-breaking-funding-ai-global-q1-2026/)\n\n## 5) Impact of AI on the Stock Market — Market Moves\n\n- **Chips:** AI semi complex +$2T value YTD; SOX +47% YTD. [Intellectia](https://intellectia.ai/blog/ai-semiconductor-stocks-rally-july-2026)\n- **NVDA:** Q1 FY27 rev $81.6B (+85% YoY); nearing 52-wk high; leadership broadening. [Zacks](https://www.zacks.com/stock/news/2916674/nvidia-shares-rally-toward-52-week-high-buy-more-or-lock-in-gains)\n- **MU:** HBM sold out for 2026; ~$1,089 record (+700% YoY, +11% wk). [StocksDownUnder](https://stocksdownunder.com/why-micron-stock-is-surging-sold-out-ai-memory/)\n- **AMD / QCOM:** double-digit surges; BofA lifts semi TAM to $1.3T. [Intellectia](https://intellectia.ai/blog/ai-semiconductor-stocks-rally-july-2026)\n\n## 6) Curated Technical AI/ML Papers\n\n- **Jun 2026 — Code as Agent Harness** — [2605.18747](https://arxiv.org/pdf/2605.18747) — Survey: code as executable/verifiable/stateful scaffolding for reliable agents.\n- **Jun 2026 — Coding Benchmarks Are Misaligned with Agentic SWE** — [2606.17799](https://arxiv.org/pdf/2606.17799) — Argues popular benchmarks miss what real agentic engineering requires.\n- **Jun 2026 — Layer-Isolated Evaluation** — [2606.11686](https://arxiv.org/pdf/2606.11686) — No-LLM, regression-locked harness gating a production LLM agent.\n- **Apr 2026 — Autonomous Debugging + Dynamic Analysis** — [2604.24212](https://arxiv.org/pdf/2604.24212) — Debugging agents reason over runtime behavior, not just source.\n- **Jan 2026 — Bug-Reproduction Test Cogeneration** — [2601.19066](https://arxiv.org/pdf/2601.19066) — Generates a failing repro test alongside each agent-produced fix.\n- **Jul 2025 — SWE-Exp** — [2507.23361](https://arxiv.org/pdf/2507.23361) — Issue-resolution agents accumulate experience across tasks instead of starting cold.\n\n---\n*Sources: web search, Jul 5 2026. Dates approximate to publication month.*\n", "strategy": "# ↗ Strategy Signals — Talking Points for the Room\n\n**For having a say in your company's AI strategy.** Concise, sourced signals framed as *what to raise* with leadership — not just news.\n\n## Where the money says the puck is going\n\n- **Enterprise agents move from demos to deployment** — Microsoft stood up a $2.5B \"Frontier\" org purely to *deploy* enterprise AI. Signal: the bottleneck is now integration + rollout, not model access. *Raise:* are we resourcing deployment/ops, not just pilots? [TechCrunch](https://techcrunch.com/2026/07/02/microsoft-launches-its-own-ai-deployment-company-with-2-5-billion-commitment/)\n- **Agents get embedded in systems of record** — NVIDIA × ServiceNow shipped autonomous enterprise agents. *Raise:* which of our workflows are agent-ready, and who owns guardrails? [NVIDIA](https://blogs.nvidia.com/blog/servicenow-autonomous-ai-agents-enterprises/)\n- **\"Super Agents\" unify siloed tools** — Levi's is connecting per-function agents into one interface. *Raise:* do we have an agent-integration layer, or N disconnected copilots? [PYMNTS](https://www.pymnts.com/news/artificial-intelligence/2026/super-agents-are-connecting-what-enterprise-software-kept-separate/)\n\n## Infra & cost reality (your retrieval/serving lens)\n\n- **Inference infra is where capital is flowing** — Together AI raised $800M. *Raise:* build vs. buy for our serving/retrieval stack. [Tech Startups](https://techstartups.com/2026/07/02/venture-capital-startup-funding-roundup-july-2-2026/)\n- **Memory is the constraint** — HBM sold out for 2026; semiconductor TAM lifted toward $1.3T. *Raise:* capacity-plan index growth and GPU memory now, not Q4. [Intellectia](https://intellectia.ai/blog/ai-semiconductor-stocks-rally-july-2026)\n\n## Adoption pattern worth copying\n\n- **Winners map one messy process, add human review, prove time/error savings** — then expand. *Raise:* pick one high-friction workflow and instrument it before scaling AI across teams. [Agentic.ai](https://agentic.ai/news)\n\n## What to advocate internally (your edge)\n\n- **Eval harnesses before autonomy** — gate agents with regression-locked, no-LLM tests.\n- **Retrieval cost controls** — hybrid search + rerank budgets; measure tokens per resolved query.\n- **Guardrails on agent PRs** — treat autonomous code changes as a review/attack surface.\n\n---\n*Signals as of the week of the digest; refreshed weekly. Frame these as questions in strategy discussions, not conclusions.*\n", "playbook": "# 🛠 AI Engineering Playbook\n\n**How to get the most from AI in software engineering** — concrete, tested moves for cutting cost, shipping faster, and keeping output trustworthy. Grounded in current best practices and real practitioner reports from this week's HN threads.\n\n## Cut token usage (and cost)\n\n- **Turn on prompt caching** — Anthropic caching bills cached input at ~0.1x (a 90% discount) and now auto-caches multi-turn chats. Biggest single lever for repeated context. [Token Optimize](https://www.tokenoptimize.dev/guides/llm-token-optimization-strategies)\n- **Compact mid-session** — use summarize/compaction so the context window doesn't grow unbounded; a long session gets squeezed into a compact recap. [Redis](https://redis.io/blog/llm-token-optimization-speed-up-apps/)\n- **Persist memory across sessions** — curated memory turns a 50K-token reload into a few hundred tokens. Have the agent maintain its own `plan.md`/docs so it isn't reliant on one session's context. [Token Optimize](https://www.tokenoptimize.dev/guides/context-engineering-reduce-token-usage)\n- **Compress & mask tool output** — logs, files, and RAG chunks compress 60–95% before hitting the model; mask irrelevant tool results instead of pasting them whole. [CoddyKit](https://www.coddykit.com/pages/blog-detail?id=512865&slug=how-to-cut-llm-token-usage-by-90-with-context-compression-a-step-by-step-guide)\n- **Retrieve, don't pack** — fetch only relevant chunks on demand from a vector store rather than stuffing the whole history in the prompt. [LogRocket](https://blog.logrocket.com/stop-wasting-ai-tokens-10-ways-to-reduce-usage/)\n- **Compile fuzzy calls into local functions** — for repeated LLM-API tasks (parse logs, repair JSON, rank by intent), compile the spec into a local \"fuzzy function\" to reclaim locality, reproducibility, and price. [Program-as-Weights](https://arxiv.org/abs/2607.02512)\n- **Minify agent state** — state-in-context agents shrink dramatically with minification/context-pruning. [Minification](https://arxiv.org/pdf/2606.01326) · [Context Pruning](https://arxiv.org/pdf/2605.15315)\n\n## Speed up feature development\n\n- **Plan before you code** — collapse ~20 ambiguous decisions into one reviewed spec so each lands near 100% instead of 80%. The cheapest speed-up there is. [Claude Code Docs](https://code.claude.com/docs/en/best-practices)\n- **Delegate to subagents** — a subagent explores in its own context and reports back a compressed summary, keeping the main session clean and fast (great for large read/exploration tasks). [SmartScope](https://smartscope.blog/en/generative-ai/claude/claude-code-best-practices-advanced-2026/)\n- **Chain the SDLC as skills** — brainstorm → worktree → implementation plan → subagent execution → TDD → review-before-merge (e.g., the \"Superpowers\" collection). [duet.so](https://duet.so/guides/claude-code-skills-complete-guide)\n- **Enforce TDD with hooks** — a deterministic red-green-refactor loop (write failing test → watch it fail → make it pass) via hooks/state machine yields regression-proof code; one HN dev built a 300k-line SaaS this way. [HN](https://news.ycombinator.com/item?id=48413629)\n- **Use a second model as reviewer** — several devs run Codex to review Claude Code output (or vice-versa) as a cheap quality gate. [HN](https://news.ycombinator.com/item?id=48413629)\n\n## Skills to add to a project (and how to manage them)\n\n- **Check skills into the repo** — keep them under `.agents/skills/`, versioned and reviewed via PR, so every contributor inherits the project's conventions automatically. [Developers Digest](https://www.developersdigest.tech/blog/best-claude-code-skills-2026)\n- **Keep 8–12, audit monthly** — that covers most of a senior dev's day; beyond that you pay a \"context tax.\" Delete any skill you haven't triggered in 30 days. [SmartScope](https://smartscope.blog/en/generative-ai/claude/claude-code-best-practices-advanced-2026/)\n- **Right tool for the job** — *Skills* = how to do something; *MCP* = access to external systems; *Subagents* = delegate to a specialist with its own context. [duet.so](https://duet.so/guides/claude-code-skills-complete-guide)\n- **High-ROI starter skills:** branch/PR review, test generation, CI/CD setup, spec-driven scaffolding, incident triage, changelog/release notes, and a repo-conventions linter.\n\n## Keep AI output trustworthy\n\n- **Treat the agent as a fallible teammate** — extensive unit/automation tests, static analysis (e.g., SonarQube), and CI gates on everything merged to main. [HN](https://news.ycombinator.com/item?id=48445024)\n- **Guard the review surface** — autonomous agents that ship code across many PRs are a real attack surface (a payload can be timed across commits); keep human review and CI gating tight. [Distributed Attacks in Persistent-State AI Control](https://arxiv.org/abs/2607.02514)\n- **Prefer deterministic scripts** — for repeatable ops (deploys, scaffolding), have the agent run pre-built scripts instead of improvising API calls, so results are consistent every time. [HN](https://news.ycombinator.com/item?id=48445024)\n\n## Manage context\n\n- **Rules close to the repo** — put project rules where the code lives; keep prompts short and task-specific rather than \"heroic\" mega-prompts. [HN](https://news.ycombinator.com/item?id=48445024)\n- **Watch for context bloat** — too much in context degrades output; lean context beats a kitchen-sink of skills/MCPs. [HN](https://news.ycombinator.com/item?id=48413629)\n\n## Anti-patterns to avoid\n\n- **Vibe coding without the rest of the software** — code isn't the whole product; skipping docs, tests, and design catches up fast.\n- **Skill hoarding** — untriggered skills/MCPs just tax your context window.\n- **Skim reviews** — pattern-skimming misses duplication, bloat, and inconsistent naming that quietly drain productivity.\n- **Burning tokens on non-AI work** — if a plain shell script does the job, automate it without the model.\n\n---\n*Sources: current best-practice guides + practitioner reports from this week's Hacker News threads and arXiv papers in your digest.*\n", "podcast": "# ◇ Story Desk — This Week's Angles\n\nAngles worth developing from this week's items — for a talk, a post, or a deep-dive. Each has a hook, an angle type, talking points, who to talk to, and a source. Biased toward retrieval, agents, and production reality.\n\n## 1. Seconds → milliseconds: Netflix's Cassandra latency fix  *(War Story · LEAD)*\nHook: a classic read-latency nightmare at scale — and the partitioning change that fixed it.\n- What caused seconds-long reads, and how they diagnosed it.\n- The partition/data-model change and its trade-offs.\n- What transfers to any large-index or vector store you run.\n- When to fix the data model vs. throw hardware at it.\nWho to talk to: an engineer who's run large stateful data stores. [InfoQ](https://www.infoq.com/news/2026/07/netflix-cassandra-partition/)\n\n## 2. Memory that survives the session: semantic persistence for LLM workflows  *(Tool/Workflow)*\nHook: RAG isn't just retrieval — it's persisting *workflow knowledge* so agents don't start cold.\n- \"Workflow as Knowledge\": what to persist and how to index it.\n- Where hybrid/semantic retrieval helps vs. hurts in agent memory.\n- Cost and staleness trade-offs of long-lived indexes.\nWho to talk to: a retrieval/RAG practitioner (your wheelhouse). [arXiv](http://arxiv.org/abs/2607.08740v1)\n\n## 3. Serving agents at scale: scheduling when every turn hits an LLM  *(War Story)*\nHook: agentic chat in production lives or dies on scheduling and tail latency.\n- SMetric's session-centric scheduling for serving agents.\n- Throughput vs. per-session fairness; what breaks under load.\n- Guardrails for cost blowups when agents loop.\nWho to talk to: an infra/serving engineer. [arXiv](http://arxiv.org/abs/2607.08565v1)\n\n## 4. Postgres → ClickHouse: when your database stops keeping up  *(War Story)*\nHook: the honest version of a migration story — why they switched and what it cost.\n- Signals it was time to move off Postgres.\n- What ClickHouse bought them, and the sharp edges.\n- How they de-risked the cutover.\nWho to talk to: an engineer who's led a datastore migration. [InfoQ](https://www.infoq.com/news/2026/07/momentic-postgres-clickhouse/)\n\n## 5. TDD with AI, for real: Datadog's test-driven production migration  *(Tool/Workflow)*\nHook: a concrete, reviewable way to use AI coding tools without \"vibe coding\" in prod.\n- The test-first loop that kept the migration safe.\n- Where human review stayed non-negotiable.\n- What made it repeatable vs. a one-off.\nWho to talk to: someone shipping AI-assisted migrations. [InfoQ](https://www.infoq.com/news/2026/07/datadog-ai-production-migration/)\n\n## 6. Latency vs. cost: the multi-region architecture trade-off  *(Architecture)*\nHook: the decision every scaling team faces, laid out with the real trade-offs.\n- What actually drives the latency/cost curve.\n- Patterns that fail quietly at multi-region scale.\n- A decision framework you can reuse Monday.\nWho to talk to: an architect who's run multi-region systems. [InfoQ](https://www.infoq.com/articles/multi-region-latency-cost-tradeoffs/)\n\n---\n**Lead with #1** — a concrete, high-stakes latency war story hooks engineers instantly and frames the whole \"production reality\" theme. #2 and #3 are your retrieval/agents depth plays.\n"}, "WEEK": "2026-07-27"};
const DIGEST = BUNDLE.DIGEST, DOCS = BUNDLE.DOCS;
const VIEWS = [
  { key: "morning",   label: "◉ Morning Brief",    type: "md",   doc: "morning" },
  { key: "retrieval", label: "⌕ Retrieval Desk",   type: "desk", tag: "retrieval" },
  { key: "agents",    label: "⛓ Agents in Prod",   type: "desk", tag: "agents" },
  { key: "warstory",  label: "⚠ War Stories",      type: "desk", tag: "warstory" },
  { key: "strategy",  label: "↗ Strategy Signals", type: "md",   doc: "strategy" },
  { key: "playbook",  label: "⚙ Playbook",         type: "md",   doc: "playbook" },
  { key: "podcast",   label: "◇ Story Desk",       type: "md",   doc: "podcast" },
];
const SRC_LABEL = { arxiv: "arXiv", blogs: "Blog", github: "GitHub", hackernews: "HN" };
let tab = "morning";
const esc = s => (s || "").replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function itemsByTag(tag) {
  const src = DIGEST.sources || {}; const out = [];
  for (const k of Object.keys(src)) for (const it of (src[k] || [])) if ((it.tags || []).includes(tag)) out.push({ it, src: k });
  return out;
}
function tabButton(v, count) {
  const div = document.createElement("div");
  div.className = "tab" + (v.key === tab ? " active" : "");
  div.innerHTML = v.label + (count != null ? ` <span class="count">${count}</span>` : "");
  div.onclick = () => { tab = v.key; renderTabs(); renderItems(); };
  return div;
}
function renderTabs() {
  const el = document.getElementById("tabs"); el.innerHTML = "";
  for (const v of VIEWS) {
    if (v.type === "desk") { const c = itemsByTag(v.tag).length; if (!c) continue; el.appendChild(tabButton(v, c)); }
    else el.appendChild(tabButton(v, null));
  }
}
function mdToHtml(md) {
  const lines = (md || "").replace(/\r/g, "").split("\n"); let html = "", inList = false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*(.+?)\*/g, "<em>$1</em>");
  const cl = () => { if (inList) { html += "</ul>"; inList = false; } };
  for (const raw of lines) { const line = raw.trimEnd();
    if (/^#{1,6}\s/.test(line)) { cl(); const lvl = line.match(/^#+/)[0].length; html += `<h${lvl} class="md-h">${inline(line.replace(/^#+\s/, ""))}</h${lvl}>`; }
    else if (/^---+$/.test(line)) { cl(); html += "<hr>"; }
    else if (/^[-*]\s/.test(line)) { if (!inList) { html += '<ul class="md-ul">'; inList = true; } html += `<li>${inline(line.replace(/^[-*]\s/, ""))}</li>`; }
    else if (line === "") { cl(); } else { cl(); html += `<p class="md-p">${inline(line)}</p>`; } }
  cl(); return html;
}
function badge(t) { return `<span class="badge">${esc(String(t))}</span>`; }
function deskCard(it, srcKey) {
  const title = `<a class="title" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`;
  let meta = [`<span class="badge src">${esc(SRC_LABEL[srcKey] || srcKey)}</span>`];
  if (srcKey === "arxiv")  meta.push(badge(it.authors || "—"), badge(it.published));
  if (srcKey === "blogs")  meta.push(badge(it.blog || "blog"), badge(it.published || ""));
  if (srcKey === "github") meta.push(badge("★ " + (it.stars ?? 0)), badge(it.language || "—"));
  let extra = "";
  if (srcKey === "hackernews") {
    meta.push(badge((it.comments ?? 0) + " comments"), `<a class="badge" href="${esc(it.hn_url)}" target="_blank" rel="noopener">HN thread</a>`);
    if (it.discussion_summary) {
      const quotes = (it.top_comments || []).map(c => `<div class="quote">“${esc(c.text)}”<span class="who"> — ${esc(c.author)}</span></div>`).join("");
      extra = `<div class="disc"><div class="disc-h">💬 What people are saying</div><div class="disc-body">${esc(it.discussion_summary)}</div>${quotes}</div>`;
    }
  }
  const summary = it.summary ? `<div class="summary">${esc(it.summary)}</div>` : "";
  return `<div class="card">${title}${summary}${extra}<div class="meta">${meta.join("")}</div></div>`;
}
function renderItems() {
  const root = document.getElementById("content");
  const view = VIEWS.find(v => v.key === tab) || VIEWS[0];
  if (view.type === "md") {
    const md = DOCS[view.doc];
    root.innerHTML = md ? `<div class="brief">${mdToHtml(md)}</div>` : `<div class="empty">Not in this edition.</div>`;
    return;
  }
  const rows = itemsByTag(view.tag);
  root.innerHTML = rows.length ? rows.map(r => deskCard(r.it, r.src)).join("") : `<div class="empty">No items on this desk this week.</div>`;
}
document.getElementById("weeklabel").textContent = BUNDLE.WEEK ? "Week of " + BUNDLE.WEEK : "";
renderTabs(); renderItems();
</script>
