 {"title": "Alteron: A Tool for Behavioral Regression Testing Across NLP Classifier Versions", "url": "http://arxiv.org/abs/2607.29557v1", "summary": "Evaluating evolving Natural Language Processing (NLP) models is important for ensuring reliable behavior across updates, but standard benchmark metrics do not fully capture how model behavior changes across versions. Existing work has focused mainly on testing models in isolation rather than comparing successive versions in continuous integration workflows. We present Alteron, a tool for detecting…", "authors": "Shazzad Hossain, Proma Chowdhury, Mridha Md. Nafis Fuad", "published": "2026-07-31", "tags": []}, {"title": "COntExt: Towards Context-Aware Ontology Extension from Operational Metrics", "url": "http://arxiv.org/abs/2607.29553v1", "summary": "Organizations increasingly define operational metrics in structured, machine-readable formats to monitor systems, processes, and compliance. These metric definitions implicitly encode domain knowledge, such as referencing concepts, properties, and relationships, that often extends what is captured in formal ontologies. Yet the connection between operational metric catalogues and ontological knowle…", "authors": "Hussain Hussain, Stefan Schöberl, Angelika Schneider, Verena Geist", "published": "2026-07-31", "tags": []}, {"title": "Improving the Understandability of Conceptual Models via Abstract Notation Engineering", "url": "http://arxiv.org/abs/2607.29552v1", "summary": "Conceptual modeling supports the design, analysis, and communication of the properties of complex systems, yet conceptual models can be difficult to understand when domain-level abstractions must be encoded through low-level constructs required mainly for semantic conformity. Prior work has mainly improved how existing individual constructs are visually represented. We shift the focus from individ…", "authors": "Amine Abbad-Andaloussi, Daniel Jeppe Schütt, Kasper Solhøj Jørgensen, Tobias van Deurs Lundsgaard", "published": "2026-07-31", "tags": []}, {"title": "AMTFV: Agentic Mathematical Tool-Flow Verification for LLM Self-Correction", "url": "http://arxiv.org/abs/2607.29549v1", "summary": "Large language models have demonstrated strong mathematical problem-solving capabilities, yet reliably verifying their candidate answers remains challenging. Existing representative methods mainly revise outputs through natural-language reflection or assist verification by directly generating verification programs; the former may not reliably support exact computation, whereas the latter premature…", "authors": "Rui Zou, Yutao Zhu, Mengqi Wei, Ji-Rong Wen", "published": "2026-07-31", "tags": ["agents"]}, {"title": "ARB: A Matched Authorship-Rewriting Benchmark Dataset for AI-Text Detector Evaluation", "url": "http://arxiv.org/abs/2607.29539v1", "summary": "Standard AI-text detection benchmarks compare human-written text against text generated directly by large language models (LLMs). While prior work has shown that rewriting and paraphrasing can degrade detector performance, it remains unclear whether performance measured on this conventional benchmark predicts detector behavior when human-authored content is rewritten by an LLM. To address this gap…", "authors": "Gaetano Perrone, Simon Pietro Romano", "published": "2026-07-31", "tags": []}, {"title": "AuditCoder: Responsibility-Preserving Task Graphs for Auditable Code Generation and Bounded Repair", "url": "http://arxiv.org/abs/2607.29529v1", "summary": "Code generators return programs, but typically do not preserve the construction record needed to connect a failure to the decision that produced the affected code or to delimit a justified repair. We present AuditCoder, which treats the program and an auditable construction trace as joint outputs. Before code generation, a contract-annotated task graph assigns stable responsibility identities that…", "authors": "Kangjie Huang, Chen Lyu", "published": "2026-07-31", "tags": []}, {"title": "TerraNova: A Foundation Model for the Anthropocene", "url": "http://arxiv.org/abs/2607.29527v1", "summary": "A defining problem of the Anthropocene is to model the physical Earth and human societies as one coupled system, yet no learned representation spans their observational breadth. We argue the obstacle is geometric: the physical Earth is measured as continuous fields that ignore political borders, whereas societies are reported for administrative units. Earth-system foundation models serve the first…", "authors": "Carlos Rodriguez-Pardo, Massimo Tavoni", "published": "2026-07-31", "tags": []}, {"title": "Students' Practices and Skills in the LLM-Era: \"You Can't Outsource the Struggle and Still Get the Skill\"", "url": "http://arxiv.org/abs/2607.29519v1", "summary": "Generative AI tools have been rapidly learned in the daily workflow of graduate students in Software Engineering, but little is known about what AI-related skills they actually need for effective use in empirical research. Without this understanding, graduate programs cannot prepare students to conduct rig-orous research in the LLM era, risking creating a generation of researchers who delegate tas…", "authors": "Enne Rebeca Silva de Freitas, Gustavo Pinto, Danilo Monteiro", "published": "2026-07-31", "tags": []}, {"title": "From Code Review to Code Critique: Intent, Drift, and Spotlight for AI-Generated Diffs at Scale", "url": "http://arxiv.org/abs/2607.29516v1", "summary": "AI coding agents are generating code at volumes that exceed the capacity of traditional peer review. At the same time, existing AI code review tools over-index on low-value suggestions such as style and best practices while under-indexing on the concerns human reviewers prioritize most: correctness, security, and performance. We present ARCTIC, an AI-powered Code Critique system that reframes code…", "authors": "Chandra Maddila, Mashrur Rashik, Euna Mehnaz Khan, Smriti Jha", "published": "2026-07-31", "tags": ["agent yond Retrieval: Analytic Memory for Multimodal Agents", "url": "http://arxiv.org/abs/2607.29440v1", "summary": "Long-term multimodal memory must support not only retrieving relevant information but also computing over observations accumulated across interactions. Existing systems largely emphasize \\emph{retrieval memory}, organizing interaction histories through summaries and indexes to return query-relevant information at multiple granularities, from high-level abstractions to underlying records. In this p…", "authors": "Zhoujin Tian, Yao Tian, Hao Zhang, Cheng Chen", "published": "2026-07-31", "tags": ["retrieval"]}, {"title": "ModelEquivBench: Certifying Multi-Relational Evaluation of LLM-Generated Optimization Models", "url": "http://arxiv.org/abs/2607.29431v1", "summary": "Large language models increasingly generate optimization models from natural language, but existing evaluation often reduces a generated model and its ground truth to a single equivalent/not-equivalent verdict or an execution-success rate--labels that are neither independently checkable nor faithful to the multiple distinct senses in which two formulations can agree. We present ModelEquivBench, a …", "authors": "Penglin Zhu, Jungang Xu", "published": "2026-07-31", "tags": []}, {"title": "AgenticRepair: Multi-Faceted Program Context Engineering for Agentic Vulnerability Repair", "url": "http://arxiv.org/abs/2607.29422v1", "summary": "Automated vulnerability repair aims to reduce the time and effort required to patch security flaws from a vulnerability triage report. Recent agentic AI approaches have shown promising results in automated program repair. However, vulnerability repair demands richer program context than general bug repair - context that security engineers routinely assemble in practice but that existing agentic ap…", "authors": "Michael Fu, Qiyue Mei, Patanamon Thongtanunam, Kla Tantithamthavorn", "published": "2026-07-31", "tags": []}, {"title": "Explore Beyond the Boundary Using Entropic Information", "url": "http://arxiv.org/abs/2607.29419v1", "summary": "In reinforcement learning, exploration with sparse and delayed rewards presents a significant challenge due to the limited feedback available for guiding the learning process. Addressing this issue requires extensive exploration in the state space to discover valuable reward signals. In this paper, we propose Entropic Information for Exploration (ENTINEX), a novel method that enhances exploration …", "authors": "Bumgeun Park, Donghwan Lee", "published": "2026-07-31", "tags": []}, {"title": "Beyond Component Testing: Validating Agentic AI Systems", "url": "http://arxiv.org/abs/2607.29405v1", "summary": "Agentic AI systems act through multi-step trajectories that combine planning, tool use, memory, interaction, and adaptation. This behavior stretches validation practice beyond component testing and one-shot input--output evaluation, because acceptable system behavior now depends on how decisions unfold over time and under changing environmental conditions. This survey synthesizes 257 papers spanni…", "authors": "Fabio Orazio Mirto, Luca D'Agati, Giuseppe Tricomi, Stefano Silvestri", "published": "2026-07-31", "tags": []}, {"title": "Dense Temporal Contrast Synthesis via Conditioned Latent Transport", "url": "http://arxiv.org/abs/2607.29394v1", "summary": "Dynamic contrast-enhanced magnetic resonance imaging (DCE-MRI) is essential for breast cancer management, but reliance on gadolinium-based contrast agents (GBCAs) restricts use in contraindicated populations, prolongs scan protocols, and presents environmental toxicity concerns. Contrast synthesis offers a non-invasive alternative; however, existing approaches struggle to balance spatial realism w…", "authors": "Smriti Joshi, Apostolia Tsirikoglou, Daniel M. Lang, Richard Osuala", "published": "2026-07-31", "tags": []}, {"title": "Simulation Code Generation for Fluid Systems using Large Language Models: Benchmarking Models and Prompting Strategies", "url": "http://arxiv.org/abs/2607.29389v1", "summary": "Large language models (LLMs) have demonstrated a strong ability to generate syntactically correct code from natural-language specifications. In this study, we explore how LLMs can be harnessed to automatically translate a neutral graph representation of fluid system models into executable code for two widely adopted simulation environments: the Python library WNTR and the Modelica Standard Library…", "authors": "Jan Marius Stürmer, Jascha Knack, Tobias Koch, Andreas Weinmann", "published": "2026-07-31", "tags": []}], "github": [{"title": "yc-software/qm", "url": "https://github.com/yc-software/qm", "summary": "Multiplayer agent harness for work", "stars": 8240, "language": "TypeScript", "published": "2026-07-29", "tags": []}, {"title": "trycompai/crm", "url": "https://github.com/trycompai/crm", "summary": "An open-source, agentic-first CRM.", "stars": 2113, "language": "TypeScript", "published": "2026-07-31", "tags": []}, {"title": "gavamedia/deltafin", "url": "https://github.com/gavamedia/deltafin", "summary": "Run full Kimi K3 on a single device. And an OpenAI-compatible API server for local chat and coding agents.", "stars": 636, "language": "Rust", "published": "2026-07-28", "tags": []}, {"title": "FareedKhan-dev/kimi-k3-in-c", "url": "https://github.com/FareedKhan-dev/kimi-k3-in-c", "summary": "A 2.78-trillion-parameter Kimi K3 running inference on a single CPU in 8.24 GB of RAM. Portable C99: no BLAS, no framework, no GPU.", "stars": 598, "language": "C", "published": "2026-08-01", "tags": []}, {"title": "0xwilliamortiz/ponytail-improved", "url": "https://github.com/0xwilliamortiz/ponytail-improved", "summary": "Makes your AI agent think like the laziest senior dev in the room. The best code is the code you never wrote.", "stars": 581, "language": "JavaScript", "published": "2026-07-28", "tags": []}, {"title": "0xwilliamortiz/humanizer-cli", "url": "https://github.com/0xwilliamortiz/humanizer d your Y/whatever else. Until you …"}, {"author": "20k", "text": ">People with the attitude you demonstrate here are consistently among the worst-behaved and hardest-to-deal-with participants on the meta site, because of a stubborn refusal to accept a core principle of the site. Most edits I saw to answers on stack overflow were crap though, the system was regularly abused That stubb…"}, {"author": "kazinator", "text": "These kinds of incidents always remind me of https://wiki.c2.com/?KornShellStory"}, {"author": "DrewADesign", "text": "Sorry, I’m not going to read your >1000 word reply. So far the only thing you’ve convinced me of is that I’d accurately gauged how zealously out-of-touch the people behind that mess were. Have a good one."}], "discussion_summary": "", "tags": []}, {"title": "AI companies are shredding rare books", "url": "https://twitter.com/HedgieMarkets/status/2081534588485296565", "summary": "", "points": 798, "comments": 513, "hn_url": "https://news.ycombinator.com/item?id=49068738", "published": "2026-07-27", "top_comments": [{"author": "59percentmore", "text": "No, it doesn't, and no, they weren't. They were depicted as more comfortable and capable with the technology that they'd never known a world without. Some adults weren't able to keep up, but some (most) were. If children had really become fundamentally smarter, the hierarchy of authority would have been upended, and it…"}, {"author": "firen777", "text": "> access and ease of sharing I'm gonna sound argumentative, but what happen if you lose access to computers in general? The thumb drive or hard disk or whatever will just become a magical rock you cannot communicate with. Honestly, given... recent world developments, I'm starting to doubt the robustness of digital medi…"}, {"author": "streetfighter64", "text": "https://news.ycombinator.com/item?id=49073042 > an 18th century botanical text that there's only 2 copies of in existence. > books that had little in common, except for the fact that they all had ISBNs. This seller also sells rare books that do not have ISBNs, and none of those were part of the bulk purchases Wow, that…"}, {"author": "streetfighter64", "text": "Again, what's more technically feasible? Setting up a DRM-cracking LLM and manually verifying that it's actually succeeded for each and every DRM scheme you encounter, or just throwing the books in a regular old office scanner and being sure it works without even checking..."}, {"author": "streetfighter64", "text": "Well, destroying them once they already exist is reasonable, but producing garbage (e.g. great quantities of unsold books) on a \"massive scale\" is completely unreasonable though. But that's a larger problem that encompasses single use packaging and all the other plastic garbage we're producing all the time."}, {"author": "rolandog", "text": "I think that we all have varying degrees of The Knack [0]. [0]: https://youtu.be/g8vHhgh6oM0?t=50"}], "discussion_summary": "", "tags": []}, {"title": "Are we offloading too much of our thinking to AI?", "url": "https://www.artfish.ai/p/offloading-thinking-to-ai", "summary": "", "points": 526, "comments": 480, "hn_url": "https://news.ycombinator.com/item?id=48908178", "published": "2026-07-14", "top_comments": [{"author": "Rendello", "text": "I'm abhorrent at arithmetic and I think it affects me greatly. I know quite a few people who are barely literate and manage to get by in life, but it obviously makes things hard for them and strips them of opportunities (and they forego holding any identity that seems to \"smart\" for themselves). I think numeracy is sim…"}, {"author": "nsxwolf", "text": "My hope is they would have read some expert sources and gained some of the expertise required to analyze the issue properly. We don’t seem to do that anymore."}, {"author": "confidantlake", "text": "My father's generation had much more leisure time than my generation. When he was out of the office at 5pm work stopped. There were no laptops, slack pings, etc, etc. Vacations were longer, pensions were a thing. You could get a job supporting a family right out of high school. Things have absolutely gotten worse in th…"}, {"author": "nathias", "text": "I'm not sure how much does the total production of bicycles consume, but I don't see how it's relevant for the use."}, {"author": "customguy", "text": "it is simply one meaning of the word, and you talking about something else instead a waste of time."}], "discussion_summary": "", "tags": []}, {"title": "GLM 5.2 and the coming AI margin collapse", "url": "https://martinalderson.com/posts/the-upcoming-ai-margin-collapse-part-1-glm-5-2/", "summary": "", "points": 694, "comments": 469, "hn_url": "https://news.ycombinator.com/item?id=48809877", "published": "2026-07-06", "top_comments": [{"author": "ryukoposting", "text": "Reading Yegge's post made me crack a smile. He's beating the \"we need Kubernetes for agents!\" drum so damn hard and people aren't responding. I'm certain it's because 95% of the people he's talking to have no clue what Kubernetes actually does. They just know it's there. Hell, every time I type \"Kubernetes\" I'm reminde…"}, {"author": "gnarbarian", "text": "you don't know me very well lol. You're right of course when you're talking about people. I believe there is a lot of low-hanging fruit for optimizing the performance of these models. that's actually what my startup is doing."}, {"author": "Paradigma11", "text": "Because then people will just flock to open weight models that are even cheaper and Anthropic/OpenAI will go bankrupt. Then somebody will buy those companies for cents on the dollar and run a profitable token selling business for today's prices without doing any new research. New model releases will slow to a crawl but…"}, {"author": "rdbl27", "text": "The case of Sweden entirely falsifies the theory that \"it would've been much worse without government action.\" No government action whatsoever was taken in Sweden. None. Death rates were no better or worse than adjacent countries that intervened extensively. Ergo, government intervention was irrelevant one way or anoth…"}, {"author": "andriy_koval", "text": "I agree is that money is an issue, but not geo-boundaries. If EU decides to commit XXXB they may have a chance to catch up eventually."}, {"author": "ben_w", "text": "Great for us here in Europe, but an even bigger reason for Apple to be upset about it."}], "discussion_summary": "", "tags": []}], "blogs": [{"title": "Modeling Device Capabilities for Analytics", "url": "https://netflixtechblog.com/modeling-device-capabilities-for-analytics-e7607acebde8?source=rss----2615bd06b42e---4", "summary": "", "blog": "Netflix TechBlog", "published": "2026-07-31", "tags": []}, {"title": "GenRec: Towards LLM-Native Recommendation at Netflix", "url": "https://netflixtechblog.com/genrec-towards-llm-native-recommendation-at-netflix-f20be6f643e3?source=rss----2615bd06b42e---4", "summary": "", "blog": "Netflix TechBlog", "published": "2026-07-30", "tags": []}, {"title": "Welcome to Agents Week", "url": "https://blog.cloudflare.com/agents-week-welcome/", "summary": "Agents Week explores how cloud infrastructure must evolve to serve autonomous agents rather than human browsers. Join us as we unpack the storage, execution, and security primitives needed for an agent-native web.", "blog": "Cloudflare Blog", "published": "2026-08-02", "tags": ["agents"]}, {"title": "An API for MoQ: provision your own isolated relays", "url": "https://blog.cloudflare.com/moq-relays/", "summary": "Last year we made every Cloudflare server a Media over QUIC (MoQ) relay. Now the new provisioning API lets you create your own isolated relay and control who can publish and who can only watch.", "blog": "Cloudflare Blog", "published": "2026-07-31", "tags": []}, {"title": "Dogfooding at scale: migrating cdnjs to Cloudflare’s Developer Platform", "url": "https://blog.cloudflare.com/cdnjs-dev-platform-migration/", "summary": "We moved cdnjs, serving 9 billion requests a day, entirely onto Cloudflare's Developer Platform. That means we’re running one of the Internet's busiest open-source CDNs on our own building blocks, and we pushed Workflows and Workers limits higher for everyone.", "blog": "Cloudflare Blog", "published": "2026-07-30", "tags": ["warstory"]}, {"title": "Post-quantum authentication to origins is now supported", "url": "https://blog.cloudflare.com/post-quantum-authentication-to-origins/", "summary": "Cloudflare now supports post-quantum (PQ) authentication when connecting to customer origin servers via Authenticated Origin Pulls and Custom Origin Trust Store. This is the first step towards providing PQ authentication for all Cloudflare products.", "blog": "Cloudflare Blog", "published": "2026-07-29", "tags": []}, {"title": "Natural disasters and government interference: examining Q2 2026’s major Internet disruption events", "url": "https://blog.cloudflare.com/q2-2026-internet-disruption-summary/", "summary": "Cloudflare Radar tracked Internet disruptions driven by natural disasters, government-mandated shutdowns, and DNSSEC key rollovers over the last quarter. This post analyzes traffic telemetry to explain how these events impacted global connectivity.", "blog": "Cloudflare Blog", "published": "2026-07-28", "tags": []}, {"title": "We’re open-sourcing our privacy proxy CLI", "url": "https://blog.cloudflare.com/open-sourcing-our-privacy-proxy-cli/", "summary": "pvcli is a curl-like tool designed to simplify the testing of complex privacy protocols like OHTTP.", "blog": "Cloudflare Blog", "published": "2026-07-27", "tags": []}, {"title": "The Conductor Developer", "url": "https://martinfowler.com/rachels-ramblings/conductor-developer.html", "summary": "TL;DR Why I think software development is starting to feel a little more like conducting an orchestra. There’s a shift happening in software development that I don’t think we’re talking about clearly enough. For the last couple of years we’ve framed AI as a productivity tool. How much faster can it write code? How many more features can we ship? How much cheaper can we build software? I think that…", "blog": "Martin Fowler", "published": "2026-07-31", "tags": []}, {"title": "The Economic Benefit of Refactoring", "url": "https://martinfowler.com/articles/exploring-gen-ai/refactoring-economic-benefit.html", "summary": "Giles Edwards-Alexander does an experiment to see if decomposing a large function helps reduce token costs, suggesting that is may now be possible to measure the economic benefit of refactoring more…", "blog": "Martin Fowler", "published": "2026-07-30", "tags": []}, {"title": "The Orchestrator's Tax", "url": "https://martinfowler.com/articles/orchestrator-tax.html", "summary": "Subagents get justified by time saved and parallel execution, but Rahul Garg explains that's not what matters most. Every token in the orchestrator's context is competing for its attention, and the real value of a subagent is what it keeps out of that context. Subagents should be treated as a tool for protecting the orchestrator's working memory, offloading reasoning it doesn't need to hold onto. …", "blog": "Martin Fowler", "published": "2026-07-28", "tags": ["agents"]}, {"title": "Why I’m Writing Rachel’s Ramblings", "url": "https://martinfowler.com/rachels-ramblings/intro.html", "summary": "TL;DR I have ideas. I haven’t been writing them. That’s about to change. I promise… myself. I’ve been thinking a lot about talent. Actually, I’ve been thinking a lot about thinking. And writing. Or more specifically, not writing. This really hit me earlier this year at the Future of Software conference. I was surrounded by people sharing their latest ideas and I had a slightly uncomfortable realiz…", "blog": "Martin Fowler", "published": "2026-07-28", "tags": []}, {"title": "HashiCorp Ships Public Beta of Vault Kubernetes Key Management", "url": "https://www.infoq.com/news/2026/08/vault-kubernetes-key-management/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "HashiCorp has released a public beta of Vault Kubernetes key management, a KMS v2-compatible plugin that lets the Kubernetes API server delegate envelope encryption to Vault Enterprise, moving the key encryption keys that protect etcd data out of the cluster and into a separately governed trust domain. By Mark Silvester", "blog": "InfoQ Architecture & Design", "published": "2026-08-03", "tags": []}, {"title": "Presentation: Architecting AI Systems for the Messy Reality of Enterprises: Why Agentic Compute is the Missing Layer", "url": "https://www.infoq.com/presentations/agentic-compute/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Arun Joseph shares real-world insights on scaling enterprise agentic platforms like Deutsche Telekom’s LMOS. He discusses bridging organizational fault lines, replacing tool sprawl with core platform abstractions, and moving beyond basic chatbots to operational intelligence systems through ephemeral agents and an Agent Definition Language (ADL). By Arun Joseph", "blog": "InfoQ Architecture & Design", "published": "2026-08-03", "tags": ["agents", "warstory"]}, {"title": "Embabel Agent Framework Reaches 1.0", "url": "https://www.infoq.com/news/2026/08/embabel-1/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Embabel has reached its 1.0 release, providing a framework for AI agents on Java It allows Java and Kotlin developers to define agents as typed domain objects. Built on Spring AI, Embabel supports multiple model providers and combines planning with predefined state machines, offering flexibility for agent workflows. By Erik Costlow", "blog": "InfoQ Architecture & Design", "published": "2026-08-03", "tags": ["agents"]}, {"title": "Cloudflare Introduces Meerkat for Strongly Consistent Global Coordination", "url": "https://www.infoq.com/news/2026/08/cloudflare-meerkat-consensus/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Cloudflare recently introduced Meerkat, an internal globally consistent control-plane service based on the QuePaxa consensus algorithm. Unlike Raft, it allows leaderless writes while preserving strong consistency, improving availability across Cloudflare's global network. By Renato Losio", "blog": "InfoQ Architecture & Design", "published": "2026-08-02", "tags": []}, {"title": "Dropbox Integrates MCP and Dash to Close the Gap Between Security Design and Code Review", "url": "https://www.infoq.com/news/2026/07/dropbox-mcp-ai-code-review/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Dropbox has integrated Model Context Protocol (MCP) with its internal knowledge platform, Dash, to surface security design context during AI assisted code reviews. The system retrieves threat models and security requirements for pull requests, helping reviewers validate implementation against design intent. An InfoQ Q&A explores the architecture and key lessons learned. By Leela Kumili", "blog": "InfoQ Architecture & Design", "published": "2026-07-31", "tags": ["agents", "warstory"]}, {"title": "Presentation: The Free-Lunch Guide to Idea Circularity", "url": "https://www.infoq.com/presentations/tech-hype-cycles-architectural-tradeoffs/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Holly Cummins discusses why \"nothing is new under the sun\" in tech. She maps historical architectural tradeoffs to modern cloud, microservices, and AI hype cycles. She connects financial debt (post-ZIRP) and technical debt to epistemic and sleep debt, showing engineering leaders how to navigate shifts in assumptions, embrace sustainability, and revive proven engineering disciplines. By Holly Cummi…", "blog": "InfoQ Architecture & Design", "published": "2026-07-31", "tags": []}, {"title": "Article: Virtual Threads After JDK 24: What Changed for Production Java", "url": "https://www.infoq.com/articles/virtual-threads-after-jdk24/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "JDK 24 removed the monitor-related carrier-thread pinning that stalled Netflix and similar teams on Java 21. What has replaced it on JDK 25 LTS is downstream-resource saturation: The bottleneck moved and now demands explicit bounding in application code. This article maps the failure modes that surface after virtual-thread adoption and gives a practical sequence backed by a public benchmark. By Sa…", "blog": "InfoQ Architecture & Design", "published": "2026-07-31", "tags": ["warstory"]}, {"title": "Presentation: Parting the Clouds: The Rise of Disaggregated Systems", "url": "https://www.infoq.com/presentations/disaggregation-industrial-systems/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Murat Demirbas discusses the shift toward disaggregated cloud database architectures driven by cloud economics. He explains how decoupling compute from storage enables elastic scaling, cost efficiency, and fault isolation. He shares how classical Paxos roles foreshadowed disaggregation, while analyzing network tradeoffs, shared-memory evolution, and self-assembling database designs. By Murat Demir…", "blog": "InfoQ Architecture & Design", "published": "2026-07-30", "tags": ["warstory"]}, {"title": "AWS Lambda's Self-Managed Code Storage Lifts the Account Quota, Not the Function Size Limit", "url": "https://www.infoq.com/news/2026/07/lambda-self-managed-storage/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "AWS Lambda can now reference deployment packages directly in customer-owned S3 buckets, removing the per-Region code storage quota and raising the managed default from 75 GB to 300 GB. Per-function package limits are unchanged, and UpdateFunctionCode is still required after replacing an object. Terraform provider support remains an open enhancement request. By Steef-Jan Wiggers", "blog": "InfoQ Architecture & Design", "published": "2026-07-30", "tags": []}, {"title": "Cloudflare Makes Internal DNS Generally Available", "url": "https://www.infoq.com/news/2026/07/cloudflare-internal-dns/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Cloudflare has launched its Internal DNS service, providing authoritative and recursive DNS for private networks. This service simplifies DNS management by consolidating private and public DNS operations on a single platform. By Gianmarco Nalin", "blog": "InfoQ Architecture & Design", "published": "2026-07-29", "tags": []}, {"title": "Article: Securing MCP in Production: Defense-in-Depth Beyond the Gateway", "url": "https://www.infoq.com/articles/securing-mcp-production-gateway/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "This article presents a defense-in-depth approach for securing Model Context Protocol (MCP) deployments in production. It outlines four architectural control layers: safe execution, management infrastructure, outbound trust, and semantic integrity, arguing that production security requires enforcement beyond the gateway at the earliest trustworthy control points. By Nik Kale", "blog": "InfoQ Architecture & Design", "published": "2026-07-29", "tags": ["agents"]}, {"title": "Article: The Hard-Stop Rule: From 3 HCM Monoliths to 120 Domain Microservices", "url": "https://www.infoq.com/articles/pull-based-migration/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "A payroll and HR software team rebuilt three monoliths into over 120 smaller services over five years, with no dedicated migration budget. Every new feature was built as its own service instead of changing the old ones. The article covers the pull-based migration, the tools that made this possible, how costs were kept down, and the problems the team ran into along the way. By Prashanth Pasham", "blog": "InfoQ Architecture & Design", "published": "2026-07-28", "tags": ["warstory"]}, {"title": "AWS Launches Amazon GuardDuty Investigation Agent to Automate Threat Triage", "url": "https://www.infoq.com/news/2026/07/guardduty-investigation-agent/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "AWS released a public preview of the GuardDuty investigation agent, which correlates findings, 90-day activity logs, and resource topologies into structured reports with risk ratings, confidence scores, and MITRE ATT&CK classification. It is reachable through the AWS MCP Server, so investigations can run from agentic tooling. Preview quotas cap usage at 10 investigations per account per day. By St…", "blog": "InfoQ Architecture & Design", "published": "2026-07-28", "tags": ["agents"]}, {"title": "Uber’s Zero Growth Stack: Scaling Services, While Optimising Infrastructure and AI Cost", "url": "https://www.infoq.com/news/2026/07/efficient-ai-infrastructure/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "Uber's \"Zero Growth Stack\" focuses on scalable infrastructure that separates capacity growth from business demand, reducing hardware needs while enhancing service scaling. Central to this is garbage collection optimisation. Additionally, generative AI is integrated into development, elevating developer productivity while introducing cost management measures to maintain economic efficiency. By Olim…", "blog": "InfoQ Architecture & Design", "published": "2026-07-28", "tags": ["warstory"]}, {"title": "Java News Roundup: Simple JSON API, JEPs for JDK 28, Oracle CPUs, Embabel 1.0, Azul Payara, Helidon", "url": "https://www.infoq.com/news/2026/07/java-news-roundup-jul20-2026/?utm_campaign=infoq_content&utm_source=infoq&utm_medium=feed&utm_term=Architecture+%26+Design", "summary": "This week's Java roundup for July 20th, 2026, features news highlighting: two JEPs proposed to target for JDK 28; new JEPs 540 and 541, Simple JSON API (Incubator) and Deprecate the macOS/x64 Port for Removal, respectively; the July 2026 Critical Patch Update; the GA release of Embable 1.0; Azul Payara 7.2.0; and Helidon 4.5.1. By Michael Redlich", "blog": "InfoQ Architecture & Design", "published": "2026-07-27", "tags": []}, {"title": "Don&#8217;t stop early: Case-folding source code at memory speed", "url": "https://github.blog/engineering/architecture-optimization/dont-stop-early-case-folding-source-code-at-memory-speed/", "summary": "How a branch-free loop and byte-space arithmetic let GitHub case-fold every byte of code search at >45 GiB/s on a single core. The post Don&#8217;t stop early: Case-folding source code at memory speed appeared first on The GitHub Blog .", "blog": "The GitHub Blog (Engineering)", "published": "2026-07-29", "tags": []}, {"title": "Tame Dependabot: Group your updates, slow the cadence, keep security fast", "url": "https://github.blog/security/supply-chain-security/tame-dependabot-group-your-updates-slow-the-cadence-keep-security-fast/", "summary": "Dependabot keeps your dependencies current, but its defaults can flood your repository with pull requests. Here's how grouping updates, slowing the cadence, and keeping security fixes fast cut the noise on a Microsoft open source project. The post Tame Dependabot: Group your updates, slow the cadence, keep security fast appeared first on The GitHub Blog .", "blog": "The GitHub Blog (Engineering)", "published": "2026-07-28", "tags": []}]}}, "DOCS": {"morning": "# AI/ML Morning Brief\n\n**Week of Jul 5, 2026**\n\n## 1) AI Architecture — Top Developments\n\n- **Cloudflare postmortem:** BYOIP pipeline change withdrew 25% of customer BGP prefixes; \"fail small\" re-architecture underway. [Cloudflare](https://blog.cloudflare.com/cloudflare-outage-february-20-2026/)\n- **Netflix ships \"Upper\" metamodel** — unified data architecture enforcing consistency across content-engineering services. [InfoQ](https://www.infoq.com/news/2025/12/netflix-upper-uda-architecture/)\n- **\"Code as the harness\" gains ground** — wrap agents in executable/verifiable/stateful scaffolding, not bigger prompts. [arXiv](https://arxiv.org/pdf/2605.18747)\n- **Incident-comms benchmark:** Pragmatic Engineer flags Cloudflare's postmortem as the gold standard. [Pragmatic Engineer](https://blog.pragmaticengineer.com/the-pulse-cloudflare-takes-down-half-the-internet/)\n\n## 2) AI Agents — Key News\n\n- **Microsoft \"Frontier\"** — new AI-deployment company; $2.5B, 6,000 experts, enterprise rollouts. [TechCrunch](https://techcrunch.com/2026/07/02/microsoft-launches-its-own-ai-deployment-company-with-2-5-billion-commitment/)\n- **NVIDIA × ServiceNow** — autonomous enterprise agents launched. [NVIDIA](https://blogs.nvidia.com/blog/servicenow-autonomous-ai-agents-enterprises/)\n- **Anthropic Claude Sonnet 5** live (Jun 30); default for Free/Pro Jul 1. [BuildFast](https://www.buildfastwithai.com/blogs/ai-news-today-july-1-2026)\n- **OpenClaw** — self-extending agent tops GitHub star charts; ClawHub 13k+ skills; supply-chain risk flagged. [GitHub](https://github.com/openclaw/openclaw)\n- **Theme:** demos → workflow replacement; \"Super Agents\" unify siloed agents (Levi's). [PYMNTS](https://www.pymnts.com/news/artificial-intelligence/2026/super-agents-are-connecting-what-enterprise-software-kept-separate/)\n\n## 3) Hugging Face Daily Papers — Top Highlights\n\n- **Scaling the Horizon, Not the Parameters** — trillion-param performance from a 35B agent. [HF](https://huggingface.co/papers/trending)\n- **TACO** — Tool-Augmented Credit Optimization for agentic tool use. [HF](https://huggingface.co/papers/trending)\n- **MIMFlow** — masked image modeling + normalizing flows for end-to-end image gen. [HF](https://huggingface.co/papers/trending)\n- **Volume:** ~20 trending/day, 612 for the month. [HF Papers](https://huggingface.co/papers)\n\n## 4) AI Investments — Major Funding\n\n- **Together AI** — $800M Series C, ~$8.3B post-money; Amazon, Aramco, Blackstone in. [Tech Startups](https://techstartups.com/2026/07/02/venture-capital-startup-funding-roundup-july-2-2026/)\n- **Quantum Systems** — $1.2B Series D (Jul 2); defense/autonomous, Munich. [Funding News](https://blog.mean.ceo/ai-startup-funding-news-july-2026/)\n- **Macro:** H1'26 global VC record $510B, AI-led; Q1 ~$300B. [Crunchbase](https://news.crunchbase.com/venture/record-breaking-funding-ai-global-q1-2026/)\n\n## 5) Impact of AI on the Stock Market — Market Moves\n\n- **Chips:** AI semi complex +$2T value YTD; SOX +47% YTD. [Intellectia](https://intellectia.ai/blog/ai-semiconductor-stocks-rally-july-2026)\n- **NVDA:** Q1 FY27 rev $81.6B (+85% YoY); nearing 52-wk high; leadership broadening. [Zacks](https://www.zacks.com/stock/news/2916674/nvidia-shares-rally-toward-52-week-high-buy-more-or-lock-in-gains)\n- **MU:** HBM sold out for 2026; ~$1,089 record (+700% YoY, +11% wk). [StocksDownUnder](https://stocksdownunder.com/why-micron-stock-is-surging-sold-out-ai-memory/)\n- **AMD / QCOM:** double-digit surges; BofA lifts semi TAM to $1.3T. [Intellectia](https://intellectia.ai/blog/ai-semiconductor-stocks-rally-july-2026)\n\n## 6) Curated Technical AI/ML Papers\n\n- **Jun 2026 — Code as Agent Harness** — [2605.18747](https://arxiv.org/pdf/2605.18747) — Survey: code as executable/verifiable/stateful scaffolding for reliable agents.\n- **Jun 2026 — Coding Benchmarks Are Misaligned with Agentic SWE** — [2606.17799](https://arxiv.org/pdf/2606.17799) — Argues popular benchmarks miss what real agentic engineering requires.\n- **Jun 2026 — Layer-Isolated Evaluation** — [2606.11686](https://arxiv.org/pdf/2606.11686) — No-LLM, regression-locked harness gating a production LLM agent.\n- **Apr 2026 — Autonomous Debugging + Dynamic Analysis** — [2604.24212](https://arxiv.org/pdf/2604.24212) — Debugging agents reason over runtime behavior, not just source.\n- **Jan 2026 — Bug-Reproduction Test Cogeneration** — [2601.19066](https://arxiv.org/pdf/2601.19066) — Generates a failing repro test alongside each agent-produced fix.\n- **Jul 2025 — SWE-Exp** — [2507.23361](https://arxiv.org/pdf/2507.23361) — Issue-resolution agents accumulate experience across tasks instead of starting cold.\n\n---\n*Sources: web search, Jul 5 2026. Dates approximate to publication month.*\n", "strategy": "# ↗ Strategy Signals — Talking Points for the Room\n\n**For having a say in your company's AI strategy.** Concise, sourced signals framed as *what to raise* with leadership — not just news.\n\n## Where the money says the puck is going\n\n- **Enterprise agents move from demos to deployment** — Microsoft stood up a $2.5B \"Frontier\" org purely to *deploy* enterprise AI. Signal: the bottleneck is now integration + rollout, not model access. *Raise:* are we resourcing deployment/ops, not just pilots? [TechCrunch](https://techcrunch.com/2026/07/02/microsoft-launches-its-own-ai-deployment-company-with-2-5-billion-commitment/)\n- **Agents get embedded in systems of record** — NVIDIA × ServiceNow shipped autonomous enterprise agents. *Raise:* which of our workflows are agent-ready, and who owns guardrails? [NVIDIA](https://blogs.nvidia.com/blog/servicenow-autonomous-ai-agents-enterprises/)\n- **\"Super Agents\" unify siloed tools** — Levi's is connecting per-function agents into one interface. *Raise:* do we have an agent-integration layer, or N disconnected copilots? [PYMNTS](https://www.pymnts.com/news/artificial-intelligence/2026/super-agents-are-connecting-what-enterprise-software-kept-separate/)\n\n## Infra & cost reality (your retrieval/serving lens)\n\n- **Inference infra is where capital is flowing** — Together AI raised $800M. *Raise:* build vs. buy for our serving/retrieval stack. [Tech Startups](https://techstartups.com/2026/07/02/venture-capital-startup-funding-roundup-july-2-2026/)\n- **Memory is the constraint** — HBM sold out for 2026; semiconductor TAM lifted toward $1.3T. *Raise:* capacity-plan index growth and GPU memory now, not Q4. [Intellectia](https://intellectia.ai/blog/ai-semiconductor-stocks-rally-july-2026)\n\n## Adoption pattern worth copying\n\n- **Winners map one messy process, add human review, prove time/error savings** — then expand. *Raise:* pick one high-friction workflow and instrument it before scaling AI across teams. [Agentic.ai](https://agentic.ai/news)\n\n## What to advocate internally (your edge)\n\n- **Eval harnesses before autonomy** — gate agents with regression-locked, no-LLM tests.\n- **Retrieval cost controls** — hybrid search + rerank budgets; measure tokens per resolved query.\n- **Guardrails on agent PRs** — treat autonomous code changes as a review/attack surface.\n\n---\n*Signals as of the week of the digest; refreshed weekly. Frame these as questions in strategy discussions, not conclusions.*\n", "playbook": "# 🛠 AI Engineering Playbook\n\n**How to get the most from AI in software engineering** — concrete, tested moves for cutting cost, shipping faster, and keeping output trustworthy. Grounded in current best practices and real practitioner reports from this week's HN threads.\n\n## Cut token usage (and cost)\n\n- **Turn on prompt caching** — Anthropic caching bills cached input at ~0.1x (a 90% discount) and now auto-caches multi-turn chats. Biggest single lever for repeated context. [Token Optimize](https://www.tokenoptimize.dev/guides/llm-token-optimization-strategies)\n- **Compact mid-session** — use summarize/compaction so the context window doesn't grow unbounded; a long session gets squeezed into a compact recap. [Redis](https://redis.io/blog/llm-token-optimization-speed-up-apps/)\n- **Persist memory across sessions** — curated memory turns a 50K-token reload into a few hundred tokens. Have the agent maintain its own `plan.md`/docs so it isn't reliant on one session's context. [Token Optimize](https://www.tokenoptimize.dev/guides/context-engineering-reduce-token-usage)\n- **Compress & mask tool output** — logs, files, and RAG chunks compress 60–95% before hitting the model; mask irrelevant tool results instead of pasting them whole. [CoddyKit](https://www.coddykit.com/pages/blog-detail?id=512865&slug=how-to-cut-llm-token-usage-by-90-with-context-compression-a-step-by-step-guide)\n- **Retrieve, don't pack** — fetch only relevant chunks on demand from a vector store rather than stuffing the whole history in the prompt. [LogRocket](https://blog.logrocket.com/stop-wasting-ai-tokens-10-ways-to-reduce-usage/)\n- **Compile fuzzy calls into local functions** — for repeated LLM-API tasks (parse logs, repair JSON, rank by intent), compile the spec into a local \"fuzzy function\" to reclaim locality, reproducibility, and price. [Program-as-Weights](https://arxiv.org/abs/2607.02512)\n- **Minify agent state** — state-in-context agents shrink dramatically with minification/context-pruning. [Minification](https://arxiv.org/pdf/2606.01326) · [Context Pruning](https://arxiv.org/pdf/2605.15315)\n\n## Speed up feature development\n\n- **Plan before you code** — collapse ~20 ambiguous decisions into one reviewed spec so each lands near 100% instead of 80%. The cheapest speed-up there is. [Claude Code Docs](https://code.claude.com/docs/en/best-practices)\n- **Delegate to subagents** — a subagent explores in its own context and reports back a compressed summary, keeping the main session clean and fast (great for large read/exploration tasks). [SmartScope](https://smartscope.blog/en/generative-ai/claude/claude-code-best-practices-advanced-2026/)\n- **Chain the SDLC as skills** — brainstorm → worktree → implementation plan → subagent execution → TDD → review-before-merge (e.g., the \"Superpowers\" collection). [duet.so](https://duet.so/guides/claude-code-skills-complete-guide)\n- **Enforce TDD with hooks** — a deterministic red-green-refactor loop (write failing test → watch it fail → make it pass) via hooks/state machine yields regression-proof code; one HN dev built a 300k-line SaaS this way. [HN](https://news.ycombinator.com/item?id=48413629)\n- **Use a second model as reviewer** — several devs run Codex to review Claude Code output (or vice-versa) as a cheap quality gate. [HN](https://news.ycombinator.com/item?id=48413629)\n\n## Skills to add to a project (and how to manage them)\n\n- **Check skills into the repo** — keep them under `.agents/skills/`, versioned and reviewed via PR, so every contributor inherits the project's conventions automatically. [Developers Digest](https://www.developersdigest.tech/blog/best-claude-code-skills-2026)\n- **Keep 8–12, audit monthly** — that covers most of a senior dev's day; beyond that you pay a \"context tax.\" Delete any skill you haven't triggered in 30 days. [SmartScope](https://smartscope.blog/en/generative-ai/claude/claude-code-best-practices-advanced-2026/)\n- **Right tool for the job** — *Skills* = how to do something; *MCP* = access to external systems; *Subagents* = delegate to a specialist with its own context. [duet.so](https://duet.so/guides/claude-code-skills-complete-guide)\n- **High-ROI starter skills:** branch/PR review, test generation, CI/CD setup, spec-driven scaffolding, incident triage, changelog/release notes, and a repo-conventions linter.\n\n## Keep AI output trustworthy\n\n- **Treat the agent as a fallible teammate** — extensive unit/automation tests, static analysis (e.g., SonarQube), and CI gates on everything merged to main. [HN](https://news.ycombinator.com/item?id=48445024)\n- **Guard the review surface** — autonomous agents that ship code across many PRs are a real attack surface (a payload can be timed across commits); keep human review and CI gating tight. [Distributed Attacks in Persistent-State AI Control](https://arxiv.org/abs/2607.02514)\n- **Prefer deterministic scripts** — for repeatable ops (deploys, scaffolding), have the agent run pre-built scripts instead of improvising API calls, so results are consistent every time. [HN](https://news.ycombinator.com/item?id=48445024)\n\n## Manage context\n\n- **Rules close to the repo** — put project rules where the code lives; keep prompts short and task-specific rather than \"heroic\" mega-prompts. [HN](https://news.ycombinator.com/item?id=48445024)\n- **Watch for context bloat** — too much in context degrades output; lean context beats a kitchen-sink of skills/MCPs. [HN](https://news.ycombinator.com/item?id=48413629)\n\n## Anti-patterns to avoid\n\n- **Vibe coding without the rest of the software** — code isn't the whole product; skipping docs, tests, and design catches up fast.\n- **Skill hoarding** — untriggered skills/MCPs just tax your context window.\n- **Skim reviews** — pattern-skimming misses duplication, bloat, and inconsistent naming that quietly drain productivity.\n- **Burning tokens on non-AI work** — if a plain shell script does the job, automate it without the model.\n\n---\n*Sources: current best-practice guides + practitioner reports from this week's Hacker News threads and arXiv papers in your digest.*\n", "podcast": "# ◇ Story Desk — This Week's Angles\n\nAngles worth developing from this week's items — for a talk, a post, or a deep-dive. Each has a hook, an angle type, talking points, who to talk to, and a source. Biased toward retrieval, agents, and production reality.\n\n## 1. Seconds → milliseconds: Netflix's Cassandra latency fix  *(War Story · LEAD)*\nHook: a classic read-latency nightmare at scale — and the partitioning change that fixed it.\n- What caused seconds-long reads, and how they diagnosed it.\n- The partition/data-model change and its trade-offs.\n- What transfers to any large-index or vector store you run.\n- When to fix the data model vs. throw hardware at it.\nWho to talk to: an engineer who's run large stateful data stores. [InfoQ](https://www.infoq.com/news/2026/07/netflix-cassandra-partition/)\n\n## 2. Memory that survives the session: semantic persistence for LLM workflows  *(Tool/Workflow)*\nHook: RAG isn't just retrieval — it's persisting *workflow knowledge* so agents don't start cold.\n- \"Workflow as Knowledge\": what to persist and how to index it.\n- Where hybrid/semantic retrieval helps vs. hurts in agent memory.\n- Cost and staleness trade-offs of long-lived indexes.\nWho to talk to: a retrieval/RAG practitioner (your wheelhouse). [arXiv](http://arxiv.org/abs/2607.08740v1)\n\n## 3. Serving agents at scale: scheduling when every turn hits an LLM  *(War Story)*\nHook: agentic chat in production lives or dies on scheduling and tail latency.\n- SMetric's session-centric scheduling for serving agents.\n- Throughput vs. per-session fairness; what breaks under load.\n- Guardrails for cost blowups when agents loop.\nWho to talk to: an infra/serving engineer. [arXiv](http://arxiv.org/abs/2607.08565v1)\n\n## 4. Postgres → ClickHouse: when your database stops keeping up  *(War Story)*\nHook: the honest version of a migration story — why they switched and what it cost.\n- Signals it was time to move off Postgres.\n- What ClickHouse bought them, and the sharp edges.\n- How they de-risked the cutover.\nWho to talk to: an engineer who's led a datastore migration. [InfoQ](https://www.infoq.com/news/2026/07/momentic-postgres-clickhouse/)\n\n## 5. TDD with AI, for real: Datadog's test-driven production migration  *(Tool/Workflow)*\nHook: a concrete, reviewable way to use AI coding tools without \"vibe coding\" in prod.\n- The test-first loop that kept the migration safe.\n- Where human review stayed non-negotiable.\n- What made it repeatable vs. a one-off.\nWho to talk to: someone shipping AI-assisted migrations. [InfoQ](https://www.infoq.com/news/2026/07/datadog-ai-production-migration/)\n\n## 6. Latency vs. cost: the multi-region architecture trade-off  *(Architecture)*\nHook: the decision every scaling team faces, laid out with the real trade-offs.\n- What actually drives the latency/cost curve.\n- Patterns that fail quietly at multi-region scale.\n- A decision framework you can reuse Monday.\nWho to talk to: an architect who's run multi-region systems. [InfoQ](https://www.infoq.com/articles/multi-region-latency-cost-tradeoffs/)\n\n---\n**Lead with #1** — a concrete, high-stakes latency war story hooks engineers instantly and frames the whole \"production reality\" theme. #2 and #3 are your retrieval/agents depth plays.\n"}, "WEEK": "2026-08-03"};
const DIGEST = BUNDLE.DIGEST, DOCS = BUNDLE.DOCS;
const VIEWS = [
  { key: "morning",   label: "◉ Morning Brief",    type: "md",   doc: "morning" },
  { key: "retrieval", label: "⌕ Retrieval Desk",   type: "desk", tag: "retrieval" },
  { key: "agents",    label: "⛓ Agents in Prod",   type: "desk", tag: "agents" },
  { key: "warstory",  label: "⚠ War Stories",      type: "desk", tag: "warstory" },
  { key: "strategy",  label: "↗ Strategy Signals", type: "md",   doc: "strategy" },
  { key: "playbook",  label: "⚙ Playbook",         type: "md",   doc: "playbook" },
  { key: "podcast",   label: "◇ Story Desk",       type: "md",   doc: "podcast" },
];
const SRC_LABEL = { arxiv: "arXiv", blogs: "Blog", github: "GitHub", hackernews: "HN" };
let tab = "morning";
const esc = s => (s || "").replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function itemsByTag(tag) {
  const src = DIGEST.sources || {}; const out = [];
  for (const k of Object.keys(src)) for (const it of (src[k] || [])) if ((it.tags || []).includes(tag)) out.push({ it, src: k });
  return out;
}
function tabButton(v, count) {
  const div = document.createElement("div");
  div.className = "tab" + (v.key === tab ? " active" : "");
  div.innerHTML = v.label + (count != null ? ` <span class="count">${count}</span>` : "");
  div.onclick = () => { tab = v.key; renderTabs(); renderItems(); };
  return div;
}
function renderTabs() {
  const el = document.getElementById("tabs"); el.innerHTML = "";
  for (const v of VIEWS) {
    if (v.type === "desk") { const c = itemsByTag(v.tag).length; if (!c) continue; el.appendChild(tabButton(v, c)); }
    else el.appendChild(tabButton(v, null));
  }
}
function mdToHtml(md) {
  const lines = (md || "").replace(/\r/g, "").split("\n"); let html = "", inList = false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*(.+?)\*/g, "<em>$1</em>");
  const cl = () => { if (inList) { html += "</ul>"; inList = false; } };
  for (const raw of lines) { const line = raw.trimEnd();
    if (/^#{1,6}\s/.test(line)) { cl(); const lvl = line.match(/^#+/)[0].length; html += `<h${lvl} class="md-h">${inline(line.replace(/^#+\s/, ""))}</h${lvl}>`; }
    else if (/^---+$/.test(line)) { cl(); html += "<hr>"; }
    else if (/^[-*]\s/.test(line)) { if (!inList) { html += '<ul class="md-ul">'; inList = true; } html += `<li>${inline(line.replace(/^[-*]\s/, ""))}</li>`; }
    else if (line === "") { cl(); } else { cl(); html += `<p class="md-p">${inline(line)}</p>`; } }
  cl(); return html;
}
function badge(t) { return `<span class="badge">${esc(String(t))}</span>`; }
function deskCard(it, srcKey) {
  const title = `<a class="title" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`;
  let meta = [`<span class="badge src">${esc(SRC_LABEL[srcKey] || srcKey)}</span>`];
  if (srcKey === "arxiv")  meta.push(badge(it.authors || "—"), badge(it.published));
  if (srcKey === "blogs")  meta.push(badge(it.blog || "blog"), badge(it.published || ""));
  if (srcKey === "github") meta.push(badge("★ " + (it.stars ?? 0)), badge(it.language || "—"));
  let extra = "";
  if (srcKey === "hackernews") {
    meta.push(badge((it.comments ?? 0) + " comments"), `<a class="badge" href="${esc(it.hn_url)}" target="_blank" rel="noopener">HN thread</a>`);
    if (it.discussion_summary) {
      const quotes = (it.top_comments || []).map(c => `<div class="quote">“${esc(c.text)}”<span class="who"> — ${esc(c.author)}</span></div>`).join("");
      extra = `<div class="disc"><div class="disc-h">💬 What people are saying</div><div class="disc-body">${esc(it.discussion_summary)}</div>${quotes}</div>`;
    }
  }
  const summary = it.summary ? `<div class="summary">${esc(it.summary)}</div>` : "";
  return `<div class="card">${title}${summary}${extra}<div class="meta">${meta.join("")}</div></div>`;
}
function renderItems() {
  const root = document.getElementById("content");
  const view = VIEWS.find(v => v.key === tab) || VIEWS[0];
  if (view.type === "md") {
    const md = DOCS[view.doc];
    root.innerHTML = md ? `<div class="brief">${mdToHtml(md)}</div>` : `<div class="empty">Not in this edition.</div>`;
    return;
  }
  const rows = itemsByTag(view.tag);
  root.innerHTML = rows.length ? rows.map(r => deskCard(r.it, r.src)).join("") : `<div class="empty">No items on this desk this week.</div>`;
}
document.getElementById("weeklabel").textContent = BUNDLE.WEEK ? "Week of " + BUNDLE.WEEK : "";
renderTabs(); renderItems();
</script>
